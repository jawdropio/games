<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>7 isles</title>
<style>
  html, body { margin:0; height:100%; overflow:hidden; color:#fff; font-family:system-ui, sans-serif; user-select:none; -webkit-user-select:none;
    /* the old water, borrowed from the Goldenfield picture */
    background:#2a7bad url("assets/gemini_generated_image_tl4x6jtl4x6jtl4x.jpeg") 0 0 / 17600px auto; }
  #board { position:fixed; left:50%; top:50%; width:100vmin; height:100vmin; transform:translate(-50%,-50%); }
  .spot { position:absolute; width:27%; height:17%; transform:translate(-50%,-50%); box-sizing:border-box;
          border:3px dashed rgba(255,255,255,.7); border-radius:50%; background:rgba(255,255,255,.12);
          display:grid; place-items:center; text-align:center; font-weight:800; font-size:clamp(10px, 1.9vmin, 20px); text-shadow:0 1px 3px rgba(0,0,0,.5); }
  .spot.sand { background:rgba(236,200,120,.55); border-color:#f3d98b; }
  .spot span { display:block; font-size:2.6em; line-height:1; }
  /* A real island picture: no oval, no border, just the island */
  .spot.pic { width:31%; height:auto; border:0; border-radius:0; background:none; display:block; }
  .spot.pic canvas { display:block; width:100%; height:auto; pointer-events:none; }
  .bar { position:fixed; z-index:5; top:12px; }
  #left { left:12px; } #right { right:12px; display:flex; gap:8px; align-items:center; }
  #tools { display:none; gap:8px; align-items:center; }
  body.erasing #tools { display:flex; }
  body.erasing .spot.pic canvas { pointer-events:auto; cursor:crosshair; touch-action:none; }
  #size { width:110px; }
  #eraser.on { background:#e0457b; }
  .btn, .bar a { display:inline-block; background:rgba(18,11,46,.78); color:#fff; border:2px solid rgba(255,255,255,.35); border-radius:12px;
                 padding:8px 14px; font:700 16px system-ui, sans-serif; text-decoration:none; cursor:pointer; }
  .btn:hover, .bar a:hover { background:rgba(60,40,140,.9); }
  #pause { position:fixed; inset:0; z-index:10; background:rgba(18,11,46,.75); display:none; place-items:center; text-align:center; }
  #pause.on { display:grid; }
  #pause h1 { font-size:48px; margin:0 0 14px; }
</style>
</head>
<body>
<div id="board"></div>
<div class="bar" id="left"><a href="../">← Arcade</a></div>
<div class="bar" id="right">
  <span id="tools"><input type="range" id="size" min="10" max="150" value="40" title="Eraser size"><button class="btn" id="undo">↩ Undo</button><button class="btn" id="reset">🗑 Reset</button></span>
  <button class="btn" id="eraser" title="Erase a spot and show water">🧽 Eraser</button>
  <button class="btn" id="pauseBtn" title="Pause (P or Esc)">⏸ Pause</button></div>
<div id="pause"><div><h1>⏸ Paused</h1><button class="btn" id="resume">▶ Keep playing</button></div></div>
<script>
(function () {
  // One spot per island, placed around a circle (first one at the top)
  var ISLANDS = [
    { name: 'Goldenfield', icon: '🌾', pic: 'assets/gemini_generated_image_tl4x6jtl4x6jtl4x.jpeg', kind: 'blue',
      erase: [[-2,91,104,11], [-2,74,24,22], [22,81,20,12], [86,49,18,14], [95,61,4,5], [88,74,11,17]] },   // erase = writing and compass
    { name: 'Bluewater',   icon: '🌊', pic: 'assets/gemini_generated_image-3-.jpeg', kind: 'teal', erase: [[0,0,100,14.6]] },   // erase = the sky
    { name: 'Wildheart',   icon: '🐎', pic: 'assets/gemini_generated_image-4-.jpeg', kind: 'blue',
      heal: [[65,49,12,7], [72.5,61.8,10.5,6.2]],                                                // writing on the grass
      erase: [[-2,92,104,10], [-2,78,38,15], [83,25.5,12,7], [88.5,75,9,15]] },                    // writing, banner, compass in the water
    { name: 'Timberroot',  icon: '🌲' },
    { name: 'Ironhold',    icon: '⛰️', pic: 'assets/gemini_generated_image-5-.jpeg', kind: 'gray',
      heal: [[57.2, 62.9, 11, 8.1, 'warm']],                      // the words on the big sign
      erase: [[0, 0, 43, 9.3], [71, 0, 30, 9.3]] },               // faraway hills on both sides of the peak
    { name: 'Skyreach',    icon: '☁️' },
    { name: 'Duneshade',   icon: '🏜️', sand: true }
  ];
  // Turn a picture into "just the island": the water becomes see-through, writing/sky are erased,
  // and any little floating specks are removed. "kind" tells which kind of water to remove.
  function cutOut(img, spot, isl) {
    var w = img.naturalWidth, h = img.naturalHeight;
    var c = document.createElement('canvas'); c.width = w; c.height = h;
    var g = c.getContext('2d'); g.drawImage(img, 0, 0);
    var d = g.getImageData(0, 0, w, h), px = d.data, i;
    // "heal": writing printed on the grass is painted over with the grass beside it
    (isl.heal || []).forEach(function (e) {
      var x0 = Math.max(0, Math.round(e[0] * w / 100)), x1 = Math.min(w, Math.round((e[0] + e[2]) * w / 100));
      var y0 = Math.max(0, Math.round(e[1] * h / 100)), y1 = Math.min(h, Math.round((e[1] + e[3]) * h / 100));
      var rw = x1 - x0, rh = y1 - y0, m = new Uint8Array(rw * rh), m2 = new Uint8Array(rw * rh), x, y, dx, dy, o;
      for (y = 0; y < rh; y++) for (x = 0; x < rw; x++) {
        o = ((y0 + y) * w + x0 + x) * 4;
        var lo = Math.min(px[o], px[o + 1], px[o + 2]), hi = Math.max(px[o], px[o + 1], px[o + 2]);
        if (e[4] === 'warm' ? (px[o] - px[o + 2] > 30) : (lo > 185 || hi < 70)) m[y * rw + x] = 1;   // letters (white with dark outlines, or orange-ish on a sign)
      }
      for (y = 0; y < rh; y++) for (x = 0; x < rw; x++) if (m[y * rw + x])
        for (dy = -2; dy <= 2; dy++) for (dx = -2; dx <= 2; dx++) {
          var xx = x + dx, yy = y + dy; if (xx >= 0 && xx < rw && yy >= 0 && yy < rh) m2[yy * rw + xx] = 1;
        }
      for (y = 0; y < rh; y++) for (x = 0; x < rw; x++) if (m2[y * rw + x]) {
        var l = x, r2 = x;
        while (l >= 0 && m2[y * rw + l]) l--;
        while (r2 < rw && m2[y * rw + r2]) r2++;
        var a = l >= 0 ? ((y0 + y) * w + x0 + l) * 4 : -1, b2 = r2 < rw ? ((y0 + y) * w + x0 + r2) * 4 : -1;
        o = ((y0 + y) * w + x0 + x) * 4;
        for (var c2 = 0; c2 < 3; c2++) px[o + c2] = a >= 0 && b2 >= 0 ? (px[a + c2] + px[b2 + c2]) / 2 : px[(a >= 0 ? a : b2) + c2];
      }
    });
    for (i = 0; i < px.length; i += 4) {
      var r = px[i], gr = px[i + 1], b = px[i + 2], blue;
      if (isl.kind === 'teal') {                         // bright turquoise sea
        blue = Math.min((b - r - 40) / 30, (Math.max(gr, b) - 135) / 25);
        if ((i / 4 / w) < h * 0.24) blue = Math.max(blue, Math.min((b - r - 8) / 20, (Math.max(gr, b) - 150) / 20));   // pale hazy sea near the horizon
      } else if (isl.kind === 'gray') {                  // dull grey-blue sea
        blue = (gr > b + 2) ? 0 : (b - r - 22) / 10;
      } else {                                           // deep blue sea
        blue = (b - r - 25) / 30;
        if (gr > b + 3) blue = 0;                        // greens and yellows are land
      }
      px[i + 3] = 255 * (1 - Math.max(0, Math.min(1, blue)));
    }
    isl.erase.forEach(function (e) {
      var x0 = Math.max(0, Math.round(e[0] * w / 100)), x1 = Math.min(w, Math.round((e[0] + e[2]) * w / 100));
      var y0 = Math.max(0, Math.round(e[1] * h / 100)), y1 = Math.min(h, Math.round((e[1] + e[3]) * h / 100));
      for (var y = y0; y < y1; y++) for (var x = x0; x < x1; x++) px[(y * w + x) * 4 + 3] = 0;
    });
    // Remove tiny floating bits (sparkles, bubbles, pieces of letters)
    var seen = new Uint8Array(w * h), stack = new Int32Array(w * h), p, n;
    for (var s0 = 0; s0 < w * h; s0++) {
      if (seen[s0] || px[s0 * 4 + 3] < 40) continue;
      var count = 0, list = [], sp = 0; stack[sp++] = s0; seen[s0] = 1;
      while (sp) {
        p = stack[--sp]; list.push(p); count++;
        var x3 = p % w, y3 = (p / w) | 0;
        if (x3 > 0)     { n = p - 1; if (!seen[n] && px[n * 4 + 3] >= 40) { seen[n] = 1; stack[sp++] = n; } }
        if (x3 < w - 1) { n = p + 1; if (!seen[n] && px[n * 4 + 3] >= 40) { seen[n] = 1; stack[sp++] = n; } }
        if (y3 > 0)     { n = p - w; if (!seen[n] && px[n * 4 + 3] >= 40) { seen[n] = 1; stack[sp++] = n; } }
        if (y3 < h - 1) { n = p + w; if (!seen[n] && px[n * 4 + 3] >= 40) { seen[n] = 1; stack[sp++] = n; } }
      }
      if (count < 700) for (var k = 0; k < list.length; k++) px[list[k] * 4 + 3] = 0;
    }
    // Trim the empty edges so the island sits neatly in its spot
    var minX = w, minY = h, maxX = 0, maxY = 0;
    for (var y2 = 0; y2 < h; y2++) for (var x2 = 0; x2 < w; x2++) {
      if (px[(y2 * w + x2) * 4 + 3] > 40) { if (x2 < minX) minX = x2; if (x2 > maxX) maxX = x2; if (y2 < minY) minY = y2; if (y2 > maxY) maxY = y2; }
    }
    g.putImageData(d, 0, 0);
    var out = document.createElement('canvas'); out.width = maxX - minX + 1; out.height = maxY - minY + 1;
    out.getContext('2d').drawImage(c, minX, minY, out.width, out.height, 0, 0, out.width, out.height);
    var base = document.createElement('canvas'); base.width = out.width; base.height = out.height;
    base.getContext('2d').drawImage(out, 0, 0);
    spot.appendChild(out);
    registerEraser(isl.name, out, base, minX, minY);
  }

  // ---- Eraser: rub out any spot of an island and the water shows through ----
  var STORE = '7isles-eraser-v1', strokes = {}, history = [], views = {}, eraserOn = false;
  try { strokes = JSON.parse(localStorage.getItem(STORE)) || {}; } catch (e) { strokes = {}; }
  function saveStrokes() { try { localStorage.setItem(STORE, JSON.stringify(strokes)); } catch (e) {} }
  function paintStroke(v, st) {
    var g = v.out.getContext('2d'), p = st.pts, k;
    g.save(); g.globalCompositeOperation = 'destination-out'; g.lineCap = g.lineJoin = 'round';
    g.lineWidth = st.r * 2; g.fillStyle = '#000';
    g.beginPath(); g.arc(p[0][0] - v.ox, p[0][1] - v.oy, st.r, 0, 7); g.fill();
    g.beginPath(); g.moveTo(p[0][0] - v.ox, p[0][1] - v.oy);
    for (k = 1; k < p.length; k++) g.lineTo(p[k][0] - v.ox, p[k][1] - v.oy);
    g.stroke(); g.restore();
  }
  function redraw(name) {
    var v = views[name], g = v.out.getContext('2d');
    g.clearRect(0, 0, v.out.width, v.out.height); g.drawImage(v.base, 0, 0);
    (strokes[name] || []).forEach(function (st) { paintStroke(v, st); });
  }
  function registerEraser(name, out, base, ox, oy) {
    var v = views[name] = { out: out, base: base, ox: ox, oy: oy };
    (strokes[name] || []).forEach(function (st) { history.push({ name: name, st: st }); });
    redraw(name);
    var cur = null;
    function pt(e) {
      var r = out.getBoundingClientRect(), f = out.width / r.width;
      return [(e.clientX - r.left) * f + ox, (e.clientY - r.top) * f + oy, f];
    }
    out.addEventListener('pointerdown', function (e) {
      if (!eraserOn) return;
      out.setPointerCapture(e.pointerId);
      var q = pt(e), size = +document.getElementById('size').value;
      cur = { r: Math.round(size / 2 * q[2]), pts: [[Math.round(q[0]), Math.round(q[1])]] };
      paintStroke(v, cur);
    });
    out.addEventListener('pointermove', function (e) {
      if (!cur) return;
      var q = pt(e), last = cur.pts[cur.pts.length - 1];
      if (Math.hypot(q[0] - last[0], q[1] - last[1]) < cur.r / 4) return;
      cur.pts.push([Math.round(q[0]), Math.round(q[1])]);
      paintStroke(v, { r: cur.r, pts: cur.pts.slice(-2) });
    });
    function end() {
      if (!cur) return;
      (strokes[name] = strokes[name] || []).push(cur); history.push({ name: name, st: cur }); saveStrokes(); cur = null;
    }
    out.addEventListener('pointerup', end); out.addEventListener('pointercancel', end);
  }

  var board = document.getElementById('board'), R = 38;
  ISLANDS.forEach(function (isl, i) {
    var a = -Math.PI / 2 + i * 2 * Math.PI / ISLANDS.length;
    var s = document.createElement('div');
    s.className = 'spot' + (isl.sand ? ' sand' : '') + (isl.pic ? ' pic' : '');
    s.style.left = (50 + R * Math.cos(a)) + '%'; s.style.top = (50 + R * Math.sin(a)) + '%';
    if (isl.pic) {
      var im = new Image();
      im.onload = function () {
        try { cutOut(im, s, isl); }
        catch (err) { s.innerHTML = '<img src="' + isl.pic + '" style="width:100%">'; }   // fallback: show the plain picture
      };
      im.src = isl.pic;
    } else {
      s.innerHTML = '<div><span>' + isl.icon + '</span>' + isl.name + '</div>';
    }
    board.appendChild(s);
  });

  document.getElementById('eraser').onclick = function () {
    eraserOn = !eraserOn; document.body.classList.toggle('erasing', eraserOn); this.classList.toggle('on', eraserOn);
  };
  document.getElementById('undo').onclick = function () {
    var h = history.pop(); if (!h) return;
    var list = strokes[h.name]; list.splice(list.lastIndexOf(h.st), 1); saveStrokes(); redraw(h.name);
  };
  document.getElementById('reset').onclick = function () {
    if (!confirm('Put back everything you erased?')) return;
    strokes = {}; history = []; saveStrokes(); Object.keys(views).forEach(redraw);
  };

  var el = document.getElementById('pause'), on = false;
  function set(v) { on = v; el.classList.toggle('on', v); }
  document.getElementById('pauseBtn').onclick = function () { set(true); };
  document.getElementById('resume').onclick = function () { set(false); };
  addEventListener('keydown', function (e) { if (e.key === 'p' || e.key === 'P' || e.key === 'Escape') set(!on); });
})();
</script>
</body>
</html>
