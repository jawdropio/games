<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>7 isles</title>
<style>
  html, body { margin:0; height:100%; background:#120b2e; color:#f4f1ff; font-family:system-ui, sans-serif; }
  a { position:fixed; top:12px; left:12px; color:#a99ee0; text-decoration:none; font-weight:700; }
  button { position:fixed; top:8px; right:12px; background:rgba(255,255,255,.12); color:#fff; border:2px solid rgba(255,255,255,.35); border-radius:12px; padding:8px 14px; font:700 16px system-ui, sans-serif; cursor:pointer; }
  #pause { position:fixed; inset:0; background:rgba(18,11,46,.85); display:none; place-items:center; text-align:center; font-size:40px; }
  #pause.on { display:grid; }
</style>
</head>
<body>
<a href="../">← Arcade</a>
<button id="pauseBtn">⏸ Pause</button>
<div id="pause"><div>⏸ Paused<br><button id="resume" style="position:static;margin-top:14px">▶ Keep playing</button></div></div>
<script>
(function () {
  var el = document.getElementById('pause'), on = false;
  function set(v) { on = v; el.classList.toggle('on', v); }
  document.getElementById('pauseBtn').onclick = function () { set(true); };
  document.getElementById('resume').onclick = function () { set(false); };
  addEventListener('keydown', function (e) { if (e.key === 'p' || e.key === 'P' || e.key === 'Escape') set(!on); });
})();
</script>
</body>
</html>
