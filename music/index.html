<!doctype html>
<html lang="en" data-theme="tokyo">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>music</title>
<style>
  :root, [data-theme="tokyo"] { --bg:#16161e; --pane:#1a1b26; --fg:#c0caf5; --dim:#565f89; --bd:#3b4261; --acc:#7aa2f7; --glow:rgba(122,162,247,.16);
    --c0:#f7768e; --c1:#ff9e64; --c2:#e0af68; --c3:#9ece6a; --c4:#7dcfff; --c5:#7aa2f7; --c6:#bb9af7; }
  [data-theme="gruvbox"] { --bg:#1d2021; --pane:#282828; --fg:#ebdbb2; --dim:#928374; --bd:#504945; --acc:#fabd2f; --glow:rgba(250,189,47,.12);
    --c0:#fb4934; --c1:#fe8019; --c2:#fabd2f; --c3:#b8bb26; --c4:#8ec07c; --c5:#83a598; --c6:#d3869b; }
  [data-theme="catppuccin"] { --bg:#181825; --pane:#1e1e2e; --fg:#cdd6f4; --dim:#6c7086; --bd:#45475a; --acc:#cba6f7; --glow:rgba(203,166,247,.16);
    --c0:#f38ba8; --c1:#fab387; --c2:#f9e2af; --c3:#a6e3a1; --c4:#94e2d5; --c5:#89b4fa; --c6:#cba6f7; }
  [data-theme="rosepine"] { --bg:#191724; --pane:#1f1d2e; --fg:#e0def4; --dim:#6e6a86; --bd:#403d52; --acc:#c4a7e7; --glow:rgba(196,167,231,.16);
    --c0:#eb6f92; --c1:#ebbcba; --c2:#f6c177; --c3:#9ccfd8; --c4:#7fb7c9; --c5:#3e8fb0; --c6:#c4a7e7; }

  * { box-sizing:border-box; }
  html, body { margin:0; height:100%; overflow:hidden; background:var(--bg); color:var(--fg);
    font-family:"JetBrains Mono", ui-monospace, "Cascadia Code", Menlo, Consolas, monospace; font-size:14px; user-select:none; -webkit-user-select:none; }
  body { background:radial-gradient(900px 420px at 8% -10%, var(--glow), transparent), radial-gradient(700px 400px at 100% 110%, var(--glow), transparent), var(--bg); }
  #fx { position:fixed; inset:0; width:100%; height:100%; pointer-events:none; z-index:20; }

  #app { height:100%; padding:10px; display:grid; gap:16px; grid-template-rows:auto 1fr auto; }
  #bar { display:flex; gap:8px; align-items:center; flex-wrap:wrap; padding:6px 10px; border:2px solid var(--bd); border-radius:8px; background:var(--pane); }
  #bar .logo { color:var(--acc); font-weight:800; text-shadow:0 0 10px var(--acc); }
  #bar .spacer { flex:1; }
  a { color:var(--dim); text-decoration:none; font-weight:700; }
  a:hover { color:var(--acc); }
  .grp { display:flex; align-items:center; gap:4px; color:var(--dim); }
  .grp b { color:var(--fg); min-width:34px; text-align:center; }
  button { font:inherit; font-weight:700; background:var(--bg); color:var(--fg); border:1px solid var(--bd); border-radius:6px; padding:5px 10px; cursor:pointer; }
  button:hover { border-color:var(--acc); box-shadow:0 0 10px -2px var(--acc); }
  button.on { background:var(--acc); color:var(--bg); border-color:var(--acc); box-shadow:0 0 12px var(--acc); }

  .pane { position:relative; border:2px solid var(--bd); border-radius:8px; background:var(--pane); padding:16px 12px 10px; min-height:0; min-width:0; display:flex; flex-direction:column; transition:border-color .15s, box-shadow .15s; }
  .pane::before { content:attr(data-t); position:absolute; top:-10px; left:14px; background:var(--bg); padding:0 8px; color:var(--acc); font-size:12px; font-weight:800; }
  .pane:hover { border-color:var(--acc); box-shadow:0 0 16px -4px var(--acc); }

  #hint { color:var(--dim); margin-bottom:8px; }
  #hint b { color:var(--fg); }
  #palette { display:flex; gap:5px; flex-wrap:wrap; margin-bottom:10px; align-items:center; }
  #palette .pb { min-width:38px; padding:6px 0; text-align:center; color:var(--bg); background:var(--kc); border-color:var(--kc); }
  #palette .pb.rest { background:var(--bg); color:var(--fg); border-color:var(--bd); padding:6px 10px; }
  #parts { flex:1; overflow:auto; min-height:0; display:flex; flex-direction:column; gap:10px; padding:4px 2px; }
  .part { border:1px solid var(--bd); border-left:4px solid var(--tc); border-radius:8px; padding:8px; display:flex; flex-direction:column; gap:8px; background:var(--bg); }
  .part.solo { box-shadow:0 0 12px -3px var(--tc); }
  .ph { display:flex; align-items:center; gap:6px; flex-wrap:wrap; }
  .ph .nm { font-weight:800; color:var(--tc); margin-right:4px; }
  .ph .sp { flex:1; }
  .ph button { padding:3px 8px; }
  .blocks { display:flex; flex-wrap:wrap; gap:6px; }
  .blk { width:54px; height:54px; border-radius:8px; border:2px solid var(--bd); background:var(--pane); display:flex; flex-direction:column; align-items:center; justify-content:center; cursor:pointer; line-height:1; position:relative; }
  .blk .l { font-size:22px; font-weight:800; }
  .blk .o { font-size:10px; margin-top:3px; opacity:.8; }
  .blk.has { background:var(--kc); border-color:var(--kc); color:var(--bg); box-shadow:0 0 12px -3px var(--kc); }
  .blk.rest .l { color:var(--dim); }
  .blk:hover { border-color:var(--acc); }
  .blk.sel { outline:3px solid var(--acc); outline-offset:2px; box-shadow:0 0 18px var(--acc); animation:pulse 1s infinite; }
  .blk.now { transform:translateY(-6px) scale(1.08); box-shadow:0 0 22px var(--kc, var(--acc)); border-color:var(--fg); }
  @keyframes pulse { 50% { outline-color:transparent; } }

  #kbPane { height:min(36vh,310px); min-height:170px; }
  #piano { position:relative; flex:1; min-height:0; }
  .white { position:absolute; top:0; bottom:0; background:var(--fg); border:2px solid var(--bg); border-radius:0 0 8px 8px; color:var(--dim); display:flex; align-items:flex-end; justify-content:center; padding-bottom:8px; font-weight:800; font-size:clamp(12px,1.8vw,20px); touch-action:none; }
  .black { position:absolute; top:0; height:60%; background:var(--bg); border:2px solid var(--bd); border-radius:0 0 6px 6px; color:var(--dim); display:flex; align-items:flex-end; justify-content:center; padding-bottom:6px; font-weight:800; font-size:clamp(10px,1.4vw,16px); z-index:3; touch-action:none; }
  .down.white { background:var(--kc); color:var(--bg); box-shadow:0 0 26px var(--kc); }
  .down.black { background:var(--kc); color:var(--bg); box-shadow:0 0 22px var(--kc); border-color:var(--kc); }

  #pauseOv { position:fixed; inset:0; background:rgba(5,5,12,.82); display:none; place-items:center; text-align:center; z-index:30; }
  #pauseOv.show { display:grid; }
  #pauseOv h2 { font-size:44px; margin:0 0 10px; color:var(--acc); text-shadow:0 0 18px var(--acc); }
</style>
</head>
<body>
<canvas id="fx"></canvas>
<div id="app">
  <header id="bar">
    <a href="../">← Arcade</a>
    <span class="logo">♪ music</span>
    <span class="spacer"></span>
    <button id="playBtn">▶ Play all</button>
    <button id="loopBtn">🔁 Loop</button>
    <span class="grp">Speed <button id="bpmDn">−</button><b id="bpmVal">140</b><button id="bpmUp">+</button></span>
    <button id="megaBtn">💀 Megalovania</button>
    <button id="themeBtn">🎨</button>
    <a href="studio.html" title="The big studio with a note grid">🎛️ Studio</a>
    <button id="pauseBtn">⏸ Pause</button>
  </header>

  <section class="pane" data-t="your song">
    <div id="hint"><b>1.</b> Click a block &nbsp; <b>2.</b> Pick a note (letters below, or a piano key) &nbsp; <b>3.</b> Press <b>▶</b>. Parts play one after another!</div>
    <div id="palette"></div>
    <div id="parts"></div>
  </section>

  <section class="pane" id="kbPane" data-t="piano">
    <div id="piano"></div>
  </section>
</div>
<div id="pauseOv"><div><h2>⏸ Paused</h2><p>Press P or Esc to keep jamming</p><button id="resumeBtn">▶ Resume</button></div></div>

<script>
(() => {
  // ================= notes: [name, freq, isBlack] =================
  const NOTES = [
    ['A3',220.00,0],['A#3',233.08,1],['B3',246.94,0],['C4',261.63,0],['C#4',277.18,1],['D4',293.66,0],['D#4',311.13,1],
    ['E4',329.63,0],['F4',349.23,0],['F#4',369.99,1],['G4',392.00,0],['G#4',415.30,1],['A4',440.00,0],['A#4',466.16,1],
    ['B4',493.88,0],['C5',523.25,0],['C#5',554.37,1],['D5',587.33,0],['D#5',622.25,1],['E5',659.25,0]
  ];
  const KEYS = {A3:'z','A#3':'q',B3:'x',C4:'a','C#4':'w',D4:'s','D#4':'e',E4:'d',F4:'f','F#4':'t',G4:'g','G#4':'y',A4:'h','A#4':'u',B4:'j',C5:'k','C#5':'o',D5:'l','D#5':'p',E5:';'};
  const freqs = {}, keyMap = {}, colorIdx = {};
  NOTES.forEach(n => { freqs[n[0]] = n[1]; keyMap[KEYS[n[0]]] = n[0]; });
  const root = document.documentElement;

  // ================= themes =================
  const THEMES = [['tokyo','Tokyo Night'],['gruvbox','Gruvbox'],['catppuccin','Catppuccin'],['rosepine','Rosé Pine']];
  let themeIdx = 0, palette = [];
  const themeBtn = document.getElementById('themeBtn');
  function applyTheme(i) {
    themeIdx = i; root.dataset.theme = THEMES[i][0];
    themeBtn.title = THEMES[i][1]; themeBtn.textContent = '🎨 ' + THEMES[i][1];
    const cs = getComputedStyle(root);
    palette = [0,1,2,3,4,5,6].map(k => cs.getPropertyValue('--c'+k).trim());
    try { localStorage.setItem('music-theme', THEMES[i][0]); } catch(e) {}
  }
  themeBtn.onclick = () => applyTheme((themeIdx+1) % THEMES.length);

  // ================= piano =================
  const piano = document.getElementById('piano'), els = {};
  const nWhite = NOTES.filter(n => !n[2]).length, W = 100/nWhite;
  let wi = -1;
  NOTES.forEach(n => {
    const d = document.createElement('div');
    if (!n[2]) { wi++; d.className = 'white'; d.style.left = (wi*W)+'%'; d.style.width = W+'%'; }
    else { d.className = 'black'; d.style.left = ((wi+1)*W - W*0.3)+'%'; d.style.width = (W*0.6)+'%'; }
    colorIdx[n[0]] = wi % 7;
    d.style.setProperty('--kc', 'var(--c'+(wi%7)+')');
    d.textContent = KEYS[n[0]].toUpperCase();
    piano.appendChild(d); els[n[0]] = d;
  });

  // ================= sound =================
  let ctx = null, master = null, paused = false;
  const DIST = (() => { const n = 1024, c = new Float32Array(n), k = 60;
    for (let i=0;i<n;i++) { const x = i*2/n - 1; c[i] = (3+k)*x*20*(Math.PI/180)/(Math.PI + k*Math.abs(x)); } return c; })();
  function audio() {
    if (!ctx) {
      try {
        ctx = new (window.AudioContext||window.webkitAudioContext)();
        const comp = ctx.createDynamicsCompressor();
        master = ctx.createGain(); master.gain.value = 0.6;
        master.connect(comp); comp.connect(ctx.destination);
      } catch(e) {}
    }
    if (ctx && ctx.state === 'suspended' && !paused) ctx.resume();
    return ctx;
  }
  function osc(type, f, t, dest, gain, n, detune) {
    const o = ctx.createOscillator(), g = ctx.createGain();
    o.type = type; o.frequency.value = f; if (detune) o.detune.value = detune;
    g.gain.value = gain; o.connect(g); g.connect(dest); o.start(t); n.push(o); return o;
  }
  function lp(freq, q) { const b = ctx.createBiquadFilter(); b.type = 'lowpass'; b.frequency.value = freq; b.Q.value = q||0.7; return b; }
  const INST = {
    egtr: { name:'Electric Guitar', icon:'🎸', peak:0.32, a:0.004, sus:0.75, dec:0.35, rel:0.1, build(f,t,out,n) {
      const pre = lp(6000,3); pre.frequency.setTargetAtTime(2400,t,0.12);
      const ws = ctx.createWaveShaper(); ws.curve = DIST; ws.oversample = '2x';
      const post = lp(3400,0.5); pre.connect(ws); ws.connect(post); post.connect(out);
      const lfo = ctx.createOscillator(), lg = ctx.createGain();
      lfo.frequency.value = 5.5; lg.gain.setValueAtTime(0,t); lg.gain.linearRampToValueAtTime(14,t+0.7);
      lfo.connect(lg); lfo.start(t); n.push(lfo);
      [-7,7].forEach(c => { const o = osc('sawtooth', f, t, pre, 0.5, n, c); lg.connect(o.detune); });
      osc('square', f/2, t, pre, 0.15, n, 0);
    }},
    cgtr: { name:'Clean Guitar', icon:'🪕', peak:0.5, a:0.003, sus:0.0, dec:0.45, rel:0.08, build(f,t,out,n) {
      const fl = lp(4000,1); fl.frequency.setTargetAtTime(900,t,0.18); fl.connect(out);
      osc('sawtooth', f, t, fl, 0.5, n, 0); osc('triangle', f, t, fl, 0.6, n, 4); osc('sine', f*2, t, fl, 0.15, n, 0);
    }},
    piano: { name:'Piano', icon:'🎹', peak:0.5, a:0.003, sus:0.03, dec:0.7, rel:0.15, build(f,t,out,n) {
      const fl = lp(4500,0.5); fl.connect(out);
      osc('triangle', f, t, fl, 0.7, n, 0); osc('sine', f*2, t, fl, 0.25, n, 0); osc('sine', f*3, t, fl, 0.08, n, 0);
    }},
    synth: { name:'Synth', icon:'🎛️', peak:0.28, a:0.01, sus:0.6, dec:0.3, rel:0.2, build(f,t,out,n) {
      const fl = lp(4200,6); fl.frequency.setTargetAtTime(1500,t,0.15); fl.connect(out);
      osc('sawtooth', f, t, fl, 0.5, n, -8); osc('square', f, t, fl, 0.35, n, 8);
    }},
    bass: { name:'Bass', icon:'🔊', peak:0.7, a:0.005, sus:0.7, dec:0.2, rel:0.1, build(f,t,out,n) {
      const fl = lp(600,1); fl.connect(out); osc('sine', f/2, t, fl, 0.9, n, 0); osc('sawtooth', f/2, t, fl, 0.4, n, 0);
    }},
    organ: { name:'Organ', icon:'⛪', peak:0.25, a:0.01, sus:1, dec:0.01, rel:0.07, build(f,t,out,n) {
      [[1,.8],[2,.5],[3,.3],[4,.2]].forEach(([m,g]) => osc('sine', f*m, t, out, g, n, 0));
    }},
    chip: { name:'8-Bit', icon:'👾', peak:0.18, a:0.002, sus:0.8, dec:0.05, rel:0.04, build(f,t,out,n) { osc('square', f, t, out, 1, n, 0); }}
  };
  const INST_IDS = Object.keys(INST);
  function voice(id, f, t) {
    const d = INST[id], g = ctx.createGain(), n = [];
    g.gain.setValueAtTime(0, t);
    g.gain.linearRampToValueAtTime(d.peak, t + d.a);
    g.gain.setTargetAtTime(d.sus * d.peak, t + d.a, d.dec);
    d.build(f, t, g, n); g.connect(master);
    return { release(rt) {
      rt = Math.max(rt, t + d.a + 0.002); g.gain.setTargetAtTime(0, rt, d.rel);
      const end = rt + d.rel*7 + 0.05; n.forEach(o => { try { o.stop(end); } catch(e) {} });
    }};
  }

  // ================= song: parts made of blocks =================
  let parts = [], liveInst = 'piano', sel = null; // sel = {p,b}
  const PART_COLORS = [3,5,6,2,4,0,1,3];
  const mkPart = (inst, n) => ({ inst, blocks: new Array(n||8).fill(null) });
  parts = [mkPart('piano'), mkPart('piano')];
  ['C4','D4','E4','F4','G4','F4','E4','D4'].forEach((n,i) => parts[0].blocks[i] = n);
  ['E4','E4','F4','G4','G4','F4','E4','D4'].forEach((n,i) => parts[1].blocks[i] = n);
  const letterOf = n => n[0] + (n[1] === '#' ? '♯' : '');
  const octOf = n => n[n.length-1];

  const partsEl = document.getElementById('parts'), blockEls = [];
  function renderParts() {
    let h = ''; blockEls.length = 0;
    parts.forEach((pt, p) => {
      const solo = player && player.only === p;
      h += '<div class="part'+(solo?' solo':'')+'" data-p="'+p+'" style="--tc:var(--c'+PART_COLORS[p%8]+')"><div class="ph">'
        + '<span class="nm">Part '+(p+1)+'</span>'
        + '<button data-act="inst" title="Change sound">'+INST[pt.inst].icon+' '+INST[pt.inst].name+'</button>'
        + '<button data-act="solo">▶ Play this part</button><span class="sp"></span>'
        + '<button data-act="less" title="Fewer blocks">− block</button><button data-act="more" title="More blocks">+ block</button>'
        + '<button data-act="clear" title="Clear this part">🗑</button>'
        + (parts.length > 1 ? '<button data-act="del" title="Remove this part">✕</button>' : '')
        + '</div><div class="blocks">';
      pt.blocks.forEach((n,b) => {
        const isSel = sel && sel.p === p && sel.b === b;
        h += '<div class="blk '+(n?'has':'rest')+(isSel?' sel':'')+'" data-b="'+b+'"'+(n?' style="--kc:var(--c'+colorIdx[n]+')"':'')+'>'
          + (n ? '<span class="l">'+letterOf(n)+'</span><span class="o">'+octOf(n)+'</span>' : '<span class="l">·</span>') + '</div>';
      });
      h += '</div></div>';
    });
    if (parts.length < 8) h += '<button data-act="addpart">＋ Add part '+(parts.length+1)+'</button>';
    partsEl.innerHTML = h;
    partsEl.querySelectorAll('.part').forEach((pe,p) => { blockEls[p] = pe.querySelectorAll('.blk'); });
  }
  partsEl.addEventListener('click', e => {
    const btn = e.target.closest('button'), pe = e.target.closest('.part'), blk = e.target.closest('.blk');
    if (btn && btn.dataset.act === 'addpart') { parts.push(mkPart(parts[parts.length-1].inst)); sel = {p:parts.length-1, b:0}; liveInst = parts[sel.p].inst; renderParts(); return; }
    if (!pe) return;
    const p = +pe.dataset.p, pt = parts[p];
    if (blk) {
      const b = +blk.dataset.b; liveInst = pt.inst;
      sel = (sel && sel.p === p && sel.b === b) ? null : {p,b};
      const n = pt.blocks[b]; if (n && sel) previewNote(n, pt.inst);
      renderParts(); return;
    }
    if (!btn) return;
    const a = btn.dataset.act;
    if (a === 'inst') { pt.inst = INST_IDS[(INST_IDS.indexOf(pt.inst)+1) % INST_IDS.length]; liveInst = pt.inst; previewNote('C4', pt.inst); }
    else if (a === 'solo') { startPlay(p); return; }
    else if (a === 'more') { if (pt.blocks.length < 24) pt.blocks.push(null); }
    else if (a === 'less') { if (pt.blocks.length > 2) { pt.blocks.pop(); if (sel && sel.p === p && sel.b >= pt.blocks.length) sel = null; } }
    else if (a === 'clear') { pt.blocks.fill(null); }
    else if (a === 'del') { parts.splice(p,1); sel = null; stopPlay(); }
    renderParts();
  });

  // palette: white keys A B C D E F G A B C D E, plus rest
  const pal = document.getElementById('palette');
  pal.innerHTML = '<span style="color:var(--dim)">Notes:</span>';
  NOTES.filter(n => !n[2]).forEach(n => {
    const b = document.createElement('button');
    b.className = 'pb'; b.dataset.n = n[0]; b.textContent = n[0][0]; b.title = n[0]; b.style.setProperty('--kc', 'var(--c'+colorIdx[n[0]]+')');
    pal.appendChild(b);
  });
  const rb = document.createElement('button'); rb.className = 'pb rest'; rb.dataset.n = '-'; rb.textContent = '· rest'; pal.appendChild(rb);
  pal.addEventListener('click', e => {
    const b = e.target.closest('.pb'); if (!b) return;
    if (!sel) { setMsg('Click a block first! 👆'); return; }
    assign(b.dataset.n === '-' ? null : b.dataset.n);
  });
  function setMsg(t) { const h = document.getElementById('hint'); h.innerHTML = t; clearTimeout(setMsg.t); setMsg.t = setTimeout(() => { h.innerHTML = HINT; }, 2500); }
  const HINT = document.getElementById('hint').innerHTML;
  function assign(note) {
    const pt = parts[sel.p]; pt.blocks[sel.b] = note;
    if (note) previewNote(note, pt.inst);
    sel = sel.b + 1 < pt.blocks.length ? {p:sel.p, b:sel.b+1} : null;
    renderParts();
  }

  // ================= playing =================
  const flash = {}, live = {};
  function light(name, ms) {
    flash[name] = (flash[name]||0) + 1; els[name].classList.add('down'); sparkle(name, 2);
    setTimeout(() => { if (--flash[name] <= 0 && !live[name]) els[name].classList.remove('down'); }, ms);
  }
  function previewNote(name, inst) {
    if (!audio()) return;
    voice(inst, freqs[name], ctx.currentTime + 0.01).release(ctx.currentTime + 0.35); light(name, 300);
  }
  function press(name) {
    if (live[name] || paused) return;
    if (sel) { audio(); assign(name); return; }
    if (!audio()) return;
    live[name] = voice(liveInst, freqs[name], ctx.currentTime);
    els[name].classList.add('down'); sparkle(name, 4);
  }
  function release(name) {
    const v = live[name]; if (!v) return;
    v.release(ctx.currentTime); delete live[name];
    if (!(flash[name] > 0)) els[name].classList.remove('down');
  }
  function releaseAll() { Object.keys(live).forEach(release); }

  // player: steps = [{n, l, inst, p, b} | null], one step every stepMs
  let player = null, bpm = 140, loop = false;
  const playBtn = document.getElementById('playBtn');
  const stepMs = () => player && player.fixedMs ? player.fixedMs : 30000 / bpm;
  function startPlay(only) {
    if (!audio()) return;
    stopPlay();
    const steps = [];
    parts.forEach((pt,p) => { if (only !== undefined && only !== p) return;
      pt.blocks.forEach((n,b) => steps.push(n ? {n, l:1, inst:pt.inst, p, b} : {n:null, p, b})); });
    if (!steps.some(s => s.n)) { setMsg('Put some notes in the blocks first! 🎵'); return; }
    sel = null; begin({steps, only});
  }
  function begin(pl) {
    pl.i = 0; pl.acc = 0; pl.voices = []; player = pl; sel = null;
    playBtn.textContent = '⏹ Stop'; playBtn.classList.add('on');
    renderParts(); trigger();
  }
  function trigger() {
    const s = player.steps[player.i];
    if (player.prev) player.prev.classList.remove('now');
    if (s.p >= 0 && blockEls[s.p] && blockEls[s.p][s.b]) {
      const el = blockEls[s.p][s.b]; el.classList.add('now'); player.prev = el;
      el.scrollIntoView({block:'nearest', inline:'nearest'});
    }
    if (s.n) {
      const dur = (s.l * stepMs() * 0.92) / 1000, t = ctx.currentTime;
      const v = voice(s.inst, freqs[s.n], t); v.release(t + dur); player.voices.push(v);
      light(s.n, Math.max(100, s.l * stepMs() * 0.9));
    }
  }
  function stopPlay() {
    if (!player) return;
    const t = ctx ? ctx.currentTime : 0;
    player.voices.forEach(v => v.release(t));
    if (player.prev) player.prev.classList.remove('now');
    const wasSolo = player.only !== undefined; player = null;
    playBtn.textContent = '▶ Play all'; playBtn.classList.remove('on');
    if (wasSolo) renderParts();
  }
  function tickPlayer(dt) {
    if (!player) return;
    player.acc += dt;
    while (player && player.acc >= stepMs()) {
      player.acc -= stepMs(); player.i++;
      if (player.i >= player.steps.length) { if (loop) player.i = 0; else { stopPlay(); return; } }
      trigger();
    }
  }
  playBtn.onclick = () => { player ? stopPlay() : startPlay(); };
  document.getElementById('loopBtn').onclick = e => { loop = !loop; e.currentTarget.classList.toggle('on', loop); };
  const bpmVal = document.getElementById('bpmVal');
  const setBpm = v => { bpm = Math.max(60, Math.min(240, v)); bpmVal.textContent = bpm; };
  document.getElementById('bpmDn').onclick = () => setBpm(bpm - 10);
  document.getElementById('bpmUp').onclick = () => setBpm(bpm + 10);

  // Megalovania auto-play (intro riff, four chords, twice)
  document.getElementById('megaBtn').onclick = () => {
    if (!audio()) return;
    if (player && player.fixedMs) { stopPlay(); return; }
    stopPlay();
    const RIFF = [['R',0,1],['R',1,1],['D5',2,2],['A4',5,3],['G#4',9,2],['G4',11,2],['F4',13,2],['D4',15,1],['F4',16,1],['G4',17,1]];
    const ROOTS = ['D4','C4','B3','A#3'], steps = [];
    for (let k = 0; k < 160; k++) steps.push({n:null, p:-1, b:0});
    for (let p = 0; p < 8; p++) RIFF.forEach(([n,s,l]) => { steps[p*20+s] = {n: n==='R' ? ROOTS[p%4] : n, l, inst:'egtr', p:-1, b:0}; });
    begin({steps, fixedMs:120});
    document.getElementById('megaBtn').textContent = '⏹ Stop Megalovania';
  };
  const origStop = stopPlay;

  // ================= pause + keys =================
  const ov = document.getElementById('pauseOv'), pauseBtn = document.getElementById('pauseBtn');
  function setPause(p) {
    paused = p; ov.classList.toggle('show', p); pauseBtn.textContent = p ? '▶ Resume' : '⏸ Pause';
    if (p) releaseAll();
    if (ctx) { p ? ctx.suspend() : ctx.resume(); }
  }
  pauseBtn.onclick = () => setPause(!paused);
  document.getElementById('resumeBtn').onclick = () => setPause(false);
  addEventListener('keydown', e => {
    const k = e.key.toLowerCase();
    if (k === ' ') { e.preventDefault(); if (!e.repeat && !paused) { audio(); player ? stopPlay() : startPlay(); } return; }
    if (e.repeat) return;
    if (k === 'p' || k === 'escape') { setPause(!paused); return; }
    if (paused || e.ctrlKey || e.metaKey || e.altKey) return;
    if (keyMap[k]) press(keyMap[k]);
  });
  addEventListener('keyup', e => { const k = e.key.toLowerCase(); if (k === ' ') e.preventDefault(); else if (keyMap[k]) release(keyMap[k]); });
  addEventListener('blur', releaseAll);
  document.addEventListener('click', e => { const b = e.target.closest('button'); if (b) b.blur(); });
  const pointerNote = {};
  piano.addEventListener('pointerdown', e => {
    if (paused) return;
    const name = Object.keys(els).find(n => els[n] === e.target); if (!name) return;
    e.preventDefault(); pointerNote[e.pointerId] = name; press(name);
  });
  const up = e => { const n = pointerNote[e.pointerId]; if (n) { release(n); delete pointerNote[e.pointerId]; } };
  addEventListener('pointerup', up); addEventListener('pointercancel', up);

  // ================= sparkles + main loop (fixed 60 updates/sec) =================
  const cv = document.getElementById('fx'), c2 = cv.getContext('2d');
  function fit() { cv.width = innerWidth; cv.height = innerHeight; }
  addEventListener('resize', fit); fit();
  const bits = [], GLYPHS = ['♪','♫','♩','♬','★'];
  function sparkle(note, count) {
    const r = els[note].getBoundingClientRect(), col = palette[colorIdx[note]] || '#fff';
    for (let i = 0; i < count; i++) bits.push({x:r.left+r.width/2+(Math.random()-.5)*r.width*.6, y:r.top, vx:(Math.random()-.5)*2, vy:-2-Math.random()*3, life:70, ch:GLYPHS[Math.random()*GLYPHS.length|0], col});
    if (bits.length > 200) bits.splice(0, bits.length-200);
  }
  const STEP = 1000/60;
  function update() {
    for (let i = bits.length-1; i >= 0; i--) { const p = bits[i]; p.x += p.vx; p.y += p.vy; p.vy += 0.02; if (--p.life <= 0) bits.splice(i,1); }
    tickPlayer(STEP);
  }
  function draw() {
    c2.clearRect(0, 0, cv.width, cv.height); c2.font = '26px system-ui';
    for (const p of bits) { c2.globalAlpha = Math.min(1, p.life/30); c2.fillStyle = p.col; c2.shadowColor = p.col; c2.shadowBlur = 10; c2.fillText(p.ch, p.x, p.y); }
    c2.globalAlpha = 1; c2.shadowBlur = 0;
  }
  let last = performance.now(), acc = 0;
  function frame(now) {
    acc += Math.min(now - last, 250); last = now;
    while (acc >= STEP) { if (!paused) update(); acc -= STEP; }
    draw(); requestAnimationFrame(frame);
  }

  // keep the Megalovania button label right whenever playback stops
  const megaBtn = document.getElementById('megaBtn');
  setInterval(() => { if (!(player && player.fixedMs) && megaBtn.textContent !== '💀 Megalovania') megaBtn.textContent = '💀 Megalovania'; }, 200);

  let saved = 0;
  try { const s = localStorage.getItem('music-theme'); const i = THEMES.findIndex(t => t[0] === s); if (i >= 0) saved = i; } catch(e) {}
  applyTheme(saved); renderParts(); requestAnimationFrame(frame);
})();
</script>
</body>
</html>
