<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>7 isles</title>
<style>
  html, body { margin:0; height:100%; overflow:hidden; background:#2a7bad; color:#fff; font-family:system-ui, sans-serif; user-select:none; -webkit-user-select:none; }
  /* Just ocean: a blue gradient with slowly drifting wave ripples */
  #sea { position:fixed; inset:0; background:radial-gradient(ellipse at 50% 40%, #3a8fc2, #2a7bad 60%, #226a9a); }
  #sea::before, #sea::after { content:""; position:absolute; inset:-200px; opacity:.25;
    background-image:radial-gradient(ellipse 60px 8px at 50% 50%, rgba(255,255,255,.7), transparent 70%);
    background-size:180px 90px; animation:drift 40s linear infinite; }
  #sea::after { background-size:130px 70px; background-position:40px 30px; opacity:.18; animation-duration:65s; animation-direction:reverse; }
  @keyframes drift { to { transform:translate(180px, 90px); } }
  .bar { position:fixed; z-index:5; top:12px; }
  #left { left:12px; } #right { right:12px; }
  .btn, .bar a { display:inline-block; background:rgba(18,11,46,.78); color:#fff; border:2px solid rgba(255,255,255,.35); border-radius:12px;
                 padding:8px 14px; font:700 16px system-ui, sans-serif; text-decoration:none; cursor:pointer; }
  .btn:hover, .bar a:hover { background:rgba(60,40,140,.9); }
  #pause { position:fixed; inset:0; z-index:10; background:rgba(18,11,46,.75); display:none; place-items:center; text-align:center; }
  #pause.on { display:grid; }
  #pause h1 { font-size:48px; margin:0 0 14px; }
  body.paused #sea::before, body.paused #sea::after { animation-play-state:paused; }
</style>
</head>
<body>
<div id="sea"></div>
<div class="bar" id="left"><a href="../">← Arcade</a></div>
<div class="bar" id="right"><button class="btn" id="pauseBtn" title="Pause (P or Esc)">⏸ Pause</button></div>
<div id="pause"><div><h1>⏸ Paused</h1><button class="btn" id="resume">▶ Keep playing</button></div></div>
<script>
(function () {
  var pauseEl = document.getElementById('pause'), paused = false;
  function setPause(v) { paused = v; pauseEl.classList.toggle('on', v); document.body.classList.toggle('paused', v); }
  document.getElementById('pauseBtn').onclick = function () { setPause(true); };
  document.getElementById('resume').onclick = function () { setPause(false); };
  addEventListener('keydown', function (e) {
    if (e.key === 'p' || e.key === 'P' || e.key === 'Escape') setPause(!paused);
  });
})();
</script>
</body>
</html>
