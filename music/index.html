<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Paint by Number</title>
<style>
  * { box-sizing:border-box; }
  html, body { margin:0; height:100%; overflow:hidden; background:#120b2e; color:#f4f1ff; font-family:system-ui, "Segoe UI", sans-serif; user-select:none; -webkit-user-select:none; }
  body { display:grid; grid-template-rows:auto minmax(0,1fr) auto auto; gap:6px; padding:8px 10px 10px; background:radial-gradient(800px 400px at 50% -10%, #2a1a66, transparent), #120b2e; }
  #top { display:flex; gap:8px; align-items:center; flex-wrap:wrap; }
  #top a { color:#a99ee0; text-decoration:none; font-weight:700; }
  #top a:hover { color:#fff; }
  #top h1 { font-size:20px; margin:0 6px; }
  .sp { flex:1; }
  button { font:inherit; font-weight:700; color:#f4f1ff; background:#2b1d6b; border:2px solid #5b46c9; border-radius:10px; padding:6px 12px; cursor:pointer; }
  button:hover { background:#3b2a8f; }
  button.on { background:#ffd23f; color:#2b1d6b; border-color:#ffd23f; }
  #pics { display:flex; gap:6px; flex-wrap:wrap; }
  .pic { padding:3px; border-radius:10px; position:relative; line-height:0; }
  .pic canvas { border-radius:6px; background:#fff; }
  .pic .star { position:absolute; right:-4px; top:-6px; font-size:14px; line-height:1; }
  #stage { min-height:0; overflow:auto; display:flex; border-radius:10px; background:rgba(255,255,255,.04); }
  #board { margin:auto; display:block; flex:none; cursor:pointer; }
  #msg { text-align:center; min-height:22px; font-weight:700; color:#ffd23f; }
  #bottom { display:flex; flex-direction:column; gap:8px; align-items:center; }
  #palette { display:flex; gap:8px; flex-wrap:wrap; justify-content:center; }
  .sw { display:flex; align-items:center; gap:8px; padding:4px 10px 4px 4px; }
  .sw .chip { width:32px; height:32px; border-radius:8px; display:grid; place-items:center; font-size:17px; font-weight:900; border:2px solid rgba(0,0,0,.35); }
  .sw .chip.two { font-size:14px; }
  .sw .cnt { font-size:12px; opacity:.8; }
  .sw.sel { background:#ffd23f; color:#2b1d6b; border-color:#ffd23f; transform:translateY(-3px); box-shadow:0 6px 16px rgba(255,210,63,.4); }
  .sw.done { opacity:.45; }
  .many .sw { padding:2px 7px 2px 2px; gap:5px; border-radius:8px; }
  .many .chip { width:26px; height:26px; font-size:14px; }
  .many .chip.two { font-size:12px; }
  .many .cnt { font-size:10px; }
  .many { gap:5px !important; }
  #bar { width:min(520px,90%); height:14px; border-radius:8px; background:#2b1d6b; border:2px solid #5b46c9; overflow:hidden; position:relative; }
  #fill { height:100%; width:0; background:linear-gradient(90deg,#ff6b6b,#ffd23f,#69db7c,#4dabf7,#da77f2); transition:width .25s; }
  #pct { position:absolute; inset:0; text-align:center; font-size:11px; line-height:10px; font-weight:800; }
  .ov { position:fixed; inset:0; background:rgba(10,5,30,.85); display:none; place-items:center; text-align:center; z-index:30; }
  .ov.show { display:grid; }
  .ov h2 { font-size:46px; margin:0 0 8px; }
  #fx { position:fixed; inset:0; width:100%; height:100%; pointer-events:none; z-index:20; }
</style>
</head>
<body>
<canvas id="fx"></canvas>
<div id="top">
  <a href="../">← Arcade</a>
  <h1>🎨 Paint by Number</h1>
  <div id="pics"></div>
  <span class="sp"></span>
  <button id="hoverBtn" class="on" title="Paint just by moving the mouse — no clicking!">🖱️ Hover paint</button>
  <button id="zoomOut" title="Zoom out (−)">🔍−</button>
  <button id="zoomIn" title="Zoom in (+)">🔍+</button>
  <button id="hintBtn" title="Show me a spot to paint (H)">💡 Hint</button>
  <button id="numBtn" class="on" title="Show or hide numbers">🔢</button>
  <button id="resetBtn" title="Start this picture over">🔄</button>
  <button id="muteBtn" title="Sound on/off">🔊</button>
  <button id="pauseBtn">⏸ Pause</button>
</div>
<div id="stage"><canvas id="board"></canvas></div>
<div id="msg"></div>
<div id="bottom">
  <div id="palette"></div>
  <div id="bar"><div id="fill"></div><div id="pct">0%</div></div>
</div>

<div class="ov" id="win"><div>
  <h2>🎉 You did it!</h2>
  <p id="winTxt" style="font-size:18px"></p>
  <button id="nextBtn">Next picture ➡</button>
  <button id="closeBtn">Keep looking</button>
</div></div>
<div class="ov" id="pauseOv"><div><h2>⏸ Paused</h2><p>Press P or Esc to keep painting</p><button id="resumeBtn">▶ Resume</button></div></div>

<script>
(() => {
  // ================= pictures =================
  // A picture is rows of squares. A number/letter = paint that color. A dot = background (already painted).
  const CH = '123456789abcdefghijklmnopqrstuvwxyz';
const make = (w, h, fn) => { const rows = []; for (let y = 0; y < h; y++) { let r = ''; for (let x = 0; x < w; x++) r += (fn(x, y) || '.'); rows.push(r); } return rows; };
const hsh = (x, y) => ((x * 374761393 + y * 668265263) >>> 0) % 97;
const rot = (u, v, cu, cv, ang) => { const du = u - cu, dv = v - cv, ca = Math.cos(ang), sa = Math.sin(ang); return [du*ca + dv*sa, -du*sa + dv*ca]; };
const ed = (u, v, cu, cv, rx, ry, ang) => { const [a, b] = rot(u, v, cu, cv, ang || 0); return Math.hypot(a / rx, b / ry); };
const inTri = (px, py, a, b, c) => { const s = (p, q, r) => (p[0]-r[0])*(q[1]-r[1]) - (q[0]-r[0])*(p[1]-r[1]); const P = [px,py], d1 = s(P,a,b), d2 = s(P,b,c), d3 = s(P,c,a); return !((d1<0||d2<0||d3<0) && (d1>0||d2>0||d3>0)); };

const butterfly = () => make(40, 32, (x, y) => {
  const u = Math.abs(x + .5 - 20), v = y + .5;
  if (v > 1 && v < 7.5 && Math.abs(u - (1.8 + (7.5 - v) * .8)) < .6) return '5';
  if (Math.hypot(u - (1.8 + 6.5 * .8), v - 1.4) < 1.1) return '5';
  if (Math.hypot(u, v - 8.6) < 2.3) return '5';
  if (ed(u, v, 0, 18, 1.9, 9.5) <= 1) return Math.floor(v / 2.2) % 2 === 0 ? '5' : 'a';
  let d = ed(u, v, 10.5, 11, 11.5, 7.2, -0.5);
  if (d <= 1) {
    if (d > .88) return '1';
    const sp = [[8.5,9.5],[12.5,12],[16,8.5],[11,6.5]];
    for (const [su, sv] of sp) { const q = Math.hypot(u - su, v - sv); if (q <= 1.4) return '4'; if (q <= 2.2) return '1'; }
    if (d > .72) return '2';
    if (d > .55) return '3';
    return '2';
  }
  d = ed(u, v, 8.5, 22.5, 8, 5.6, 0.55);
  if (d <= 1) {
    if (d > .86) return '1';
    const sp = [[7.5,22.5],[11,24.5]];
    for (const [su, sv] of sp) { const q = Math.hypot(u - su, v - sv); if (q <= 1.1) return '4'; if (q <= 1.8) return '1'; }
    if (d > .66) return '6';
    if (d > .45) return '7';
    return '6';
  }
  if (v > 25) {
    const [a, b] = rot(u, v, 14, 29.2, -0.35);
    if (Math.abs(a / 7) <= 1 && Math.abs(b / 2.4) <= 1 && Math.hypot(a / 7, b / 2.4) <= 1) return Math.abs(b) < .45 ? '9' : '8';
    const [a2, b2] = rot(u, v, 8, 30.4, 0.3);
    if (Math.hypot(a2 / 6, b2 / 2.2) <= 1) return Math.abs(b2) < .4 ? '9' : '8';
    if (Math.hypot(u - 18.3, v - 26.6) < 2) return Math.hypot(u - 18.3, v - 26.6) < .8 ? '3' : '6';
  }
  return '.';
});

const sunset = () => {
  const w = 48, h = 32;
  const far = x => 17 + 3.2*Math.sin(x*.28) + 2.2*Math.sin(x*.11 + 1.3) + 1.4*Math.sin(x*.55);
  const near = x => 21.5 + 2.4*Math.sin(x*.21 + 2) + 1.5*Math.sin(x*.47) - Math.max(0, 6 - Math.abs(x - 24)) * .3;
  const tree = (cx, top, ht, hw, px, py) => { if (py >= top && py <= top + ht) return Math.abs(px - cx) <= ((py - top) / ht) * hw + .3; return false; };
  const trees = [[4.5,20,11,3.6],[9,23,8,2.7],[1.5,23,8,2.4],[43.5,19,12,3.8],[39,23,8,2.8],[46.5,22,9,2.6]];
  return make(w, h, (x, y) => {
    const px = x + .5, py = y + .5;
    for (const [cx, top, ht, hw] of trees) if (tree(cx, top, ht, hw, px, py)) return 'a';
    if (py > 28 && ((px < 7 && py < 31.6) || (px > 41 && py < 31.6))) return 'a';
    if (py >= 24) {
      if (Math.abs(px - 24) < 5.2 - (py - 24) * .35 && Math.floor(py) % 2 === 0) return '7';
      return py < 27 ? 'b' : (Math.floor(py) % 3 === 0 ? 'b' : 'c');
    }
    if (py >= near(px)) return '9';
    if (py >= far(px)) return '8';
    if (Math.hypot(px - 24, py - 17) <= 6) return '7';
    if (ed(px, py, 10, 10.5, 6, 1.1) <= 1) return '4';
    if (ed(px, py, 38, 7.5, 5, 1) <= 1) return '3';
    if (py < 10 && hsh(x, y) === 5) return '7';
    const yy = y + Math.round(Math.sin(x * .35) * .9);
    return yy < 4 ? '1' : yy < 8 ? '2' : yy < 12 ? '3' : yy < 15 ? '4' : yy < 18 ? '5' : '6';
  });
};

const owl = () => make(36, 36, (x, y) => {
  const px = x + .5, v = y + .5, u = Math.abs(px - 18);
  if (v > 31.5 && v < 34.2) {
    if (u < 8.5 && v > 32.3 && v < 34.2 && Math.floor(u) % 3 === 1 && v > 32.8) return '6';
    return 'c';
  }
  if (v > 29 && v <= 31.5 && u < 9 && u > 3 && Math.floor(u * 1.5) % 2 === 0 && v > 30.6) return '6';
  if (v >= 13 && v <= 17.6 && u <= (17.8 - v) * .55) return '6';
  const eye = Math.hypot(u - 4.9, v - 12.2);
  if (eye <= 1.0 && u > 4.5 && v < 12 ) return '4';
  if (eye <= 1.7) return '7';
  if (eye <= 3.0) return '6';
  if (eye <= 3.9) return '5';
  if (eye <= 5.0) return '3';
  const ear = inTri(u, v, [2.5, 7.2], [8.2, 2.0], [8.4, 9.6]);
  if (ear) return inTri(u, v, [4, 7.2], [7.4, 3.8], [7.6, 8.6]) ? '4' : '1';
  const wing = ed(u, v, 11, 22.5, 4.2, 9.5, -0.12);
  if (wing <= 1) return wing > .8 ? '1' : (Math.floor(v / 2.5) % 2 === 0 ? '9' : '2');
  const belly = ed(u, v, 0, 24.5, 6.8, 8.3);
  if (belly <= 1 && v > 14) {
    const vv = (v - 14) % 3, uu = (u + (Math.floor((v - 14) / 3) % 2) * 1.5) % 3;
    return Math.hypot(uu - 1.5, vv - .5) > 1.9 ? '4' : '3';
  }
  const head = Math.hypot(u / 9.2, (v - 12) / 8.6);
  const body = ed(u, v, 0, 22.5, 10.2, 10.8);
  if (head <= 1 || body <= 1) { const dd = Math.min(head, body); return dd > .88 ? '1' : '2'; }
  if (hsh(x, y) < 3 && v < 28) return 'b';
  if (Math.hypot(px - 29, v - 7) <= 3.4) return '8';
  return '.';
});

const mandala = () => make(40, 40, (x, y) => {
  const dx = x + .5 - 20, dy = y + .5 - 20, r = Math.hypot(dx, dy);
  if (r > 19.6) return '.';
  if (r < 2.4) return r < 1.2 ? '9' : '8';
  if (r > 18.3) return '1';
  const sector = ((Math.atan2(dy, dx) / (2 * Math.PI)) + .5) * 16, s = Math.floor(sector) % 16, f = Math.min(s, 15 - s);
  const t = Math.abs((sector % 1) - .5) * 2, k = Math.floor((r - 2.4) / 2.3);
  if (k % 2 === 1 && t > .72) return '1';
  if (k === 2 && r - 2.4 - 2*2.3 < 1.0 && t < .35) return '8';
  return CH[((k + f) % 6) + 1];
});
// ---------- shaded pictures (many shades) ----------
const hex2 = h => [1,3,5].map(i => parseInt(h.slice(i, i + 2), 16));
const toHex = a => '#' + a.map(v => Math.round(v).toString(16).padStart(2, '0')).join('');
const mixc = (a, b, t) => { const A = hex2(a), B = hex2(b); return toHex(A.map((v, i) => v + (B[i] - v) * t)); };
const ramp = (cols, n) => Array.from({length: n}, (_, k) => { const t = n === 1 ? 0 : k / (n - 1) * (cols.length - 1), i = Math.min(cols.length - 2, Math.floor(t)); return mixc(cols[i], cols[i + 1], t - i); });
const palBuilder = () => { const P = []; return { add: h => { P.push(h); return CH[P.length - 1]; }, pal: () => Object.fromEntries(P.map((h, i) => [i + 1, h])) }; };
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));

const planet = () => {
  const w = 44, h = 34, cx = 21, cy = 17.5, R = 10.5, B = palBuilder();
  const bands = [ramp(['#5a3b1f','#f6dfb0'], 4), ramp(['#4a1712','#f59a5d'], 4), ramp(['#2e1d3d','#caa0e0'], 4)].map(r => r.map(B.add));
  const rings = ['#c9b79c','#9c8a72','#e6d5b8','#a89478'].map(B.add), star = B.add('#cfd8ff');
  const L = [-.5, -.6, .62], ln = Math.hypot(...L); L.forEach((v, i) => L[i] = v / ln);
  const rows = make(w, h, (x, y) => {
    const px = x + .5 - cx, py = y + .5 - cy, ca = Math.cos(-.38), sa = Math.sin(-.38);
    const rx = px * ca - py * sa, ry = px * sa + py * ca, rad = Math.hypot(rx, ry / .3) / R;
    let ring = null;
    if (rad >= 1.4 && rad <= 2.15) { const t = (rad - 1.4) / .75; ring = t < .3 ? rings[0] : t < .55 ? rings[1] : t < .68 ? null : t < .85 ? rings[2] : rings[3]; }
    const front = ry > 0, d = Math.hypot(px, py) / R;
    if (ring && front) return ring;
    if (d <= 1) {
      const nx = px / R, ny = py / R, nz = Math.sqrt(Math.max(0, 1 - nx*nx - ny*ny)), lam = nx*L[0] + ny*L[1] + nz*L[2];
      const l = clamp(Math.floor(lam * 4.2), 0, 3), b = (((Math.floor(ny * 3.4 + 1.1 * Math.sin(nx * 3.2 + ny * 2.0) + 9)) % 3) + 3) % 3;
      return bands[b][l];
    }
    if (ring) return ring;
    if (hsh(x, y) % 53 === 0) return star;
    return '.';
  });
  return { rows, pal: B.pal(), bg: '#0b0d2a' };
};

const hibiscus = () => {
  const w = 40, h = 40, cx = 20, cy = 18, B = palBuilder();
  const bg = ['#fff0e6','#ffe3d3','#ffd3bf'].map(B.add);
  const pet = ramp(['#4a0a22','#c9184a','#ff4d6d','#ff8fa3','#ffd0dc'], 9).map(B.add);
  const leaf = ['#1b4332','#2d6a4f','#52b788'].map(B.add);
  const stem = B.add('#ffd166'), pollen = B.add('#ff9f1c'), pist = B.add('#c1121f');
  const ang = -0.9, ex = Math.cos(ang), ey = Math.sin(ang), tip = [cx + ex * 13.5, cy + ey * 13.5];
  const rows = make(w, h, (x, y) => {
    const px = x + .5, py = y + .5, dx = px - cx, dy = py - cy, r = Math.hypot(dx, dy);
    // stamen
    const tt = clamp(dx * ex + dy * ey, 0, 13), sd = Math.hypot(dx - ex * tt, dy - ey * tt);
    if (sd < .75 && tt < 12.5) return stem;
    for (const [ox, oy] of [[0,0],[1.7,1.2],[-1.5,1.5],[.3,-1.9]]) if (Math.hypot(px - tip[0] - ox, py - tip[1] - oy) < 1.15) return pollen;
    if (Math.hypot(px - tip[0] - .4, py - tip[1] - .2) < 1.3) return pist;
    // petals
    const th = Math.atan2(dy, dx) + Math.PI / 2, u = th / (2 * Math.PI) * 5, phi = u - Math.floor(u), s = Math.abs(phi - .5) * 2;
    let Rp = 17 * (1 - .38 * Math.pow(s, 2.4)); if (s > .93) Rp *= .72;
    if (r <= Rp) {
      let t = r / Rp; if (s < .06) t *= .78; if (Math.abs(s - .45) < .05) t *= .88;
      return pet[clamp(Math.floor(t * 9), 0, 8)];
    }
    // leaves
    for (const [lx, ly, a] of [[7, 35, .55], [33, 35, -.55]]) {
      const [p, q] = rot(px, py, lx, ly, a);
      if (Math.hypot(p / 8.5, q / 3.2) <= 1) return Math.abs(q) < .5 ? leaf[0] : (q < 0 ? leaf[2] : leaf[1]);
    }
    const yy = y + Math.round(Math.sin(x * .3) * .8);
    return yy < 12 ? bg[0] : yy < 26 ? bg[1] : bg[2];
  });
  return { rows, pal: B.pal(), bg: '#fff0e6' };
};

const balloon = () => {
  const w = 40, h = 44, B = palBuilder();
  const sky = ramp(['#1d3a8a','#6ea8f0','#ffd9b0','#ffb8a0'], 6).map(B.add);
  const cloud = ['#ffffff','#ffd9e0'].map(B.add);
  const hues = [ramp(['#7a0f1c','#e63946','#ff8a8a'], 3), ramp(['#a86a00','#ffc300','#fff0a0'], 3), ramp(['#0b5563','#2ec4b6','#b8fff2'], 3)].map(r => r.map(B.add));
  const basket = ['#5b3a1e','#8b5a2b','#c08a4d'].map(B.add), rope = B.add('#3a2a1a');
  const hw = v => v < 2 ? 0 : v <= 17 ? 11 * Math.sqrt(Math.max(0, 1 - Math.pow((17 - v) / 15, 2))) : v <= 30 ? 3.5 + 7.5 * Math.pow(1 - (v - 17) / 13, .9) : 0;
  const rows = make(w, h, (x, y) => {
    const px = x + .5, v = y + .5, u = px - 20, half = hw(v);
    if (half > 0 && Math.abs(u) <= half) {
      const q = u / half, gore = Math.min(5, Math.floor((q + 1) / 2 * 6)), nz = Math.sqrt(Math.max(0, 1 - q * q));
      const lam = -.55 * q + .8 * nz, l = lam > .78 ? 2 : lam > .42 ? 1 : 0;
      return hues[gore % 3][l];
    }
    if (v > 30 && v <= 34.4 && Math.abs(Math.abs(u) - 3.1) < .55) return rope;
    if (v > 34.4 && v <= 39 && Math.abs(u) <= 3.8) {
      const weave = (Math.floor(v) + Math.floor(px)) % 2;
      return basket[v < 35.4 ? 0 : (u < -1.2 ? 2 - weave : 1 - weave + (u > 1.5 ? 0 : 0))];
    }
    if (ed(px, v, 8, 36, 6, 1.7) <= 1 || ed(px, v, 11, 35, 4, 1.3) <= 1) return ed(px, v, 8, 36, 6, 1.7) < .55 ? cloud[0] : cloud[1];
    if (ed(px, v, 33, 12, 5.5, 1.5) <= 1 || ed(px, v, 31, 11, 3.5, 1.2) <= 1) return ed(px, v, 33, 12, 5.5, 1.5) < .6 ? cloud[0] : cloud[1];
    const yy = y + Math.round(Math.sin(x * .3) * .9);
    return sky[clamp(Math.floor(yy / 44 * 6), 0, 5)];
  });
  return { rows, pal: B.pal(), bg: '#1d3a8a' };
};

const aurora = () => {
  const w = 48, h = 38, hz = 25, B = palBuilder();
  const sky = ['#050a24','#0a1a3f','#0f3a55'].map(B.add);
  const green = ramp(['#1f6f4a','#4be3a0','#d6ffe9'], 4).map(B.add), purple = ['#5a2a8f','#9b5de5'].map(B.add);
  const farM = B.add('#17314a'), nearM = B.add('#0b1626'), snow1 = B.add('#dfe9f5'), snow2 = B.add('#8fa8c4'), star = B.add('#ffffff');
  const far = x => 21 + 2.2 * Math.sin(x * .2 + 1) + 1.4 * Math.sin(x * .43) - 8 * Math.exp(-Math.pow((x - 30) / 6, 2));
  const near = x => 23.4 + 1.8 * Math.sin(x * .31 + 2) + 1.1 * Math.sin(x * .7);
  const scene = (x, y) => {
    const px = x + .5, py = y + .5;
    if (py >= near(px)) return nearM;
    const f = far(px);
    if (py >= f) return (f < 17 && py < f + 3 + (px - 30) * .25 * (px > 30 ? 1 : 0)) ? (px < 30 ? snow1 : snow2) : farM;
    const yc = 11 + 4 * Math.sin(x * .17) + 2 * Math.sin(x * .4 + 1), dy = py - yc, wd = dy > 0 ? 2.4 : 4.5;
    const I = Math.exp(-Math.pow(dy / wd, 2)) * (.7 + .3 * Math.sin(x * 1.1 + Math.sin(x * .3) * 2));
    if (I > .75) return green[3]; if (I > .55) return green[2]; if (I > .35) return green[1]; if (I > .2) return green[0];
    const Ip = Math.exp(-Math.pow((py - (yc - 5)) / 3, 2)) * .85;
    if (Ip > .45) return purple[1]; if (Ip > .25) return purple[0];
    if (hsh(x, y) % 61 === 0 && y < 20) return star;
    return y < 8 ? sky[0] : y < 16 ? sky[1] : sky[2];
  };
  const rows = make(w, h, (x, y) => {
    if (y < hz) return scene(x, y);
    const yy = 2 * hz - 1 - y, xs = clamp(x + Math.round(Math.sin(y * 1.9) * 1.2), 0, w - 1);
    if (y % 4 === 0 && hsh(x, y) % 5 < 2) return sky[2];
    return scene(xs, yy);
  });
  return { rows, pal: B.pal(), bg: '#050a24' };
};

  const rainbow = () => {
    const w = 20, h = 11, cx = 10, cy = 11;
    const clouds = [[2.6,9.4,2.3],[4.8,9.9,2.0],[1.0,10.2,1.6],[17.4,9.4,2.3],[15.2,9.9,2.0],[19.0,10.2,1.6]];
    return make(w, h, (x, y) => {
      const px = x + .5, py = y + .5, d = Math.hypot(px - cx, py - cy);
      if (clouds.some(([a,b,rad]) => Math.hypot(px-a, py-b) <= rad)) return '7';
      if (d <= 10 && d > 4) return String(Math.min(6, Math.floor(10 - d) + 1));
      return '.';
    });
  };
  const PICS = [
    Object.assign({ name:'Planet', level:'⭐⭐⭐⭐' }, planet()),
    Object.assign({ name:'Hibiscus', level:'⭐⭐⭐⭐' }, hibiscus()),
    Object.assign({ name:'Balloon', level:'⭐⭐⭐⭐' }, balloon()),
    Object.assign({ name:'Aurora', level:'⭐⭐⭐⭐' }, aurora()),
    { name:'Butterfly', level:'⭐⭐⭐', bg:'#dff6ff', pal:{1:'#3d1a5b',2:'#ff8c1a',3:'#ffd23f',4:'#ffffff',5:'#5a3418',6:'#ff5fa2',7:'#ffc2dd',8:'#52b788',9:'#2d6a4f',10:'#a8671f'}, rows: butterfly() },
    { name:'Sunset', level:'⭐⭐⭐', bg:'#2b1055', pal:{1:'#2b1055',2:'#6a3093',3:'#c06c84',4:'#f67280',5:'#ffb36b',6:'#ffe08a',7:'#fff7c9',8:'#7b4a9e',9:'#3b2a6b',10:'#14213d',11:'#f08a5d',12:'#6a3d7a'}, rows: sunset() },
    { name:'Owl', level:'⭐⭐⭐', bg:'#1b2a49', pal:{1:'#4a2c14',2:'#8b5a2b',3:'#f7e7c1',4:'#d9b382',5:'#ffffff',6:'#ff9f1c',7:'#111111',8:'#fff3b0',9:'#5c3a1c',10:'#52b788',11:'#cfd8ff',12:'#6b4226'}, rows: owl() },
    { name:'Mandala', level:'⭐⭐⭐', bg:'#fff8e7', pal:{1:'#2b1d6b',2:'#e63946',3:'#ff9f1c',4:'#ffd23f',5:'#52b788',6:'#4895ef',7:'#9b5de5',8:'#ffffff',9:'#ff5fa2'}, rows: mandala() },
    { name:'Heart', level:'⭐', bg:'#fff1ea', pal:{1:'#9d0208',2:'#e63946',3:'#ffc2cf'}, rows:[
      '................','...1111..1111...','..122221122221..','.12322222222221.','.12332222222221.','.12222222222221.',
      '..122222222221..','...1222222221...','....12222221....','.....122221.....','......1221......','.......11.......','................' ]},
    { name:'Rocket', level:'⭐⭐', bg:'#1d2b53', pal:{1:'#3a3f5c',2:'#f1f3f9',3:'#e63946',4:'#74c0fc',5:'#ff8c1a',6:'#ffe066'}, rows:[
      '.......11.......','......1331......','.....133331.....','.....133331.....','.....122221.....','.....124421.....','.....124421.....',
      '.....122221.....','.....122221.....','...1312222131...','..133122221331..','..131122221131..','..11.111111.11..','......5665......','.......66.......','.......55.......' ]},
    { name:'Cat', level:'⭐⭐', bg:'#cfefff', pal:{1:'#4a2c14',2:'#ff9f43',3:'#fff6e8',4:'#ff8fa3',5:'#52b788'}, rows:[
      '.11..........11.','.1221......1221.','.12421111112421.','.12222222222221.','.12255222255221.','.12255222255221.',
      '.12222222222221.','.12222244222221.','.12223333332221.','..122333333221..','...1222222221...','....11111111....' ]},
    { name:'Rainbow', level:'⭐⭐', bg:'#cfefff', pal:{1:'#e63946',2:'#ff9f1c',3:'#ffd60a',4:'#52b788',5:'#4895ef',6:'#9b5de5',7:'#ffffff'}, rows: rainbow() }
  ];
  // ===END PICS===
  const CHARS = CH;
  PICS.forEach(p => {
    p.w = p.rows[0].length; p.h = p.rows.length;
    const raw = p.rows.join('').split('').map(ch => ch === '.' ? 0 : CHARS.indexOf(ch) + 1);
    // drop colors nobody uses, then renumber so the numbers go 1, 2, 3... with no gaps
    const used = [...new Set(raw.filter(n => n > 0))].sort((x, y) => x - y), map = {}, pal = {};
    used.forEach((o, i) => { map[o] = i + 1; pal[i + 1] = p.pal[o]; });
    p.pal = pal; p.cells = raw.map(n => n ? map[n] : 0);
    p.total = p.cells.filter(n => n > 0).length;
  });

  // ================= state =================
  let pi = 0, pic = PICS[0], filled = [], sel = 0, showNums = true, paused = false, muted = false, hover = true, zoom = 1;
  let wrong = null, hint = null, won = false, dirty = true;
  const doneSet = {};
  try { JSON.parse(localStorage.getItem('pbn-done') || '[]').forEach(n => doneSet[n] = 1); } catch(e) {}

  const $ = id => document.getElementById(id);
  const board = $('board'), bctx = board.getContext('2d'), msg = $('msg'), stage = $('stage');
  let msgT = 0;
  function say(t, ms) { msg.textContent = t; clearTimeout(msgT); if (ms) msgT = setTimeout(() => { msg.textContent = defaultMsg(); }, ms); }
  const defaultMsg = () => !sel ? 'Pick a color below, then paint the squares with the same number!'
    : 'Paint the squares that say ' + sel + '! ' + (hover ? 'Just move your mouse over them — no clicking needed. 🖌️' : 'Click or drag. 🖌️');

  function loadPic(i) {
    pi = i; pic = PICS[i]; filled = new Array(pic.cells.length).fill(0); won = false; hint = null; wrong = null; zoom = 1;
    try {
      const s = localStorage.getItem('pbn-' + pic.name);
      if (s && s.length === filled.length) filled = s.split('').map(Number);
    } catch(e) {}
    sel = 0; renderPics(); renderPalette(); updateBar(); say(defaultMsg());
    $('win').classList.remove('show');
    layout(); stage.scrollTo(0, 0);
  }
  function save() { try { localStorage.setItem('pbn-' + pic.name, filled.join('')); } catch(e) {} }
  function saveDone() { try { localStorage.setItem('pbn-done', JSON.stringify(Object.keys(doneSet))); } catch(e) {} }
  const remaining = n => { let c = 0; for (let i = 0; i < pic.cells.length; i++) if (pic.cells[i] === n && !filled[i]) c++; return c; };

  // ================= picture picker + palette =================
  function thumb(p) {
    const c = document.createElement('canvas'); c.width = c.height = 44;
    const g = c.getContext('2d'), s = Math.min(44 / p.w, 44 / p.h), ox = (44 - p.w*s)/2, oy = (44 - p.h*s)/2;
    g.fillStyle = p.bg; g.fillRect(0,0,44,44);
    p.cells.forEach((n,i) => { if (n) { g.fillStyle = p.pal[n]; g.fillRect(ox + (i%p.w)*s, oy + Math.floor(i/p.w)*s, s+.5, s+.5); } });
    return c;
  }
  function renderPics() {
    const el = $('pics'); el.innerHTML = '';
    PICS.forEach((p,i) => {
      const b = document.createElement('button'); b.className = 'pic' + (i === pi ? ' on' : ''); b.title = p.name + ' ' + p.level;
      b.appendChild(thumb(p));
      if (doneSet[p.name]) { const s = document.createElement('span'); s.className = 'star'; s.textContent = '⭐'; b.appendChild(s); }
      b.onclick = () => { if (i !== pi) loadPic(i); };
      el.appendChild(b);
    });
  }
  function renderPalette() {
    const el = $('palette'); el.innerHTML = ''; el.className = Object.keys(pic.pal).length > 12 ? 'many' : '';
    Object.keys(pic.pal).forEach(k => {
      const n = +k, left = remaining(n), b = document.createElement('button');
      b.className = 'sw' + (n === sel ? ' sel' : '') + (left === 0 ? ' done' : '');
      b.innerHTML = '<span class="chip' + (n > 9 && left ? ' two' : '') + '" style="background:' + pic.pal[n] + ';color:' + textOn(pic.pal[n]) + '">' + (left === 0 ? '✓' : n) + '</span><span class="cnt">' + (left === 0 ? 'done!' : left + ' left') + '</span>';
      b.onclick = () => choose(n);
      el.appendChild(b);
    });
    dirty = true;
  }
  function textOn(hex) { const v = parseInt(hex.slice(1), 16), r = v >> 16, g = (v >> 8) & 255, b = v & 255; return (r*.299 + g*.587 + b*.114) > 150 ? '#222' : '#fff'; }
  function choose(n) {
    if (remaining(n) === 0) { say('All the ' + n + 's are done! Pick another color. 😄', 2000); return; }
    sel = n; hint = null; renderPalette(); say(defaultMsg()); tone(300 + n*40, .08, 'triangle', .1);
  }
  function updateBar() {
    let d = 0; for (let i = 0; i < pic.cells.length; i++) if (pic.cells[i] > 0 && filled[i]) d++;
    const pct = Math.floor(d / pic.total * 100);
    $('fill').style.width = pct + '%'; $('pct').textContent = pct + '%';
    return d === pic.total;
  }

  // ================= sound =================
  let ac = null;
  function tone(freq, dur, type, vol, when) {
    if (muted) return;
    try {
      if (!ac) ac = new (window.AudioContext || window.webkitAudioContext)();
      if (ac.state === 'suspended') ac.resume();
      const t = ac.currentTime + (when || 0), o = ac.createOscillator(), g = ac.createGain();
      o.type = type || 'sine'; o.frequency.value = freq;
      g.gain.setValueAtTime(vol || .15, t); g.gain.exponentialRampToValueAtTime(0.001, t + dur);
      o.connect(g); g.connect(ac.destination); o.start(t); o.stop(t + dur + .02);
    } catch(e) {}
  }

  // ================= layout + drawing =================
  let cs = 20, dpr = 1;
  function layout() {
    const r = stage.getBoundingClientRect(); dpr = window.devicePixelRatio || 1;
    const fit = Math.floor(Math.min((r.width - 4) / pic.w, (r.height - 4) / pic.h));
    const base = Math.max(fit, 16);
    cs = Math.max(8, Math.min(64, Math.round(base * zoom)));
    const W = cs * pic.w, H = cs * pic.h;
    board.style.width = W + 'px'; board.style.height = H + 'px';
    board.width = Math.floor(W * dpr); board.height = Math.floor(H * dpr);
    board.style.touchAction = (W > r.width + 2 || H > r.height + 2) ? 'pan-x pan-y' : 'none';
    dirty = true;
  }
  addEventListener('resize', () => { layout(); fitFx(); });
  function setZoom(z) { zoom = Math.max(.5, Math.min(3, z)); layout(); }
  $('zoomIn').onclick = () => setZoom(zoom * 1.25);
  $('zoomOut').onclick = () => setZoom(zoom / 1.25);

  function draw() {
    const g = bctx; g.setTransform(dpr,0,0,dpr,0,0); g.clearRect(0,0,board.width,board.height);
    g.textAlign = 'center'; g.textBaseline = 'middle';
    const fs = Math.max(8, Math.floor(cs * .52));
    for (let i = 0; i < pic.cells.length; i++) {
      const n = pic.cells[i], x = (i % pic.w) * cs, y = Math.floor(i / pic.w) * cs;
      let dx = 0;
      if (wrong && wrong.i === i) dx = Math.sin(wrong.t * .9) * 3 * (wrong.t / 20);
      if (n === 0) g.fillStyle = pic.bg;
      else if (filled[i]) g.fillStyle = pic.pal[n];
      else g.fillStyle = n === sel ? '#ffe7a0' : '#f3f0ff';
      g.fillRect(x + dx, y, cs, cs);
      g.strokeStyle = n === 0 ? 'rgba(0,0,0,.05)' : (filled[i] ? 'rgba(0,0,0,.10)' : 'rgba(0,0,0,.18)'); g.lineWidth = 1; g.strokeRect(x + dx + .5, y + .5, cs - 1, cs - 1);
      if (n > 0 && !filled[i] && showNums) {
        g.fillStyle = n === sel ? '#2b1d6b' : '#9a93bd';
        g.font = (n === sel ? '900 ' : '700 ') + (n > 9 ? fs - 1 : fs) + 'px system-ui';
        g.fillText(n, x + dx + cs/2, y + cs/2 + 1);
      }
    }
    if (hint) {
      const x = (hint.i % pic.w) * cs, y = Math.floor(hint.i / pic.w) * cs, k = 2 + Math.abs(Math.sin(hint.t * .12)) * 4;
      g.strokeStyle = '#ff3d71'; g.lineWidth = 3; g.strokeRect(x - k, y - k, cs + k*2, cs + k*2);
    }
  }

  // ================= painting =================
  function cellAt(e) {
    const r = board.getBoundingClientRect(), x = Math.floor((e.clientX - r.left) / cs), y = Math.floor((e.clientY - r.top) / cs);
    return (x < 0 || y < 0 || x >= pic.w || y >= pic.h) ? -1 : y * pic.w + x;
  }
  function handle(e, drag) {
    if (paused || won) return;
    const i = cellAt(e); if (i < 0) return;
    const n = pic.cells[i]; if (n === 0 || filled[i]) return;
    if (!sel) { if (!drag) say('Pick a color first! 👇', 2000); return; }
    if (n === sel) fillCell(i);
    else if (!drag) { wrong = {i, t:20}; dirty = true; tone(140, .15, 'square', .08); say('That square is a ' + n + '! Pick color ' + n + ' to paint it. 😉', 2500); }
  }
  function fillCell(i) {
    filled[i] = 1; hint = null; save(); dirty = true;
    const n = pic.cells[i], r = board.getBoundingClientRect();
    burst(r.left + (i % pic.w) * cs + cs/2, r.top + Math.floor(i / pic.w) * cs + cs/2, pic.pal[n], 4);
    tone(440 + (n % 8)*70, .08, 'sine', .12);
    if (remaining(n) === 0) {
      tone(880, .12, 'triangle', .12, .05); tone(1100, .15, 'triangle', .12, .15);
      say('All the ' + n + 's are done! 🎉', 2500);
      sel = Object.keys(pic.pal).map(Number).find(k => remaining(k) > 0) || 0;
    }
    renderPalette();
    if (updateBar()) win();
  }
  let painting = false;
  board.addEventListener('pointerdown', e => {
    painting = true;
    try { if (e.pointerType === 'mouse') board.setPointerCapture(e.pointerId); } catch(err) {}
    handle(e, false);
  });
  board.addEventListener('pointermove', e => { if (painting || (hover && e.pointerType === 'mouse')) handle(e, true); });
  addEventListener('pointerup', () => { painting = false; });
  addEventListener('pointercancel', () => { painting = false; });

  $('hintBtn').onclick = giveHint;
  function giveHint() {
    if (paused || won) return;
    let pool = [];
    for (let i = 0; i < pic.cells.length; i++) if (pic.cells[i] > 0 && !filled[i] && (!sel || pic.cells[i] === sel)) pool.push(i);
    if (!pool.length) { for (let i = 0; i < pic.cells.length; i++) if (pic.cells[i] > 0 && !filled[i]) pool.push(i); }
    if (!pool.length) return;
    const i = pool[Math.random() * pool.length | 0], n = pic.cells[i];
    if (sel !== n) { sel = n; renderPalette(); }
    hint = {i, t:0}; say('Look for the pulsing red box — it\'s a ' + n + '! 👀', 3000);
    const x = (i % pic.w) * cs, y = Math.floor(i / pic.w) * cs;
    stage.scrollTo({left: x - stage.clientWidth/2, top: y - stage.clientHeight/2, behavior:'smooth'});
  }
  $('hoverBtn').onclick = e => { hover = !hover; e.currentTarget.classList.toggle('on', hover); say(defaultMsg()); };
  $('numBtn').onclick = e => { showNums = !showNums; e.currentTarget.classList.toggle('on', showNums); dirty = true; };
  $('muteBtn').onclick = e => { muted = !muted; e.currentTarget.textContent = muted ? '🔇' : '🔊'; };
  $('resetBtn').onclick = () => {
    if (!confirm('Start ' + pic.name + ' over from the beginning?')) return;
    try { localStorage.removeItem('pbn-' + pic.name); } catch(e) {}
    delete doneSet[pic.name]; saveDone(); loadPic(pi);
  };
  $('nextBtn').onclick = () => loadPic((pi + 1) % PICS.length);
  $('closeBtn').onclick = () => $('win').classList.remove('show');

  function win() {
    won = true; doneSet[pic.name] = 1; saveDone(); renderPics();
    $('winTxt').textContent = 'You finished the ' + pic.name + '! ⭐';
    setTimeout(() => $('win').classList.add('show'), 700);
    for (let k = 0; k < 8; k++) setTimeout(() => confetti(), k * 160);
    [523,659,784,1047].forEach((f,k) => tone(f, .25, 'triangle', .16, k * .12));
  }

  // ================= pause + keys =================
  function setPause(p) { paused = p; $('pauseOv').classList.toggle('show', p); $('pauseBtn').textContent = p ? '▶ Resume' : '⏸ Pause'; }
  $('pauseBtn').onclick = () => setPause(!paused);
  $('resumeBtn').onclick = () => setPause(false);
  addEventListener('keydown', e => {
    if (e.repeat) return;
    const k = e.key.toLowerCase();
    if (k === 'p' || k === 'escape') { setPause(!paused); return; }
    if (paused) return;
    if (k >= '1' && k <= '9' && pic.pal[+k]) choose(+k);
    else if (k === 'h') giveHint();
    else if (k === '+' || k === '=') setZoom(zoom * 1.25);
    else if (k === '-') setZoom(zoom / 1.25);
  });
  document.addEventListener('click', e => { const b = e.target.closest('button'); if (b) b.blur(); });

  // ================= confetti (fixed 60 updates/sec) =================
  const fx = $('fx'), f2 = fx.getContext('2d'), bits = [];
  function fitFx() { fx.width = innerWidth; fx.height = innerHeight; }
  fitFx();
  function burst(x, y, col, n) { for (let i = 0; i < n; i++) bits.push({x, y, vx:(Math.random()-.5)*5, vy:-1-Math.random()*4, life:34, col, s:4+Math.random()*4, g:.25}); }
  function confetti() {
    const cols = ['#ff6b6b','#ffd23f','#69db7c','#4dabf7','#da77f2','#ff8fa3'];
    for (let i = 0; i < 40; i++) bits.push({x:Math.random()*innerWidth, y:-10, vx:(Math.random()-.5)*3, vy:2+Math.random()*3, life:140, col:cols[Math.random()*cols.length|0], s:6+Math.random()*6, g:.03});
  }
  const STEP = 1000/60;
  function update() {
    for (let i = bits.length-1; i >= 0; i--) { const p = bits[i]; p.x += p.vx; p.y += p.vy; p.vy += p.g; if (--p.life <= 0) bits.splice(i,1); }
    if (wrong) { wrong.t--; if (wrong.t <= 0) wrong = null; dirty = true; }
    if (hint) { hint.t++; dirty = true; if (hint.t > 300) hint = null; }
  }
  function drawFx() {
    f2.clearRect(0,0,fx.width,fx.height);
    for (const p of bits) { f2.globalAlpha = Math.min(1, p.life/20); f2.fillStyle = p.col; f2.fillRect(p.x, p.y, p.s, p.s); }
    f2.globalAlpha = 1;
  }
  let last = performance.now(), acc = 0;
  function frame(now) {
    acc += Math.min(now - last, 250); last = now;
    while (acc >= STEP) { if (!paused) update(); acc -= STEP; }
    if (dirty) { draw(); dirty = false; }
    drawFx(); requestAnimationFrame(frame);
  }

  loadPic(0);
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
