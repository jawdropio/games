<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>JAW BATTLE</title>
<style>
  html, body { margin:0; height:100%; background:#120b2e; color:#f4f1ff; font-family:system-ui, sans-serif; overflow:hidden; touch-action:none; user-select:none; }
  body { display:grid; place-items:center; }
  canvas { background:#1d1445; border:3px solid #4b3a9e; border-radius:12px; cursor:crosshair; touch-action:none; }
  .top { position:fixed; top:10px; left:12px; right:12px; display:flex; justify-content:space-between; align-items:center; pointer-events:none; }
  .top > * { pointer-events:auto; }
  a { color:#a99ee0; text-decoration:none; font-weight:700; }
  button { font:inherit; font-weight:800; background:#6c4cff; color:#fff; border:0; border-radius:10px; padding:8px 16px; cursor:pointer; }
  button:hover { background:#8269ff; }
  #overlay { overflow:auto; position:fixed; inset:0; background:rgba(10,6,30,.78); display:grid; place-items:center; text-align:center; }
  #overlay.hide { display:none; }
  #panel { margin:0 0 18px; display:flex; flex-direction:column; gap:8px; align-items:center; }
  #panel .row { display:flex; gap:8px; align-items:center; justify-content:center; flex-wrap:wrap; }
  #panel button { font-size:16px; padding:8px 14px; background:#2c2268; }
  #panel button.on { background:#ffb020; color:#2a1a00; }
  #panel button:disabled { opacity:.5; cursor:default; }
  #panel input { font:inherit; font-weight:800; font-size:18px; width:130px; text-align:center; text-transform:uppercase; padding:8px; border-radius:10px; border:2px solid #4b3a9e; background:#120b2e; color:#fff; }
  .code { font-size:30px; font-weight:900; letter-spacing:3px; color:#ffb020; }
  #aceBtn { position:fixed; left:0; top:50%; z-index:20; display:none; font-size:11px; padding:5px 8px; border-radius:0 8px 8px 0; background:#2c2268; opacity:.65; }
  #acePanel { position:fixed; left:0; top:calc(50% + 32px); z-index:20; display:none; background:#1d1445; padding:8px; border-radius:0 10px 10px 0; font-size:12px; }
  #acePanel input { font:inherit; width:110px; padding:5px; border-radius:6px; border:2px solid #4b3a9e; background:#120b2e; color:#fff; text-transform:uppercase; }
  #acePanel button { font-size:12px; padding:5px 10px; }
  #diffRow { display:flex; gap:8px; justify-content:center; margin:0 0 18px; flex-wrap:wrap; }
  #diffRow button { background:#2c2268; font-size:16px; padding:8px 14px; }
  #diffRow button.on { background:#ffb020; color:#2a1a00; }
  #overlay h1 { font-size:clamp(32px,7vw,56px); margin:0 0 10px; }
  #overlay p { margin:0 0 18px; color:#cfc8f5; line-height:1.5; }
  #overlay button { font-size:22px; padding:12px 28px; }
</style>
</head>
<body>
<div class="top">
  <a href="../">← Arcade</a>
  <button id="pauseBtn">⏸ Pause</button>
</div>
<canvas id="c" width="960" height="600"></canvas>
<div id="overlay">
  <div>
    <h1 id="ovTitle">🦷 JAW BATTLE</h1>
    <p id="ovText"></p>
    <div id="diffRow"></div>
    <div id="panel"></div>
    <button id="ovBtn">Play!</button>
  </div>
</div>

<button id="aceBtn">✏️ Edit Aces</button>
<div id="acePanel"><input id="aceIn" maxlength="12" placeholder="..."> <button id="aceGo">OK</button><div id="aceMsg"></div></div>
<script>
(() => {
  let W = 960, H = 600;
  const cv = document.getElementById('c'), ctx = cv.getContext('2d');
  const overlay = document.getElementById('overlay');
  const ovTitle = document.getElementById('ovTitle'), ovText = document.getElementById('ovText'), ovBtn = document.getElementById('ovBtn');
  const pauseBtn = document.getElementById('pauseBtn');

  // ---------- sizing ----------
  function resize() {
    const s = Math.min((innerWidth - 20) / W, (innerHeight - 60) / H);
    cv.style.width = W * s + 'px';
    cv.style.height = H * s + 'px';
  }
  addEventListener('resize', resize); resize();
  function setArena(w, h) { if (W === w && H === h) return; W = w; H = h; cv.width = w; cv.height = h; resize(); }

  // ---------- sound ----------
  let ac = null;
  function unlockAudio() {
    try {
      if (!ac) ac = new (window.AudioContext || window.webkitAudioContext)();
      if (ac.state !== 'running') ac.resume();
    } catch (e) {}
  }
  ['pointerdown', 'keydown', 'click', 'touchend'].forEach(ev => addEventListener(ev, unlockAudio, true));
  function beep(freq, dur, type = 'square', vol = 0.06, slide = 0) {
    try {
      unlockAudio();
      if (!ac) return;
      const o = ac.createOscillator(), g = ac.createGain();
      o.type = type; o.frequency.setValueAtTime(freq, ac.currentTime);
      if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(30, freq + slide), ac.currentTime + dur);
      g.gain.setValueAtTime(vol, ac.currentTime);
      g.gain.exponentialRampToValueAtTime(0.001, ac.currentTime + dur);
      o.connect(g); g.connect(ac.destination);
      o.start(); o.stop(ac.currentTime + dur);
    } catch (e) {}
  }
  const sfx = {
    shoot: () => beep(520, 0.1, 'square', 0.05, -300),
    botShoot: () => beep(300, 0.1, 'sawtooth', 0.04, -150),
    hit: () => beep(200, 0.18, 'sawtooth', 0.08, -120),
    crate: () => beep(120, 0.08, 'triangle', 0.08),
    win: () => [523, 659, 784, 1046].forEach((f, i) => setTimeout(() => beep(f, 0.18, 'square', 0.07), i * 110)),
    lose: () => [400, 330, 260, 180].forEach((f, i) => setTimeout(() => beep(f, 0.22, 'sawtooth', 0.07), i * 140)),
  };

  // ---------- levels ----------
  // type: 'w' = solid wall, 'c' = crate (breaks after 3 hits)
  const layouts = [
    [ [450,100,60,150,'w'], [450,350,60,150,'w'], [290,140,50,50,'c'], [290,410,50,50,'c'], [620,140,50,50,'c'], [620,410,50,50,'c'] ],
    [ [210,190,22,220,'w'], [728,190,22,220,'w'], [400,270,160,60,'w'], [450,90,60,60,'c'], [450,450,60,60,'c'] ],
    [ [300,80,60,60,'w'], [300,460,60,60,'w'], [600,80,60,60,'w'], [600,460,60,60,'w'], [430,220,100,40,'c'], [430,340,100,40,'c'], [200,280,40,40,'c'], [720,280,40,40,'c'] ],
  ];

  // ---------- state ----------
  let state = 'menu'; // menu | play | paused | over
  let player, bot, bullets, obstacles, parts, round = 1, wins = 0, best = 0, layoutIdx = 0, shake = 0;

  // ---------- difficulty ----------
  const DIFFS = {
    easy:   { label: '😊 Easy',   speed: 1.7, err: 0.28, cd: 1.8, fireP: 0.05, dodge: 0.2, hp: 14, guns: [0] },
    medium: { label: '😎 Medium', speed: 2.2, err: 0.16, cd: 1.2, fireP: 0.09, dodge: 0.6, hp: 20, guns: [0, 1] },
    hard:   { label: '😤 Hard',   speed: 2.7, err: 0.08, cd: 1.0, fireP: 0.13, dodge: 0.9, hp: 24, guns: [0, 1, 2] },
    insane: { label: '💀 Insane', speed: 3.2, err: 0.04, cd: 0.8, fireP: 0.20, dodge: 1.0, hp: 30, guns: [0, 1, 2, 3] },
  };
  let diffName = 'medium';
  try { const d = localStorage.getItem('jawBattleDiff'); if (DIFFS[d]) diffName = d; } catch (e) {}
  const diff = () => DIFFS[diffName];
  // coins + owned guns (saved in the browser)
  let mode = '1p', score1 = 0, score2 = 0, coins = 0, owned = [true, false, false, false, false, false, false, false], startMap = 0;
  try { coins = +localStorage.getItem('jawBattleCoins') || 0; const o = JSON.parse(localStorage.getItem('jawBattleGuns') || 'null'); if (Array.isArray(o)) owned = owned.map((_, i) => !!o[i]); owned[0] = true; } catch (e) {}
  // gun levels: guns level up by dealing damage with them
  const XP_AT = [0, 40, 100, 200, 400]; // only used to carry over levels earned before upgrades were for sale
  let gunLv = Array(8).fill(1), toast = null;
  try {
    const lv = JSON.parse(localStorage.getItem('jawBattleLv') || 'null'), x = JSON.parse(localStorage.getItem('jawBattleXP') || 'null');
    if (Array.isArray(lv)) gunLv = gunLv.map((_, i) => Math.max(1, Math.min(5, +lv[i] || 1)));
    else if (Array.isArray(x)) gunLv = gunLv.map((_, i) => { let l = 1; for (let k = 1; k < XP_AT.length; k++) if ((+x[i] || 0) >= XP_AT[k]) l = k + 1; return l; });
  } catch (e) {}
  const gunLevel = i => gunLv[i];
  const upCost = lv => [30, 60, 100, 150][lv - 1];
  let aimbot = false, aimPro = false, aimShots = 0;
  try { const v = localStorage.getItem('jawBattleAimbot'); aimbot = v === '1' || v === '2'; aimPro = v === '2'; } catch (e) {}
  let daily = { last: '', streak: 0 };
  try { const d = JSON.parse(localStorage.getItem('jawBattleDaily') || 'null'); if (d && typeof d.last === 'string') daily = { last: d.last, streak: +d.streak || 0 }; } catch (e) {}
  const dayStr = ms => { const d = new Date(ms); return d.getFullYear() + '-' + (d.getMonth() + 1) + '-' + d.getDate(); };
  const dailyReady = () => daily.last !== dayStr(Date.now());
  const dailyReward = streak => 50 + 10 * (Math.min(streak, 7) - 1);
  function claimDaily() {
    if (!dailyReady()) return;
    const streak = daily.last === dayStr(Date.now() - 864e5) ? daily.streak + 1 : 1;
    const gain = dailyReward(streak);
    coins += gain; daily = { last: dayStr(Date.now()), streak };
    try { localStorage.setItem('jawBattleDaily', JSON.stringify(daily)); } catch (e) {}
    saveStuff();
    [660, 880, 1100].forEach((f, i) => setTimeout(() => beep(f, 0.15, 'square', 0.07), i * 90));
    showMenu('🎁 You got ' + gain + ' coins! Day ' + streak + ' in a row.');
  }
  function saveStuff() { try { localStorage.setItem('jawBattleCoins', coins); localStorage.setItem('jawBattleGuns', JSON.stringify(owned)); localStorage.setItem('jawBattleLv', JSON.stringify(gunLv)); } catch (e) {} }
  function loadBest() { best = 0; try { best = +localStorage.getItem('jawBattleBest_' + diffName) || 0; } catch (e) {} }
  loadBest();

  // ---------- guns ----------
  const GUNS = [
    { name: 'Pistol',      cd: 16, n: 1, spread: 0.02, speed: 9,   dmg: 4, life: 140, freq: 520, color: '#bff3ff', cost: 0 },
    { name: 'Shotgun',     cd: 50, n: 5, spread: 0.40, speed: 8,   dmg: 1, life: 38,  freq: 220, color: '#ffe08a', cost: 20, info: '5 pellets, great up close' },
    { name: 'Machine Gun', short: 'M.Gun', cd: 6,  n: 1, spread: 0.14, speed: 9.5, dmg: 0.6, life: 100, freq: 700, color: '#c8ffb0', cost: 35, info: 'Super fast, tiny damage' },
    { name: 'Sniper',      cd: 75, n: 1, spread: 0,    speed: 18,  dmg: 12, life: 80,  freq: 300, color: '#ffffff', cost: 50, info: 'Slow, but 3 hearts per hit!' },
    { name: 'Triple Shot', short: 'Triple',  cd: 28, n: 3, spread: 0.30, speed: 9,   dmg: 2,   life: 120, freq: 450, color: '#ffb3f0', cost: 40, info: '3 bullets in a fan' },
    { name: 'Bouncer',     short: 'Bouncer', cd: 22, n: 1, spread: 0.03, speed: 8,   dmg: 3,   life: 200, freq: 380, color: '#7dffb0', cost: 60, info: 'Bullets bounce off walls!', bounce: 3 },
    { name: 'Cannon',      short: 'Cannon',  cd: 70, n: 1, spread: 0,    speed: 5,   dmg: 8,   life: 200, freq: 110, color: '#ff9a4d', cost: 75, info: 'Huge slow ball, smashes blocks', r: 11, obs: 3 },
    { name: 'Laser',       short: 'Laser',   cd: 9,  n: 1, spread: 0.02, speed: 15,  dmg: 1.2, life: 90,  freq: 900, color: '#ff5de0', cost: 90, info: 'Fast zappy shots' },
  ];

  // ---------- building ----------
  const GRID = 40, BUILD_RANGE = 240, MAX_BLOCKS = 8;

  function makeFighter(x, y, color, isBot) {
    return { x, y, r: 17, hp: 20, maxHp: 20, gun: 0, digT: 0, blocks: 5, blockT: 0, color, isBot, aim: isBot ? Math.PI : 0, cd: 0, flash: 0,
             // bot brain
             strafe: 1, strafeT: 0, dodge: 0, stuck: 0 };
  }

  function startRound() {
    setArena(mode === 'ctf' ? 1440 : 960, mode === 'ctf' ? 900 : 600);
    if (mode === 'ctf') { BASE_P.x = 60; BASE_P.y = H / 2; BASE_B.x = W - 60; BASE_B.y = H / 2; }
    obstacles = (mode === 'ctf' ? CTF_LAYOUT : layouts[layoutIdx % layouts.length]).map(o => ({ x:o[0], y:o[1], w:o[2], h:o[3], type:o[4], hp:3, maxHp:3 }));
    player = makeFighter(80, H / 2, '#4fd1ff', false);
    bot = makeFighter(W - 80, H / 2, '#ff6b9a', true);
    bullets = []; parts = []; flags = null;
    if (mode === 'ctf') initFlags();
    state = 'play';
    showOverlay(false);
  }

  function newGame() { round = 1; wins = 0; layoutIdx = startMap; startRound(); }

  // ---------- overlay ----------
  let ovAction = newGame;
  const diffRow = document.getElementById('diffRow');
  let onDiff = null;
  const panel = document.getElementById('panel');
  function renderDiff() {
    diffRow.innerHTML = '';
    for (const k in DIFFS) {
      const b = document.createElement('button');
      b.textContent = DIFFS[k].label;
      b.className = k === diffName ? 'on' : '';
      b.onclick = () => {
        diffName = k; loadBest();
        try { localStorage.setItem('jawBattleDiff', k); } catch (e) {}
        renderDiff(); if (onDiff) onDiff();
      };
      diffRow.appendChild(b);
    }
  }
  function showOverlay(show, title, text, btn, action, showDiff, build, diffHook) {
    overlay.classList.toggle('hide', !show);
    if (!show) return;
    setMenuFlag(false);
    diffRow.style.display = showDiff ? 'flex' : 'none';
    onDiff = diffHook || null;
    if (showDiff) renderDiff();
    panel.innerHTML = ''; if (build) build(panel);
    ovTitle.textContent = title; ovText.innerHTML = text; ovBtn.textContent = btn; ovAction = action;
  }
  ovBtn.addEventListener('click', () => ovAction());
  function showMenu(note) {
    showOverlay(true, '🦷 JAW BATTLE',
      (note ? '<b style="color:#ffb020">' + note + '</b><br>' : '') + 'Beat the bot before it beats you! Pick your difficulty:<br>' +
      '<b>Move:</b> WASD / arrows &nbsp; <b>Aim:</b> mouse &nbsp; <b>Shoot:</b> click or Space<br>' +
      '<b>Switch gun:</b> 1-4 or mouse wheel &nbsp; <b>Build wall:</b> B or right-click<br>' +
      '<b>Pause:</b> P or Esc<br>🚩 <b>Capture the Flag:</b> grab the other flag and run it to your base. First to 3 wins! Hold <b>E</b> to dig tunnels, and the map is big.<br>👥 <b>2 Players:</b> P1 = WASD + mouse. P2 = arrow keys (faces where it walks), Enter shoots, Shift builds, / switches gun.<br>📱 Touch: drag left to move, drag right to aim &amp; shoot.' +
      (best ? '<br>🏆 Best win streak: ' + best : '') + '<br>💰 Coins: <b>' + coins + '</b>', 'Play!', newGame1P, true, menuLinks);
    setMenuFlag(true);
  }
  // ---------- capture the flag ----------
  const BASE_P = { x: 60, y: 300 }, BASE_B = { x: 900, y: 300 }, BASE_R = 46, CTF_WIN = 3;
  const CTF_LAYOUT = [ [660,190,120,40,'w'], [660,670,120,40,'w'], [400,100,26,260,'w'], [400,540,26,260,'w'], [1014,100,26,260,'w'], [1014,540,26,260,'w'], [620,410,200,80,'c'], [240,200,60,60,'c'], [240,640,60,60,'c'], [1140,200,60,60,'c'], [1140,640,60,60,'c'], [540,320,26,110,'w'], [874,470,26,110,'w'] ];
  let flags = null, caps1 = 0, caps2 = 0, banner = null;
  const atBase = (fl, base) => fl.x === base.x && fl.y === base.y;
  function initFlags() { flags = { p: { x: BASE_P.x, y: BASE_P.y, carrier: null }, b: { x: BASE_B.x, y: BASE_B.y, carrier: null } }; }
  function newCTF() { mode = 'ctf'; caps1 = caps2 = 0; banner = null; round = 1; startRound(); }
  function ctfRespawn(f, x) { f.dead = false; f.hp = f.maxHp; f.x = x; f.y = H / 2; f.cd = 0; f.respawn = 0; }
  function ctfScore(who) {
    who === 'p' ? caps1++ : caps2++;
    banner = { text: who === 'p' ? '🚩 You scored!' : '🚩 Bot scored!', t: 110 };
    sfx[who === 'p' ? 'win' : 'lose']();
    initFlags(); bullets = [];
    ctfRespawn(player, 80); ctfRespawn(bot, W - 80);
    if (caps1 >= CTF_WIN || caps2 >= CTF_WIN) endCTF(caps1 >= CTF_WIN);
  }
  function ctfTick() {
    if (banner && banner.t > 0) banner.t--;
    const sides = [[player, flags.p, flags.b, BASE_P, 'p'], [bot, flags.b, flags.p, BASE_B, 'b']];
    for (const [f, mine, theirs, base, who] of sides) {
      if (f.dead) continue;
      if (!theirs.carrier && Math.hypot(f.x - theirs.x, f.y - theirs.y) < f.r + 14) { theirs.carrier = f; beep(740, 0.12, 'square', 0.06); }
      if (!mine.carrier && !atBase(mine, base) && Math.hypot(f.x - mine.x, f.y - mine.y) < f.r + 14) { mine.x = base.x; mine.y = base.y; beep(500, 0.12, 'triangle', 0.07); }
      if (theirs.carrier === f && atBase(mine, base) && Math.hypot(f.x - base.x, f.y - base.y) < BASE_R) { ctfScore(who); return; }
    }
    for (const fl of [flags.p, flags.b]) if (fl.carrier) { fl.x = fl.carrier.x; fl.y = fl.carrier.y; }
    for (const f of [player, bot]) {
      if (!f.dead && f.hp <= 0) {
        f.dead = true; f.respawn = 150; burst(f.x, f.y, f.color, 20);
        for (const fl of [flags.p, flags.b]) if (fl.carrier === f) fl.carrier = null;
      } else if (f.dead && --f.respawn <= 0) ctfRespawn(f, f === player ? 80 : W - 80);
    }
  }
  // digging (Capture the Flag): hold E to carve a tunnel through whatever is in front of you
  function dig(f) {
    const hx = f.x + Math.cos(f.aim) * (f.r + 16), hy = f.y + Math.sin(f.aim) * (f.r + 16), hs = 22;
    const hx1 = hx - hs, hx2 = hx + hs, hy1 = hy - hs, hy2 = hy + hs, out = [];
    let dug = false;
    for (const o of obstacles) {
      if (hx1 >= o.x + o.w || hx2 <= o.x || hy1 >= o.y + o.h || hy2 <= o.y) { out.push(o); continue; }
      dug = true;
      const ix1 = Math.max(o.x, hx1), ix2 = Math.min(o.x + o.w, hx2), iy1 = Math.max(o.y, hy1), iy2 = Math.min(o.y + o.h, hy2);
      for (const [x, y, w, h] of [[o.x, o.y, ix1 - o.x, o.h], [ix2, o.y, o.x + o.w - ix2, o.h], [ix1, o.y, ix2 - ix1, iy1 - o.y], [ix1, iy2, ix2 - ix1, o.y + o.h - iy2]])
        if (w >= 6 && h >= 6) out.push(Object.assign({}, o, { x, y, w, h }));
    }
    if (dug) { obstacles = out; burst(hx, hy, '#c9b48a', 8); beep(140, 0.06, 'triangle', 0.06); }
  }
  function botGoal() {
    if (flags.b.carrier === player) return { x: player.x, y: player.y };
    if (!atBase(flags.b, BASE_B)) return { x: flags.b.x, y: flags.b.y };
    if (flags.p.carrier === bot) return BASE_B;
    return { x: flags.p.x, y: flags.p.y };
  }
  function endCTF(won) {
    state = 'over';
    const gain = won ? 15 + { easy: 0, medium: 5, hard: 10, insane: 20 }[diffName] : 3;
    coins += gain; saveStuff();
    showOverlay(true, won ? '🏆 You win the flag battle!' : '💥 The bot captured 3 flags!',
      'Final score: You <b>' + caps1 + '</b> – <b>' + caps2 + '</b> Bot<br>💰 +' + gain + ' coins (you have ' + coins + ')', 'Play again', newCTF, true, p => {
        const b = document.createElement('button'); b.textContent = '🏠 Main menu'; b.onclick = () => showMenu(); p.appendChild(b);
      });
  }
  function drawFlag(x, y, color, carried) {
    const oy = carried ? -26 : -4;
    ctx.strokeStyle = '#ddd'; ctx.lineWidth = 3; ctx.beginPath(); ctx.moveTo(x, y + oy + 6); ctx.lineTo(x, y + oy - 28); ctx.stroke();
    ctx.fillStyle = color; ctx.beginPath(); ctx.moveTo(x, y + oy - 28); ctx.lineTo(x + 24, y + oy - 20); ctx.lineTo(x, y + oy - 12); ctx.closePath(); ctx.fill();
  }
  function newGame1P() { mode = '1p'; newGame(); }
  function newGame2P() { mode = '2p'; score1 = score2 = 0; newGame(); }
  // secret codes: type them on the start screen (there is no box!)
  let onMenu = false, typed = '', pendingCode = null;
  const aceBtn = document.getElementById('aceBtn'), acePanel = document.getElementById('acePanel'), aceIn = document.getElementById('aceIn'), aceMsg = document.getElementById('aceMsg');
  function setMenuFlag(v) { onMenu = v; aceBtn.style.display = v ? 'block' : 'none'; if (!v) acePanel.style.display = 'none'; }
  aceBtn.onclick = () => { acePanel.style.display = acePanel.style.display === 'block' ? 'none' : 'block'; aceMsg.textContent = ''; aceIn.value = ''; aceIn.focus(); };
  function submitAce() {
    const c = aceIn.value.trim();
    if (/^JAW-?1234$/i.test(c)) applyCode(true);
    else if (/^JAW-?123$/i.test(c)) applyCode(false);
    else aceMsg.textContent = 'Nothing changed.';
    aceIn.value = '';
  }
  aceIn.addEventListener('keydown', e => { e.stopPropagation(); if (e.key === 'Enter') submitAce(); });
  document.getElementById('aceGo').onclick = submitAce;
  function applyCode(pro) {
    if (pro) { aimPro = !aimPro; aimbot = aimPro; }
    else if (aimbot && !aimPro) aimbot = false;
    else { aimbot = true; aimPro = false; }
    try { localStorage.setItem('jawBattleAimbot', aimPro ? '2' : aimbot ? '1' : '0'); } catch (e) {}
    beep(aimbot ? 900 : 300, 0.15, 'square', 0.07);
    showMenu(aimPro ? '🤖 PRO Aimbot ON!' : aimbot ? '🎯 Aimbot ON!' : '🎯 Aimbot OFF.');
  }
  addEventListener('keydown', e => {
    if (!onMenu || e.key.length !== 1 || e.ctrlKey || e.metaKey) return;
    typed = (typed + e.key.toLowerCase()).slice(-8);

      const along = (rx * bl.vx + ry * bl.vy) / sp;
      const cross = (rx * bl.vy - ry * bl.vx) / sp;
      if (along > 0 && along < 260 && Math.abs(cross) < 34) dodge = cross >= 0 ? -1 : 1;
    }

    let vx = 0, vy = 0;
    const ux = dx / dist, uy = dy / dist;
    if (dodge && Math.random() < diff().dodge) {
      vx = uy * dodge; vy = -ux * dodge; // sidestep
    } else if (goal) {
      const gx = goal.x - b.x, gy = goal.y - b.y, gd = Math.hypot(gx, gy) || 1;
      const nx = gx / gd, ny = gy / gd;
      vx = nx; vy = ny;
      if (b.detourT > 0) { b.detourT--; vx += -ny * (b.detour || 1) * 1.6; vy += nx * (b.detour || 1) * 1.6; }
    } else {
      if (--b.strafeT <= 0) { b.strafe = Math.random() < 0.5 ? -1 : 1; b.strafeT = 40 + Math.random() * 80; }
      const want = los ? 270 : 0;
      const push = dist > want + 40 ? 1 : dist < want - 60 ? -1 : 0;
      vx = ux * push + -uy * b.strafe * (los ? 0.9 : 0.3);
      vy = uy * push + ux * b.strafe * (los ? 0.9 : 0.3);
    }
    const m = Math.hypot(vx, vy) || 1;
    const ox = b.x, oy = b.y;
    moveFighter(b, vx / m * speed, vy / m * speed);
    // stuck on a wall? try the other way
    if (Math.hypot(b.x - ox, b.y - oy) < speed * 0.4) { if (++b.stuck > 8) { b.strafe *= -1; b.strafeT = 40; b.stuck = 0; b.detour = Math.random() < 0.5 ? -1 : 1; b.detourT = 50; } } else b.stuck = 0;

    // aim + shoot
    const err = Math.max(0.02, diff().err - round * 0.008);
    const target = Math.atan2(dy, dx);
    let ad = target - b.aim; while (ad > Math.PI) ad -= 6.283; while (ad < -Math.PI) ad += 6.283;
    b.aim += Math.max(-0.12, Math.min(0.12, ad));
    if (los && b.cd <= 0 && Math.abs(ad) < 0.15 && Math.random() < diff().fireP + round * 0.01) {
      // pick a gun that suits the distance (from the ones this difficulty allows)
      const ok = diff().guns;
      let gi = 0;
      if (dist < 220 && ok.includes(1)) gi = 1;
      else if (dist > 450 && ok.includes(3)) gi = 3;
      else if (dist < 400 && ok.includes(2)) gi = 2;
      b.gun = gi;
      const real = b.aim; b.aim += (Math.random() - 0.5) * 2 * err; fire(b, 'b', gi); b.aim = real;
    }
  }

  function endRound(won) {
    state = 'over';
    if (mode === '2p') {
      won ? score1++ : score2++; layoutIdx++; sfx.win();
      showOverlay(true, '🏆 Player ' + (won ? '1' : '2') + ' wins!', 'Score: P1 <b>' + score1 + '</b> – <b>' + score2 + '</b> P2', 'Next round', startRound, false, p => {
        const b = document.createElement('button'); b.textContent = '🏠 Main menu'; b.onclick = () => showMenu(); p.appendChild(b);
      });
      return;
    }
    if (won) {
      const gain = 10 + { easy: 0, medium: 5, hard: 10, insane: 20 }[diffName]; coins += gain; saveStuff();
      wins++; round++; layoutIdx++;
      if (wins > best) { best = wins; try { localStorage.setItem('jawBattleBest_' + diffName, best); } catch (e) {} }
      sfx.win();
      showOverlay(true, '🎉 You win!', 'Win streak: <b>' + wins + '</b> &nbsp; 🏆 Best: ' + best + '<br>💰 +' + gain + ' coins (you have ' + coins + ')<br>The next bot is a little tougher...', 'Next round', startRound);
    } else {
      sfx.lose(); coins += 2; saveStuff();
      showOverlay(true, '💥 Bot wins!', 'You beat ' + wins + ' bot' + (wins === 1 ? '' : 's') + ' in a row.<br>🏆 Best: ' + best + '<br>💰 +2 coins (you have ' + coins + ')<br>Change the difficulty if you like:', 'Try again', newGame, true, menuLinks);
    }
  }

  // ---------- drawing ----------
  function drawFighter(f, t) {
    ctx.save(); ctx.translate(f.x, f.y);
    // shadow
    ctx.fillStyle = 'rgba(0,0,0,.3)'; ctx.beginPath(); ctx.ellipse(0, f.r - 2, f.r, 6, 0, 0, 6.283); ctx.fill();
    ctx.rotate(f.aim);
    const open = 0.25 + 0.5 * (f.cd > 0 ? 1 - f.cd / (f.maxCd || 1) : 1) * (f.cd > 0 ? 0.6 : 0.35);
    ctx.fillStyle = f.flash > 0 && (f.flash % 4 < 2) ? '#fff' : f.color;
    ctx.beginPath(); ctx.moveTo(0, 0); ctx.arc(0, 0, f.r, open, 6.283 - open); ctx.closePath(); ctx.fill();
    // teeth
    ctx.fillStyle = '#fff';
    for (const s of [-1, 1]) {
      ctx.beginPath(); const a = s * open;
      ctx.moveTo(Math.cos(a) * (f.r - 8), Math.sin(a) * (f.r - 8));
      ctx.lineTo(Math.cos(a) * f.r, Math.sin(a) * f.r);
      ctx.lineTo(Math.cos(a + s * 0.35) * (f.r - 2), Math.sin(a + s * 0.35) * (f.r - 2));
      ctx.closePath(); ctx.fill();
    }
    // eye
    ctx.fillStyle = '#120b2e'; ctx.beginPath(); ctx.arc(-3, -7, 3, 0, 6.283); ctx.fill();
    ctx.restore();
  }

  function draw(t) {
    ctx.save();
    if (shake > 0) ctx.translate((Math.random() - 0.5) * shake, (Math.random() - 0.5) * shake);
    ctx.clearRect(-10, -10, W + 20, H + 20);
    // floor grid
    ctx.strokeStyle = 'rgba(255,255,255,.04)'; ctx.lineWidth = 1;
    for (let x = 0; x <= W; x += 40) { ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, H); ctx.stroke(); }
    for (let y = 0; y <= H; y += 40) { ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(W, y); ctx.stroke(); }

    if (obstacles) {
      for (const o of obstacles) {
        if (o.type === 'w') {
          ctx.fillStyle = '#5a4bb5'; ctx.fillRect(o.x, o.y, o.w, o.h);
          ctx.strokeStyle = '#8f84d6'; ctx.lineWidth = 3; ctx.strokeRect(o.x + 1.5, o.y + 1.5, o.w - 3, o.h - 3);
        } else {
          const mine = o.type === 'b';
          ctx.fillStyle = mine ? '#1f9c86' : '#b9803f'; ctx.fillRect(o.x, o.y, o.w, o.h);
          ctx.strokeStyle = mine ? '#4fe0c0' : '#7a4f1f'; ctx.lineWidth = 3; ctx.strokeRect(o.x + 1.5, o.y + 1.5, o.w - 3, o.h - 3);
          ctx.beginPath(); ctx.moveTo(o.x, o.y); ctx.lineTo(o.x + o.w, o.y + o.h); ctx.moveTo(o.x + o.w, o.y); ctx.lineTo(o.x, o.y + o.h); ctx.stroke();
          if (o.hp < o.maxHp) { ctx.fillStyle = 'rgba(0,0,0,' + (0.6 * (o.maxHp - o.hp) / o.maxHp) + ')'; ctx.fillRect(o.x, o.y, o.w, o.h); }
        }
      }
      // build preview
      if (state === 'play' && player.blocks > 0) {
        const gx = Math.floor(mouse.x / GRID) * GRID, gy = Math.floor(mouse.y / GRID) * GRID;
        const inRange = Math.hypot(gx + GRID / 2 - player.x, gy + GRID / 2 - player.y) <= BUILD_RANGE;
        ctx.strokeStyle = inRange ? 'rgba(79,224,192,.7)' : 'rgba(255,255,255,.15)'; ctx.lineWidth = 2; ctx.setLineDash([5, 5]);
        ctx.strokeRect(gx + 1, gy + 1, GRID - 2, GRID - 2); ctx.setLineDash([]);
      }
      for (const b of bullets) {
        ctx.fillStyle = b.owner === 'p' ? b.color : '#ffc2d6';
        ctx.beginPath(); ctx.arc(b.x, b.y, b.r, 0, 6.283); ctx.fill();
        ctx.fillStyle = b.owner === 'p' ? 'rgba(79,209,255,.35)' : 'rgba(255,107,154,.35)';
        ctx.beginPath(); ctx.arc(b.x - b.vx * 0.8, b.y - b.vy * 0.8, 4, 0, 6.283); ctx.fill();
      }
      if (mode === 'ctf' && flags) {
        for (const [base, col] of [[BASE_P, '#4fd1ff'], [BASE_B, '#ff6b9a']]) {
          ctx.fillStyle = col + '22'; ctx.strokeStyle = col + '88'; ctx.lineWidth = 3; ctx.setLineDash([8, 6]);
          ctx.beginPath(); ctx.arc(base.x, base.y, BASE_R, 0, 6.283); ctx.fill(); ctx.stroke(); ctx.setLineDash([]);
        }
        drawFlag(flags.p.x, flags.p.y, '#4fd1ff', !!flags.p.carrier);
        drawFlag(flags.b.x, flags.b.y, '#ff6b9a', !!flags.b.carrier);
      }
      if (!player.dead) drawFighter(player, t);
      if (!bot.dead) drawFighter(bot, t);
      for (const p of parts) { ctx.globalAlpha = Math.min(1, p.life / 15); ctx.fillStyle = p.color; ctx.fillRect(p.x - 2, p.y - 2, 4, 4); }
      ctx.globalAlpha = 1;
      // HUD
      ctx.font = '700 20px system-ui, sans-serif'; ctx.textBaseline = 'top';
      const bar = (x, w, f, col, label, right) => {
        ctx.textAlign = right ? 'right' : 'left'; ctx.fillStyle = col; ctx.fillText(label, right ? x + w : x, 12);
        // 5 hearts: each heart is worth 4 health. Hurt hearts fade out.
        ctx.font = '22px system-ui, sans-serif'; ctx.textAlign = 'left';
        for (let i = 0; i < 5; i++) {
          const left = Math.max(0, Math.min(4, f.hp - i * 4));
          ctx.globalAlpha = left >= 4 ? 1 : left >= 2 ? 0.55 : left > 0 ? 0.3 : 0.12;
          ctx.fillText('❤️', x + i * 30, 36);
        }
        ctx.globalAlpha = 1; ctx.font = '700 20px system-ui, sans-serif';
      };
      bar(16, 150, player, '#4fd1ff', mode === '2p' ? 'P1' : 'YOU', false);
      bar(W - 166, 150, bot, '#ff6b9a', mode === '2p' ? 'P2' : 'BOT', true);
      ctx.textAlign = 'center'; ctx.fillStyle = '#cfc8f5';
      ctx.fillText(mode === 'ctf' ? 'You ' + caps1 + ' – ' + caps2 + ' Bot  (first to ' + CTF_WIN + ')' : mode === '2p' ? 'P1 ' + score1 + ' – ' + score2 + ' P2' : 'Round ' + round + '  •  Streak ' + wins, W / 2, 12);
      ctx.font = '600 14px system-ui, sans-serif'; ctx.fillStyle = '#a99ee0'; ctx.fillText(mode === '2p' ? '👥 2 Players' : diff().label, W / 2, 38);
      if (aimbot) { ctx.fillStyle = '#ff6b9a'; ctx.fillText(aimPro ? '🤖 PRO Aimbot ON' : '🎯 Aimbot ON', W / 2, 80); }
      if (mode === 'ctf') {
        ctx.font = '700 15px system-ui, sans-serif'; ctx.fillStyle = '#ffd24d'; ctx.textAlign = 'center';
        const hint = flags.b.carrier === player ? '🏃 You have the flag! Run it to your base!' : flags.p.carrier === bot ? '😱 The bot has YOUR flag! Get it back!' : player.dead ? '💀 Respawning...' : '';
        if (hint) ctx.fillText(hint, W / 2, 60);
        ctx.font = '600 13px system-ui, sans-serif'; ctx.fillStyle = '#a99ee0'; ctx.fillText('⛏ Hold E to dig a tunnel in front of you', W / 2, 100);
        if (banner && banner.t > 0) { ctx.font = '900 44px system-ui, sans-serif'; ctx.fillStyle = '#fff'; ctx.fillText(banner.text, W / 2, H / 2 - 24); }
      }
      if (toast && toast.t > 0) { ctx.font = '900 30px system-ui, sans-serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillStyle = '#ffd24d'; ctx.fillText(toast.text, W / 2, H - 90); ctx.textBaseline = 'top'; }
      // gun slots + wall blocks
      ctx.textBaseline = 'middle';
      for (let i = 0; i < GUNS.length; i++) {
        const x = 16 + i * 84, y = H - 34, sel = player.gun === i; ctx.globalAlpha = owned[i] ? 1 : 0.35;
        ctx.fillStyle = sel ? 'rgba(255,176,32,.9)' : 'rgba(255,255,255,.1)';
        ctx.beginPath(); ctx.roundRect(x, y, 78, 26, 8); ctx.fill();
        ctx.fillStyle = sel ? '#2a1a00' : '#cfc8f5'; ctx.font = '700 11px system-ui, sans-serif'; ctx.textAlign = 'center';
        ctx.fillText((owned[i] ? (i + 1) + ' ' : '🔒 ') + (GUNS[i].short || GUNS[i].name), x + 39, y + 9);
        if (owned[i]) {
          ctx.font = '700 9px system-ui, sans-serif'; ctx.textAlign = 'center'; ctx.fillText(gunLevel(i) >= 5 ? 'Lv5 MAX' : 'Lv' + gunLevel(i), x + 39, y + 19);
        }
        ctx.globalAlpha = 1;
      }
      ctx.textAlign = 'right'; ctx.fillStyle = '#4fe0c0'; ctx.font = '700 15px system-ui, sans-serif';
      ctx.fillText('🧱 ' + '■'.repeat(player.blocks) + '□'.repeat(MAX_BLOCKS - player.blocks) + '  (B)', W - 16, H - 20);
    }
    ctx.restore();
  }

  // ---------- fixed 60 fps timestep ----------
  const STEP = 1000 / 60;
  let last = 0, acc = 0;
  function frame(t) {
    requestAnimationFrame(frame);
    if (!last) last = t;
    acc += Math.min(100, t - last); last = t;
    while (acc >= STEP) { if (state === 'play') update(); acc -= STEP; }
    draw(t);
  }
  showMenu();
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
