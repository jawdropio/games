<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>JAW BATTLE</title>
<style>
  html, body { margin:0; height:100%; background:#120b2e; color:#f4f1ff; font-family:system-ui, sans-serif; overflow:hidden; touch-action:none; user-select:none; }
  body { display:grid; place-items:center; }
  canvas { background:#1d1445; border:3px solid #4b3a9e; border-radius:12px; cursor:crosshair; touch-action:none; }
  .top { position:fixed; top:10px; left:12px; right:12px; display:flex; justify-content:space-between; align-items:center; pointer-events:none; }
  .top > * { pointer-events:auto; }
  a { color:#a99ee0; text-decoration:none; font-weight:700; }
  button { font:inherit; font-weight:800; background:#6c4cff; color:#fff; border:0; border-radius:10px; padding:8px 16px; cursor:pointer; }
  button:hover { background:#8269ff; }
  #overlay { overflow:auto; position:fixed; inset:0; background:rgba(10,6,30,.78); display:grid; place-items:center; text-align:center; }
  #overlay.hide { display:none; }
  #panel { margin:0 0 18px; display:flex; flex-direction:column; gap:8px; align-items:center; }
  #panel .row { display:flex; gap:8px; align-items:center; justify-content:center; flex-wrap:wrap; }
  #panel button { font-size:16px; padding:8px 14px; background:#2c2268; }
  #panel .cards { display:grid; grid-template-columns:repeat(3, 170px); gap:10px; margin-top:6px; }
  #panel .card { padding:12px 8px; line-height:1.35; background:#33267a; border:2px solid #4b3a9e; }
  #panel .card:hover { background:#4a39a8; }
  #panel .shopgrid { display:grid; grid-template-columns:repeat(3, 210px); gap:10px; margin-top:8px; }
  .scard { background:#261c5c; border:2px solid #4b3a9e; border-radius:14px; padding:10px 8px; display:flex; flex-direction:column; gap:5px; align-items:center; text-align:center; }
  .scard .ic { font-size:38px; line-height:1.1; }
  .scard small { opacity:.85; font-size:11.5px; line-height:1.3; min-height:62px; }
  .scard.locked { opacity:.78; }
  #panel .slots { display:flex; gap:8px; flex-wrap:wrap; justify-content:center; max-width:640px; margin-top:6px; }
  #panel .slot { width:86px; padding:8px 4px; border-radius:12px; background:#261c5c; border:2px solid #4b3a9e; cursor:grab; user-select:none; text-align:center; }
  #panel .slot .ic { font-size:30px; } #panel .slot .num { font-weight:900; color:#ffb020; } #panel .slot small { font-size:10.5px; }
  #panel .slot.first { border-color:#ffb020; }
  #panel .slot.sel { background:#6c4cff; transform:scale(1.07); }
  #panel button.on { background:#ffb020; color:#2a1a00; }
  #panel button:disabled { opacity:.5; cursor:default; }
  #panel input { font:inherit; font-weight:800; font-size:18px; width:130px; text-align:center; text-transform:uppercase; padding:8px; border-radius:10px; border:2px solid #4b3a9e; background:#120b2e; color:#fff; }
  .code { font-size:30px; font-weight:900; letter-spacing:3px; color:#ffb020; }
  #aceBtn { position:fixed; left:0; top:50%; z-index:20; display:none; font-size:11px; padding:5px 8px; border-radius:0 8px 8px 0; background:#2c2268; opacity:.65; }
  #acePanel { position:fixed; left:0; top:calc(50% + 32px); z-index:20; display:none; background:#1d1445; padding:8px; border-radius:0 10px 10px 0; font-size:12px; }
  #acePanel input { font:inherit; width:110px; padding:5px; border-radius:6px; border:2px solid #4b3a9e; background:#120b2e; color:#fff; text-transform:uppercase; }
  #acePanel button { font-size:12px; padding:5px 10px; }
  #diffRow { display:flex; gap:8px; justify-content:center; margin:0 0 18px; flex-wrap:wrap; }
  #diffRow button { background:#2c2268; font-size:16px; padding:8px 14px; }
  #diffRow button.on { background:#ffb020; color:#2a1a00; }
  #overlay h1 { font-size:clamp(32px,7vw,56px); margin:0 0 10px; }
  #overlay p { margin:0 0 18px; color:#cfc8f5; line-height:1.5; }
  #overlay button { font-size:22px; padding:12px 28px; }
</style>
</head>
<body>
<div class="top">
  <a href="../">← Arcade</a>
  <button id="pauseBtn">⏸ Pause</button>
</div>
<canvas id="c" width="960" height="600"></canvas>
<div id="overlay">
  <div>
    <h1 id="ovTitle">🦷 JAW BATTLE</h1>
    <p id="ovText"></p>
    <div id="diffRow"></div>
    <div id="panel"></div>
    <button id="ovBtn">Play!</button>
  </div>
</div>

<button id="aceBtn">🕶️ Operator</button>
<div id="acePanel"><input id="aceIn" maxlength="12" placeholder="Operator code"> <button id="aceGo">OK</button><div id="aceMsg"></div></div>
<script>
(() => {
  let W = 960, H = 600;
  const cv = document.getElementById('c'), ctx = cv.getContext('2d');
  const overlay = document.getElementById('overlay');
  const ovTitle = document.getElementById('ovTitle'), ovText = document.getElementById('ovText'), ovBtn = document.getElementById('ovBtn');
  const pauseBtn = document.getElementById('pauseBtn');

  // ---------- sizing ----------
  function resize() {
    const s = Math.min((innerWidth - 20) / W, (innerHeight - 60) / H);
    cv.style.width = W * s + 'px';
    cv.style.height = H * s + 'px';
  }
  addEventListener('resize', resize); resize();
  function setArena(w, h) { if (W === w && H === h) return; W = w; H = h; cv.width = w; cv.height = h; resize(); }

  // ---------- sound ----------
  let ac = null;
  function unlockAudio() {
    try {
      if (!ac) ac = new (window.AudioContext || window.webkitAudioContext)();
      if (ac.state !== 'running') ac.resume();
    } catch (e) {}
  }
  ['pointerdown', 'keydown', 'click', 'touchend'].forEach(ev => addEventListener(ev, unlockAudio, true));
  function beep(freq, dur, type = 'square', vol = 0.06, slide = 0) {
    try {
      unlockAudio();
      if (!ac) return;
      const o = ac.createOscillator(), g = ac.createGain();
      o.type = type; o.frequency.setValueAtTime(freq, ac.currentTime);
      if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(30, freq + slide), ac.currentTime + dur);
      g.gain.setValueAtTime(vol, ac.currentTime);
      g.gain.exponentialRampToValueAtTime(0.001, ac.currentTime + dur);
      o.connect(g); g.connect(ac.destination);
      o.start(); o.stop(ac.currentTime + dur);
    } catch (e) {}
  }
  const sfx = {
    shoot: () => beep(520, 0.1, 'square', 0.05, -300),
    botShoot: () => beep(300, 0.1, 'sawtooth', 0.04, -150),
    hit: () => beep(200, 0.18, 'sawtooth', 0.08, -120),
    crate: () => beep(120, 0.08, 'triangle', 0.08),
    win: () => [523, 659, 784, 1046].forEach((f, i) => setTimeout(() => beep(f, 0.18, 'square', 0.07), i * 110)),
    lose: () => [400, 330, 260, 180].forEach((f, i) => setTimeout(() => beep(f, 0.22, 'sawtooth', 0.07), i * 140)),
  };

  // ---------- levels ----------
  // type: 'w' = solid wall, 'c' = crate (breaks after 3 hits)
  const layouts = [
    [ [450,100,60,150,'w'], [450,350,60,150,'w'], [290,140,50,50,'c'], [290,410,50,50,'c'], [620,140,50,50,'c'], [620,410,50,50,'c'] ],
    [ [210,190,22,220,'w'], [728,190,22,220,'w'], [400,270,160,60,'w'], [450,90,60,60,'c'], [450,450,60,60,'c'] ],
    [ [300,80,60,60,'w'], [300,460,60,60,'w'], [600,80,60,60,'w'], [600,460,60,60,'w'], [430,220,100,40,'c'], [430,340,100,40,'c'], [200,280,40,40,'c'], [720,280,40,40,'c'] ],
  ];

  // ---------- state ----------
  let state = 'menu'; // menu | play | paused | over
  let player, bot, fighters = [], foe, bullets, obstacles, parts, puddles = [], round = 1, wins = 0, best = 0, layoutIdx = 0, shake = 0;

  // ---------- difficulty ----------
  const DIFFS = {
    easy:   { label: '😊 Easy',   speed: 1.7, err: 0.28, cd: 1.8, fireP: 0.05, dodge: 0.2, hp: 14, guns: [0] },
    medium: { label: '😎 Medium', speed: 2.2, err: 0.16, cd: 1.2, fireP: 0.09, dodge: 0.6, hp: 20, guns: [0, 1] },
    hard:   { label: '😤 Hard',   speed: 2.7, err: 0.08, cd: 1.0, fireP: 0.13, dodge: 0.9, hp: 24, guns: [0, 1, 2] },
    insane: { label: '💀 Insane', speed: 3.3, err: 0.04, cd: 0.9, fireP: 1.0, dodge: 1.0, hp: 30, guns: [0, 1, 2, 3] },
  };
  let diffName = 'medium';
  try { const d = localStorage.getItem('jawBattleDiff'); if (DIFFS[d]) diffName = d; } catch (e) {}
  const diff = () => DIFFS[diffName];
  // coins + owned guns (saved in the browser)
  let mode = '1p', teamSize = 2, score1 = 0, score2 = 0, coins = 0, owned = [true, false, false, false, false, false, false, false, false], startMap = 0;
  try { coins = +localStorage.getItem('jawBattleCoins') || 0; const o = JSON.parse(localStorage.getItem('jawBattleGuns') || 'null'); if (Array.isArray(o)) owned = owned.map((_, i) => !!o[i]); owned[0] = true; } catch (e) {}
  // gun levels: guns level up by dealing damage with them
  const XP_AT = [0, 40, 100, 200, 400]; // only used to carry over levels earned before upgrades were for sale
  let gunLv = Array(9).fill(1), toast = null, shovelLv = 1;
  try { shovelLv = Math.max(1, Math.min(5, +localStorage.getItem('jawBattleShovel') || 1)); } catch (e) {}
  try {
    const lv = JSON.parse(localStorage.getItem('jawBattleLv') || 'null'), x = JSON.parse(localStorage.getItem('jawBattleXP') || 'null');
    if (Array.isArray(lv)) gunLv = gunLv.map((_, i) => Math.max(1, Math.min(5, +lv[i] || 1)));
    else if (Array.isArray(x)) gunLv = gunLv.map((_, i) => { let l = 1; for (let k = 1; k < XP_AT.length; k++) if ((+x[i] || 0) >= XP_AT[k]) l = k + 1; return l; });
  } catch (e) {}
  const gunLevel = i => aimbot ? 5 : gunLv[i];
  // cool gun perks: unlock at Level 3, twice as strong at Level 5
  const PERKS = [
    { id: 'crit', name: '🎯 Critical hits', desc: 'sometimes deals double damage' },
    { id: 'fire', name: '🔥 Flame pellets', desc: 'sets enemies on fire (water puts it out!)' },
    { id: 'ice', name: '❄️ Ice rounds', desc: 'slows enemies down' },
    { id: 'pierce', name: '🏹 Piercing', desc: 'shoots right through crates and blocks' },
    { id: 'seek', name: '🧲 Seeking', desc: 'bullets curve toward the enemy' },
    { id: 'bounce', name: '🎱 Super bounce', desc: 'bounces more times' },
    { id: 'boom', name: '💥 Explosive', desc: 'blows up where it lands' },
    { id: 'seek2', name: '🛰️ Heat seeker', desc: 'curves hard toward the enemy' },
    { id: 'fireboom', name: '☄️ Meteor', desc: 'fire AND explosions' },
  ];
  const botPerk = gi => (diffName === 'insane' && gi === 8) ? 'fire' : ((diffName === 'hard' || diffName === 'insane') && gi === 1) ? 'fire' : (diffName === 'insane' && gi === 2) ? 'ice' : null;
  const upCost = lv => [30, 60, 100, 150][lv - 1];
  let aimbot = false, aimPro = false, aimShots = 0;
  // OPERATOR mode (the secret code): everything unlocked and maxed, infinite coins, free ghost, infinite walls
  const own = i => aimbot || owned[i];
  const shovel = () => aimbot ? 5 : shovelLv;
  const coinText = () => aimbot ? '∞' : coins;
  // where each gun sits in the gun bar (you can rearrange it)
  let gunOrder = [0, 1, 2, 3, 4, 5, 6, 7, 8];
  try { const o = JSON.parse(localStorage.getItem('jawBattleOrder') || 'null'); if (Array.isArray(o) && o.length === 9 && [...o].sort((a, b) => a - b).every((v, i) => v === i)) gunOrder = o; } catch (e) {}
  // character skins
  let skinId = 'sky', skinsOwned = ['sky'];
  try { const v = localStorage.getItem('jawBattleSkin'); if (v) skinId = v; const o = JSON.parse(localStorage.getItem('jawBattleSkins') || 'null'); if (Array.isArray(o)) skinsOwned = o.concat(['sky']); } catch (e) {}
  let ghostOwned = false;
  try { ghostOwned = localStorage.getItem('jawBattleGhost') === '1'; } catch (e) {}
  const GHOST_MAX = 240, GHOST_COST = 2000;
  // (Operator always starts OFF when the page loads, so it can't surprise you)
  let daily = { last: '', streak: 0 };
  try { const d = JSON.parse(localStorage.getItem('jawBattleDaily') || 'null'); if (d && typeof d.last === 'string') daily = { last: d.last, streak: +d.streak || 0 }; } catch (e) {}
  const dayStr = ms => { const d = new Date(ms); return d.getFullYear() + '-' + (d.getMonth() + 1) + '-' + d.getDate(); };
  const dailyReady = () => daily.last !== dayStr(Date.now());
  const dailyReward = streak => 50 + 10 * (Math.min(streak, 7) - 1);
  // today's secret code: the boss (you!) tells friends, and the Operator screen shows it
  // special one-day codes: a big reward (coins + a skin)
  const SPECIAL_DAYS = {
    '2026-11-8': { code: 'BOSSTHEBEST', shown: 'BOSS THE BEST', coins: 1000, skin: 'tux' },
    '2026-11-9': { code: 'BOSSTHEBEST', shown: 'BOSS THE BEST', coins: 1000, skin: 'tux' },
  };
  const specialToday = () => SPECIAL_DAYS[dayStr(Date.now())] || null;
  const normCode = v => String(v).toUpperCase().replace(/[^A-Z0-9]/g, '');
  let specialDone = [];
  try { const o = JSON.parse(localStorage.getItem('jawBattleSpecialDone') || '[]'); if (Array.isArray(o)) specialDone = o; } catch (e) {}
  function claimSpecial(sp) {
    const key = dayStr(Date.now());
    if (specialDone.includes(key)) return false;
    specialDone.push(key); try { localStorage.setItem('jawBattleSpecialDone', JSON.stringify(specialDone)); } catch (e) {}
    coins += sp.coins;
    let extra = '';
    if (sp.skin && !skinsOwned.includes(sp.skin)) skinsOwned.push(sp.skin);
    if (sp.skin) { skinId = sp.skin; extra = ' and the ' + skinById(sp.skin).name + ' skin 🎩'; }
    if (dailyReady()) { const streak = daily.last === dayStr(Date.now() - 864e5) ? daily.streak + 1 : 1; daily = { last: key, streak }; try { localStorage.setItem('jawBattleDaily', JSON.stringify(daily)); } catch (e) {} }
    saveStuff();
    [660, 880, 1100, 1320].forEach((f, i) => setTimeout(() => beep(f, 0.15, 'square', 0.07), i * 90));
    showMenu('🎉 SPECIAL CODE! You got ' + sp.coins + ' coins' + extra + '!');
    return true;
  }
  function dailyCode() {
    const sp = specialToday(); if (sp) return sp.shown;
    const d = new Date(), key = d.getFullYear() * 10000 + (d.getMonth() + 1) * 100 + d.getDate();
    let h = Math.imul(key, 2654435761) >>> 0; h ^= h >>> 13; h = Math.imul(h, 0x5bd1e995) >>> 0; h ^= h >>> 15;
    return 'JAW' + String(1000 + ((h >>> 0) % 9000));
  }
  function showDaily() {
    showOverlay(true, '🎁 Daily Reward', 'Ask the game boss for today\'s secret code!' + (aimbot ? '<br>🕶️ <small>Operator sees today\'s code: <b>' + dailyCode() + '</b></small>' : ''), 'Back', () => showMenu(), false, p => {
      const row = document.createElement('div'); row.className = 'row';
      const inp = document.createElement('input'); inp.placeholder = 'Daily code'; inp.maxLength = 24;
      const go = document.createElement('button'); go.textContent = '🎁 Claim!';
      const msg = document.createElement('div'); msg.style.cssText = 'min-height:22px;font-weight:700';
      const submit = () => {
        const v = normCode(inp.value), sp = specialToday();
        if (sp && v === normCode(sp.code)) { if (!claimSpecial(sp)) { msg.textContent = '✅ You already claimed today\'s special reward!'; inp.value = ''; } }
        else if (!sp && v === normCode(dailyCode())) claimDaily();
        else { msg.textContent = '🤔 That is not today\'s code. Ask the boss!'; inp.value = ''; beep(200, 0.2, 'sawtooth', 0.06); }
      };
      inp.addEventListener('keydown', e => { e.stopPropagation(); if (e.key === 'Enter') submit(); });
      go.onclick = submit;
      row.append(inp, go); p.append(row, msg);
      setTimeout(() => inp.focus(), 50);
    });
  }
  function claimDaily() {
    if (!dailyReady()) return;
    const streak = daily.last === dayStr(Date.now() - 864e5) ? daily.streak + 1 : 1;
    const gain = dailyReward(streak);
    coins += gain; daily = { last: dayStr(Date.now()), streak };
    try { localStorage.setItem('jawBattleDaily', JSON.stringify(daily)); } catch (e) {}
    saveStuff();
    [660, 880, 1100].forEach((f, i) => setTimeout(() => beep(f, 0.15, 'square', 0.07), i * 90));
    showMenu('🎁 You got ' + gain + ' coins! Day ' + streak + ' in a row.');
  }
  function saveStuff() { try { localStorage.setItem('jawBattleCoins', coins); localStorage.setItem('jawBattleGuns', JSON.stringify(owned)); localStorage.setItem('jawBattleLv', JSON.stringify(gunLv)); localStorage.setItem('jawBattleShovel', shovelLv); localStorage.setItem('jawBattleGhost', ghostOwned ? '1' : '0'); localStorage.setItem('jawBattleOrder', JSON.stringify(gunOrder)); localStorage.setItem('jawBattleSkin', skinId); localStorage.setItem('jawBattleSkins', JSON.stringify(skinsOwned)); } catch (e) {} }
  function loadBest() { best = 0; try { best = +localStorage.getItem('jawBattleBest_' + diffName) || 0; } catch (e) {} }
  loadBest();

  // ---------- guns ----------
  const GUNS = [
    { name: 'Pistol', icon: '🔫',      cd: 16, n: 1, spread: 0.02, speed: 9,   dmg: 4, life: 140, freq: 520, color: '#bff3ff', cost: 0 },
    { name: 'Shotgun', icon: '🌋',     cd: 50, n: 5, spread: 0.40, speed: 8,   dmg: 1, life: 38,  freq: 220, color: '#ffe08a', cost: 50, info: '5 pellets, great up close' },
    { name: 'Machine Gun', icon: '⚡', short: 'M.Gun', cd: 6,  n: 1, spread: 0.14, speed: 9.5, dmg: 0.6, life: 100, freq: 700, color: '#c8ffb0', cost: 100, info: 'Super fast, tiny damage' },
    { name: 'Sniper', icon: '🎯',      cd: 75, n: 1, spread: 0,    speed: 18,  dmg: 12, life: 80,  freq: 300, color: '#ffffff', cost: 500, info: 'Slow, but 3 hearts per hit!' },
    { name: 'Triple Shot', icon: '🔱', short: 'Triple',  cd: 28, n: 3, spread: 0.30, speed: 9,   dmg: 2,   life: 120, freq: 450, color: '#ffb3f0', cost: 150, info: '3 bullets in a fan (+1 bullet per level!)' },
    { name: 'Bouncer', icon: '🏀',     short: 'Bouncer', cd: 22, n: 1, spread: 0.03, speed: 8,   dmg: 3,   life: 200, freq: 380, color: '#7dffb0', cost: 350, info: 'Bullets bounce off walls!', bounce: 3 },
    { name: 'Cannon', icon: '💣',      short: 'Cannon',  cd: 70, n: 1, spread: 0,    speed: 5,   dmg: 8,   life: 200, freq: 110, color: '#ff9a4d', cost: 700, info: 'Huge slow ball, smashes blocks', r: 11, obs: 3 },
    { name: 'Laser', icon: '🛸',       short: 'Laser',   cd: 9,  n: 1, spread: 0.02, speed: 15,  dmg: 1.2, life: 90,  freq: 900, color: '#ff5de0', cost: 250, info: 'Fast zappy shots' },
    { name: 'Mega Blaster', icon: '☄️', short: 'MEGA', cd: 7, n: 2, spread: 0.06, speed: 14, dmg: 2.5, life: 130, freq: 600, color: '#ffd700', cost: 1000, info: 'OP! Rapid double shots that blast through dirt', r: 7, obs: 3 },
  ];

  // ---------- building ----------
  const GRID = 40, BUILD_RANGE = 240, MAX_BLOCKS = 8;

  function makeFighter(x, y, color, isBot) {
    return { x, y, r: 17, hp: 20, maxHp: 20, gun: 0, digT: 0, burn: 0, slow: 0, water: 3, waterT: 0, ghostE: 240, ghosting: false, blocks: 5, blockT: 0, color, isBot, aim: isBot ? Math.PI : 0, cd: 0, flash: 0,
             // bot brain
             strafe: 1, strafeT: 0, dodge: 0, stuck: 0 };
  }

  // ---------- 500 big maps ----------
  const MAP_W = 1440, MAP_H = 900, MAP_COUNT = 500;
  // every map is autumn themed
  const THEMES = [
    { floor: '#3b1d0e', wall: '#8c4a1f', edge: '#e08a3c' }, { floor: '#3a2410', wall: '#b5651d', edge: '#ffb04d' },
    { floor: '#3d3512', wall: '#a68a2b', edge: '#f0d36a' }, { floor: '#38121c', wall: '#8e2f45', edge: '#e8798f' },
    { floor: '#26301a', wall: '#5e7a34', edge: '#a8c46a' }, { floor: '#3f2a14', wall: '#9a6a3a', edge: '#e0b27a' },
    { floor: '#2f2a2a', wall: '#7a6a5e', edge: '#c9b7a5' }, { floor: '#2e1a2f', wall: '#7a4a6e', edge: '#d79ad0' },
  ];
  const ADJ = ['Crunchy', 'Cozy', 'Golden', 'Foggy', 'Spooky', 'Harvest', 'Rustic', 'Windy', 'Misty', 'Amber', 'Toasty', 'Rusty', 'Maple', 'Cider', 'Acorn', 'Scarecrow'];
  const NOUN = ['Orchard', 'Pumpkin Patch', 'Hollow', 'Grove', 'Meadow', 'Cornfield', 'Barn Yard', 'Woods', 'Hayride', 'Cider Mill', 'Farm', 'Trail', 'Bonfire Camp', 'Leaf Pile', 'Harvest Fair', 'Hilltop'];
  let theme = THEMES[0];
  let mapSeed = 1 + Math.floor(Math.random() * MAP_COUNT);
  try { const v = +localStorage.getItem('jawBattleMap'); if (v >= 1 && v <= MAP_COUNT) mapSeed = v; } catch (e) {}
  const randMap = () => 1 + Math.floor(Math.random() * MAP_COUNT);
  function rng(seed) { let a = (seed * 2654435761) >>> 0; return () => { a = (a + 0x6D2B79F5) >>> 0; let t = a; t = Math.imul(t ^ (t >>> 15), t | 1); t ^= t + Math.imul(t ^ (t >>> 7), t | 61); return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; }
  function mapName(seed) { const r = rng(seed); r(); return ADJ[Math.floor(r() * ADJ.length)] + ' ' + NOUN[Math.floor(r() * NOUN.length)]; }
  function carveRect(list, x1, y1, x2, y2) {
    const out = []; let dug = false;
    for (const o of list) {
      if (x1 >= o.x + o.w || x2 <= o.x || y1 >= o.y + o.h || y2 <= o.y) { out.push(o); continue; }

      if (player.burn > 0 && !player.dead) { ctx.font = '900 24px system-ui, sans-serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'top'; ctx.fillStyle = '#ff8a2b'; ctx.fillText("🔥 YOU'RE BURNING! Press 0 or Q for water 💧", W / 2, 120); ctx.textBaseline = 'middle'; }
      if (ghostOwned || aimbot) {
        const gw = 120, gx = W - 16 - gw, gy = H - 50, fr = aimbot ? 1 : Math.max(0, player.ghostE) / GHOST_MAX;
        ctx.fillStyle = 'rgba(255,255,255,.15)'; ctx.fillRect(gx, gy, gw, 8);
        ctx.fillStyle = '#b9a6ff'; ctx.fillRect(gx, gy, gw * fr, 8);
        ctx.font = '700 12px system-ui, sans-serif'; ctx.textAlign = 'right'; ctx.fillStyle = '#b9a6ff'; ctx.fillText('👻 hold G', gx - 6, gy + 4);
      }
      ctx.textAlign = 'right'; ctx.fillStyle = '#4fe0c0'; ctx.font = '700 15px system-ui, sans-serif';
      ctx.fillText(aimbot ? '🧱 ∞  (B)' : '🧱 ' + '■'.repeat(player.blocks) + '□'.repeat(MAX_BLOCKS - player.blocks) + '  (B)', W - 16, H - 20);
    }
    ctx.restore();
  }

  // ---------- fixed 60 fps timestep ----------
  const STEP = 1000 / 60;
  let last = 0, acc = 0;
  function frame(t) {
    requestAnimationFrame(frame);
    if (!last) last = t;
    acc += Math.min(100, t - last); last = t;
    while (acc >= STEP) { if (state === 'play') update(); acc -= STEP; }
    draw(t);
  }
  showMenu();
  requestAnimationFrame(frame);
})();
</script>
</body>
