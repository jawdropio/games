<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>7 isles</title>
<style>
  html, body { margin:0; height:100%; overflow:hidden; color:#fff; font-family:system-ui, sans-serif; user-select:none; -webkit-user-select:none;
    background:#2a7bad; }
  html, body { touch-action:none; }
  #zoom { position:fixed; inset:0; transform-origin:0 0; }
  #board { position:fixed; left:50%; top:50%; width:100vmin; height:100vmin; transform:translate(-50%,-50%); }
  .spot { position:absolute; width:27%; height:17%; transform:translate(-50%,-50%); box-sizing:border-box;
          border:3px dashed rgba(255,255,255,.7); border-radius:50%; background:rgba(255,255,255,.12);
          display:grid; place-items:center; text-align:center; font-weight:800; font-size:clamp(10px, 1.9vmin, 20px); text-shadow:0 1px 3px rgba(0,0,0,.5); }
  .spot.sand { background:rgba(236,200,120,.55); border-color:#f3d98b; }
  .spot span { display:block; font-size:2.6em; line-height:1; }
  /* A real island picture: no oval, no border, just the island */
  .spot.pic { width:31%; height:auto; border:0; border-radius:0; background:none; display:block; }
  .spot.pic canvas { display:block; width:100%; height:auto; pointer-events:none; }
  .bar { position:fixed; z-index:5; top:12px; }
  #left { left:12px; display:flex; gap:8px; align-items:center; } #right { right:12px; display:flex; gap:8px; align-items:center; }
  #tools { display:none; gap:8px; align-items:center; }
  body.erasing #tools { display:flex; }
  body.erasing .spot.pic canvas { pointer-events:auto; cursor:crosshair; touch-action:none; }
  #size { width:110px; }
  #eraser.on { background:#e0457b; }
  #confirm:not(:disabled) { background:#1f9d55; }
  #tools .btn:disabled { opacity:.45; cursor:default; }
  .btn, .bar a { display:inline-block; background:rgba(18,11,46,.78); color:#fff; border:2px solid rgba(255,255,255,.35); border-radius:12px;
                 padding:8px 14px; font:700 16px system-ui, sans-serif; text-decoration:none; cursor:pointer; }
  .btn:hover, .bar a:hover { background:rgba(60,40,140,.9); }
  #pause { position:fixed; inset:0; z-index:10; background:rgba(18,11,46,.75); display:none; place-items:center; text-align:center; }
  #pause.on { display:grid; }
  #pause h1 { font-size:48px; margin:0 0 14px; }
  /* Eraser and zoom buttons are hidden for now. Delete this line to bring them back. */
  #eraser, #tools, #zin, #zout, #zfit { display:none !important; }
  /* ---- 7 Isles game screens ---- */
  /* The game is switched OFF for now: only the islands show. To bring it back, delete the next line and set PLAY = true in the game script. */
  .ui, #banner, #frame { display:none !important; }
  .ui { position:fixed; z-index:6; background:rgba(18,11,46,.9); color:#fff; border:2px solid rgba(255,255,255,.25); border-radius:14px; padding:10px 12px; font:600 14px system-ui, sans-serif; }
  #hud { top:58px; left:12px; width:200px; font-size:13px; max-height:calc(100vh - 150px); overflow:auto; display:none; }
  #hud h4 { margin:8px 0 4px; font-size:13px; color:#c9bfff; text-transform:uppercase; letter-spacing:.5px; }
  #hud h4:first-child { margin-top:0; }
  .prow { display:flex; gap:6px; align-items:center; padding:2px 0; }
  .prow.turn { background:rgba(255,255,255,.14); border-radius:8px; }
  .rgrid { display:grid; grid-template-columns:1fr 1fr; gap:2px 8px; }
  .rgrid span.zero { opacity:.4; }
  #log div { font-weight:500; font-size:12.5px; padding:2px 0; border-top:1px solid rgba(255,255,255,.1); }
  #info { top:58px; right:12px; width:270px; max-height:calc(100vh - 150px); overflow:auto; display:none; }
  #info h3 { margin:0 0 6px; font-size:20px; }
  #info table { width:100%; border-collapse:collapse; margin-top:6px; }
  #info td { padding:3px 2px; border-top:1px solid rgba(255,255,255,.12); font-weight:600; }
  #info td.hit { background:#2d7a46; border-radius:6px; }
  #info .tip { font-weight:500; font-size:12.5px; opacity:.85; margin-top:8px; }
  #turnbar { bottom:12px; left:50%; transform:translateX(-50%); display:none; flex-direction:column; gap:6px; align-items:center; max-width:96vw; }
  .trow { display:flex; gap:8px; align-items:center; flex-wrap:wrap; justify-content:center; }
  .sep { width:2px; height:28px; background:rgba(255,255,255,.25); }
  #hint { font-size:15px; font-weight:800; color:#ffe27a; }
  .btn.go { background:#1f9d55; animation:pulse 1.2s ease-in-out infinite; }
  @keyframes pulse { 50% { box-shadow:0 0 0 6px rgba(31,157,85,.35); } }
  .tabs { margin:10px 0 8px; display:flex; gap:6px; flex-wrap:wrap; }
  .tabs .btn.on { background:#e0457b; }
  #hud details { margin-top:6px; }
  #hud summary { cursor:pointer; font-size:13px; color:#c9bfff; text-transform:uppercase; letter-spacing:.5px; font-weight:800; }
  #who { font-weight:800; }
  .die { display:inline-block; font-size:30px; line-height:1; width:34px; text-align:center; }
  #sum { font-size:16px; min-width:22px; text-align:center; }
  #turnbar { padding:6px 10px; }
  #turnbar .btn { padding:5px 10px; font-size:14px; }
  #hint { font-size:13px !important; }
  #turnbar.min .trow > *:not(#minBtn), #turnbar.min #hint { display:none; }
  #resbar { top:12px; left:50%; transform:translateX(-50%); display:none; max-width:calc(100vw - 620px); min-width:140px; text-align:center; padding:6px 12px; font-size:14px; }
  #resbar b { color:#ffe27a; }
  .chip.picked { background:#2d7a46; }
  .mbox select { font:600 15px system-ui, sans-serif; padding:4px 6px; border-radius:8px; margin-right:6px; }
  #banner { position:fixed; top:56px; left:50%; transform:translateX(-50%); z-index:5; padding:6px 22px; font:800 18px system-ui, sans-serif; border-radius:99px; border:3px solid transparent; pointer-events:none; display:none; color:#fff; }
  #banner.mine { background:#1f9d55; }
  #banner.other { background:rgba(18,11,46,.92); }
  #frame { position:fixed; inset:0; border:6px solid transparent; pointer-events:none; z-index:4; display:none; box-sizing:border-box; transition:border-color .3s; }
  #turnbar.mine { border-color:#1f9d55; }
  #resbar { cursor:pointer; }
  .invgrid { display:grid; grid-template-columns:repeat(3,1fr); gap:6px; margin:4px 0 6px; }
  .mbox .invgrid { grid-template-columns:repeat(auto-fill,minmax(96px,1fr)); }
  .inv { background:rgba(255,255,255,.1); border-radius:10px; text-align:center; padding:4px 2px; }

  .mbox .inv .e { font-size:32px; } .mbox .inv b { font-size:20px; } .mbox .inv small { font-size:12px; }
  .invh { font-size:12px; opacity:.75; margin-top:4px; }
  .crown { position:absolute; left:50%; top:0; transform:translate(-50%,-55%); font-size:max(18px,3.4vmin); line-height:1; pointer-events:none; display:none; }

  @keyframes bob { 50% { transform:translate(-50%,-72%); } }
  .spot.cap { z-index:3; }
  .btn:disabled { opacity:.4; cursor:default; }
  .modal { inset:0; background:rgba(0,0,0,.55); display:none; place-items:center; padding:0; border:0; border-radius:0; z-index:8; }
  .modal.on { display:grid; }
  .mbox { background:#1d1445; border:2px solid rgba(255,255,255,.3); border-radius:16px; padding:14px 16px; width:min(760px,94vw); max-height:88vh; overflow:auto; position:relative; }
  .mbox h2 { margin:0 0 8px; }
  .mclose { position:absolute; top:8px; right:10px; }
  .cards { display:grid; grid-template-columns:repeat(auto-fill,minmax(210px,1fr)); gap:8px; }

  .card b { font-size:15px; }
  .card .use { font-weight:500; font-size:12.5px; opacity:.85; margin:3px 0 5px; }
  .need { color:#ff9a9a; }
  .have { color:#9af0b4; }
  .grp { margin:12px 0 4px; color:#c9bfff; font-size:13px; text-transform:uppercase; }
  .chip { display:inline-block; background:rgba(255,255,255,.12); border-radius:99px; padding:3px 10px; margin:2px; }
  #start { z-index:9; }
  #start .mbox { text-align:center; }
  #start .btn { display:block; width:100%; margin:8px 0; font-size:18px; }
  .lbl { position:absolute; left:50%; bottom:-1vmin; transform:translate(-50%,100%); white-space:nowrap; pointer-events:none;
         font:800 max(10px,1.5vmin) system-ui, sans-serif; background:rgba(18,11,46,.85); color:#fff; border-radius:99px; padding:.3vmin 1vmin; }
  .spot.pic canvas { filter:drop-shadow(0 0 .9vmin var(--own, transparent)); }
  .spot.sel canvas { filter:drop-shadow(0 0 .8vmin #fff) drop-shadow(0 0 1.6vmin var(--own, #ffd84a)); }
  .spot:not(.pic) { border-color:var(--own, rgba(255,255,255,.7)); }
  .spot.sel:not(.pic) { border-style:solid; border-color:#fff; }
  /* ---- island info card (shows when you press an island) ---- */
  #isleCard { position:fixed; top:56px; right:12px; width:min(330px,86vw); max-height:calc(100vh - 80px); overflow:auto; z-index:6; display:none;
              background:rgba(18,11,46,.94); color:#fff; border:2px solid rgba(255,255,255,.3); border-radius:16px; padding:12px 14px 14px; font:500 14px/1.4 system-ui, sans-serif; }
  #isleCard.on { display:block; }
  #isleCard h2 { margin:0 0 2px; font-size:24px; }
  #isleCard .sub { opacity:.75; font-size:13px; margin-bottom:6px; }
  #isleCard .row { margin-top:8px; }
  #isleCard .row b { display:block; color:#ffd84a; font-size:12px; text-transform:uppercase; letter-spacing:.5px; }
  #isleCard ul { margin:2px 0 0; padding-left:18px; }
  #isleCard .hl { margin-top:6px; font-size:15px; }
  #isleCard .hl b { color:#ffd84a; }
  #isleCard .tip2 { font-size:12px; opacity:.75; margin-top:2px; }
  #isleCard .atk { display:block; width:100%; margin:10px 0 2px; padding:9px; border:0; border-radius:10px; background:#d93a4a; color:#fff; font:800 16px system-ui, sans-serif; cursor:pointer; }
  #isleCard .atk:hover { background:#f04b5c; }
  #atkMsg { font-size:13px; opacity:.85; min-height:16px; margin-top:2px; }
  #isleCard .x { position:absolute; top:8px; right:10px; background:rgba(255,255,255,.15); color:#fff; border:0; border-radius:8px; font:700 16px system-ui; padding:2px 9px; cursor:pointer; }
  /* ---- shop ---- */
  #shopPanel { position:fixed; inset:0; z-index:8; display:none; background:rgba(0,0,0,.55); place-items:center; }
  #shopPanel.on { display:grid; }
  #shopBox { width:min(920px,95vw); max-height:90vh; overflow:auto; background:#1d1445; border:2px solid rgba(255,255,255,.3); border-radius:18px; color:#fff; font:500 14px/1.35 system-ui, sans-serif; position:relative; }
  #shopHead { position:sticky; top:0; z-index:2; background:#1d1445; padding:12px 16px 8px; border-bottom:1px solid rgba(255,255,255,.15); }
  #shopHead h2 { margin:0 0 6px; font-size:24px; }
  #shopNav { display:flex; gap:6px; flex-wrap:wrap; }
  #shopNav button { background:rgba(255,255,255,.12); color:#fff; border:0; border-radius:99px; padding:5px 12px; font:700 13px system-ui, sans-serif; cursor:pointer; }
  #shopNav button:hover { background:rgba(255,255,255,.25); }
  #shopX { position:absolute; top:10px; right:12px; background:rgba(255,255,255,.15); color:#fff; border:0; border-radius:8px; font:700 18px system-ui; padding:3px 11px; cursor:pointer; }
  #shopBody2 { padding:6px 16px 18px; }
  .shSec h3 { margin:18px 0 8px; font-size:18px; color:#ffd84a; border-bottom:2px solid rgba(255,216,74,.35); padding-bottom:4px; }
  .shGrid { display:grid; grid-template-columns:repeat(auto-fill,minmax(210px,1fr)); gap:10px; }
  .shCard { background:rgba(255,255,255,.08); border-radius:14px; padding:10px 12px; }
  .shCard .ic { font-size:34px; line-height:1; }
  .shCard .nm { font-weight:800; font-size:16px; margin:2px 0; }
  .shCard .us { opacity:.85; font-size:13px; margin:2px 0 6px; }
  .shCard .lb { font-size:11px; text-transform:uppercase; letter-spacing:.5px; opacity:.65; margin-top:4px; }
  .shChip { display:inline-block; background:rgba(255,255,255,.14); border-radius:99px; padding:2px 9px; margin:2px 3px 0 0; font-size:13px; white-space:nowrap; }
  .shChip.need { background:rgba(224,69,123,.35); color:#fff; }
</style>
</head>
<body>
<div id="zoom"><div id="board"></div></div>
<div class="bar" id="left"><a href="../">← Arcade</a><button class="btn" id="zin" title="Zoom in">＋</button><button class="btn" id="zout" title="Zoom out">－</button><button class="btn" id="zfit" title="Show everything">⌂</button></div>
<div class="bar" id="right">
  <span id="tools"><input type="range" id="size" min="10" max="150" value="40" title="Eraser size"><button class="btn" id="confirm" disabled>✔ Confirm</button><button class="btn" id="cancel" disabled>✖ Cancel</button><button class="btn" id="undo">↩ Undo</button><button class="btn" id="reset">🗑 Reset</button></span>
  <button class="btn" id="eraser" title="Erase a spot and show water">🧽 Eraser</button>
  <button class="btn" id="shopOpen">🛒 Shop</button>
  <button class="btn" id="pauseBtn" title="Pause (P or Esc)">⏸ Pause</button></div>
<div id="pause"><div><h1>⏸ Paused</h1><button class="btn" id="resume">▶ Keep playing</button></div></div>
<div class="ui" id="hud"></div>
<div class="ui" id="resbar" title="Open your inventory"></div>
<div id="banner"></div>
<div id="frame"></div>
<div class="ui" id="info"></div>
<div class="ui" id="turnbar">
  <div id="hint"></div>
  <div class="trow">
    <span id="who"></span>
    <span id="dice"><span class="die" id="d1">⚀</span><span class="die" id="d2">⚁</span><b id="sum"></b></span>
    <button class="btn" id="rollBtn">🎲 Roll</button>
    <button class="btn" id="endBtn">End turn ➜</button>
    <span class="sep"></span>
    <button class="btn" id="shopBtn">🛒 Shop</button>
    <button class="btn" id="tradeBtn">🔁 Trade</button>
    <button class="btn" id="alliBtn">🤝 Alliances</button>
    <button class="btn" id="minBtn" title="Hide or show this bar">▾</button>
  </div>
</div>
<div class="ui modal" id="shopM"><div class="mbox"><button class="btn mclose" data-close="shopM">✖</button><div id="shopBody"></div></div></div>
<div class="ui modal" id="rollM"><div class="mbox" style="text-align:center"><div id="rollBody"></div></div></div>
<div class="ui modal" id="sumM"><div class="mbox" style="text-align:center"><div id="sumBody"></div><button class="btn go" id="sumOk" style="margin-top:12px;font-size:18px">Let's play! 👑</button></div></div>
<div class="ui modal" id="invM"><div class="mbox"><button class="btn mclose" data-close="invM">✖</button><div id="invBody"></div></div></div>
<div class="ui modal" id="tradeM"><div class="mbox"><button class="btn mclose" data-close="tradeM">✖</button><div id="tradeBody"></div></div></div>
<div class="ui modal" id="offerM"><div class="mbox"><div id="offerBody"></div></div></div>
<div class="ui modal" id="alliM"><div class="mbox"><button class="btn mclose" data-close="alliM">✖</button><div id="alliBody"></div></div></div>
<div class="ui modal on" id="start"><div class="mbox"><h2>🏝️ 7 Isles</h2>
  <p>Rule the seas and <b>capture Duneshade</b> to win! You are 🔵. The other rulers are bots.</p>
  <button class="btn" data-players="2">2 players · 3 islands each</button>
  <button class="btn" data-players="3">3 players · 2 islands each</button>
  <button class="btn" data-players="6">6 players · 1 island each</button>
</div></div>
<script>
(function () {
  // One spot per island, placed around a circle (first one at the top)
  var ISLANDS = [
    { name: 'Goldenfield', icon: '🌾', pic: 'assets/gemini_generated_image_tl4x6jtl4x6jtl4x.jpeg', kind: 'blue',
      erase: [[-2,91,104,11], [-2,74,24,22], [22,81,20,12], [86,49,18,14], [95,61,4,5], [88,74,11,17]] },   // erase = writing and compass
    { name: 'Bluewater',   icon: '🌊', pic: 'assets/gemini_generated_image-3-.jpeg', kind: 'teal', erase: [[0,0,100,14.6]] },   // erase = the sky
    { name: 'Wildheart',   icon: '🐎', pic: 'assets/gemini_generated_image-4-.jpeg', kind: 'blue',
      heal: [[65,49,12,7], [72.5,61.8,10.5,6.2]],                                                // writing on the grass
      erase: [[-2,92,104,10], [-2,78,38,15], [83,25.5,12,7], [88.5,75,9,15]] },                    // writing, banner, compass in the water
    { name: 'Timberroot',  icon: '🌲', pic: 'assets/gemini_generated_image-7-.jpeg', kind: 'gray', fill: true, key: 'Timberroot-2' },
    { name: 'Ironhold',    icon: '⛰️', pic: 'assets/gemini_generated_image-9-.jpeg', kind: 'gray', fill: true, key: 'Ironhold-3',
      heal: [[57.2, 62.9, 11, 8.1, 'warm']],                      // the words on the big sign
      erase: [[0, 0, 40.5, 9.3], [68, 0, 32, 9.3]] },               // faraway hills on both sides of the peak
    { name: 'Skyreach',    icon: '☁️', pic: 'assets/skyreach.png', ready: true, key: 'Skyreach-2' },
    { name: 'Duneshade',   icon: '🏜️', sand: true }
  ];
  // Turn a picture into "just the island": the water becomes see-through, writing/sky are erased,
  // and any little floating specks are removed. "kind" tells which kind of water to remove.
  function cutOut(img, spot, isl) {
    var w = img.naturalWidth, h = img.naturalHeight;
    var c = document.createElement('canvas'); c.width = w; c.height = h;
    var g = c.getContext('2d'); g.drawImage(img, 0, 0);
    var d = g.getImageData(0, 0, w, h), px = d.data, i;
    if (isl.ready) {                                     // this picture is already cut out (see-through background): just trim the empty edges
      var rx0 = w, ry0 = h, rx1 = 0, ry1 = 0, rx, ry;
      for (ry = 0; ry < h; ry++) for (rx = 0; rx < w; rx++) {
        if (px[(ry * w + rx) * 4 + 3] > 40) { if (rx < rx0) rx0 = rx; if (rx > rx1) rx1 = rx; if (ry < ry0) ry0 = ry; if (ry > ry1) ry1 = ry; }
      }
      var ro = document.createElement('canvas'); ro.width = rx1 - rx0 + 1; ro.height = ry1 - ry0 + 1;
      ro.getContext('2d').drawImage(c, rx0, ry0, ro.width, ro.height, 0, 0, ro.width, ro.height);
      var rb = document.createElement('canvas'); rb.width = ro.width; rb.height = ro.height;
      rb.getContext('2d').drawImage(ro, 0, 0);
      spot.appendChild(ro);
      registerEraser(isl.key || isl.name, ro, rb, rx0, ry0);
      return;
    }
    // "heal": writing printed on the grass is painted over with the grass beside it
    (isl.heal || []).forEach(function (e) {
      var x0 = Math.max(0, Math.round(e[0] * w / 100)), x1 = Math.min(w, Math.round((e[0] + e[2]) * w / 100));
      var y0 = Math.max(0, Math.round(e[1] * h / 100)), y1 = Math.min(h, Math.round((e[1] + e[3]) * h / 100));
      var rw = x1 - x0, rh = y1 - y0, m = new Uint8Array(rw * rh), m2 = new Uint8Array(rw * rh), x, y, dx, dy, o;
      for (y = 0; y < rh; y++) for (x = 0; x < rw; x++) {
        o = ((y0 + y) * w + x0 + x) * 4;
        var lo = Math.min(px[o], px[o + 1], px[o + 2]), hi = Math.max(px[o], px[o + 1], px[o + 2]);
        if (e[4] === 'warm' ? (px[o] - px[o + 2] > 30) : (lo > 185 || hi < 70)) m[y * rw + x] = 1;   // letters (white with dark outlines, or orange-ish on a sign)
      }
      for (y = 0; y < rh; y++) for (x = 0; x < rw; x++) if (m[y * rw + x])
        for (dy = -2; dy <= 2; dy++) for (dx = -2; dx <= 2; dx++) {
          var xx = x + dx, yy = y + dy; if (xx >= 0 && xx < rw && yy >= 0 && yy < rh) m2[yy * rw + xx] = 1;
        }
      for (y = 0; y < rh; y++) for (x = 0; x < rw; x++) if (m2[y * rw + x]) {
        var l = x, r2 = x;
        while (l >= 0 && m2[y * rw + l]) l--;
        while (r2 < rw && m2[y * rw + r2]) r2++;
        var a = l >= 0 ? ((y0 + y) * w + x0 + l) * 4 : -1, b2 = r2 < rw ? ((y0 + y) * w + x0 + r2) * 4 : -1;
        o = ((y0 + y) * w + x0 + x) * 4;
        for (var c2 = 0; c2 < 3; c2++) px[o + c2] = a >= 0 && b2 >= 0 ? (px[a + c2] + px[b2 + c2]) / 2 : px[(a >= 0 ? a : b2) + c2];
      }
    });
    for (i = 0; i < px.length; i += 4) {
      var r = px[i], gr = px[i + 1], b = px[i + 2], blue;
      if (isl.kind === 'teal') {                         // bright turquoise sea
        blue = Math.min((b - r - 40) / 30, (Math.max(gr, b) - 135) / 25);
        if ((i / 4 / w) < h * 0.24) blue = Math.max(blue, Math.min((b - r - 8) / 20, (Math.max(gr, b) - 150) / 20));   // pale hazy sea near the horizon
      } else if (isl.kind === 'gray') {                  // dull grey-blue sea
        blue = (gr > b + 2) ? 0 : (b - r - 22) / 10;
      } else {                                           // deep blue sea
        blue = (b - r - 25) / 30;
        if (gr > b + 3) blue = 0;                        // greens and yellows are land
      }
      px[i + 3] = 255 * (1 - Math.max(0, Math.min(1, blue)));
    }
    // "fill": only the sea that touches the edge of the picture goes away, so nothing inside the island can turn see-through
    if (isl.fill) {
      var T = isl.seaT || 22, N = w * h, reach = new Uint8Array(N), st = new Int32Array(N), top = 0, p0, q, it;
      var seaLike = function (pp, t) { var oo = pp * 4; return px[oo + 2] - px[oo] >= t && px[oo + 1] <= px[oo + 2] + 2; };

      }

        p0 = st[--top]; var sx = p0 % w, sy = (p0 / w) | 0;

        if (sx < w - 1 && !reach[q = p0 + 1] && seaLike(q, T)) push(q);

      var reached = 0; for (p0 = 0; p0 < N; p0++) reached += reach[p0];
      if (reached < N * 0.78) for (p0 = 0; p0 < N; p0++) px[p0 * 4 + 3] = reach[p0] ? 0 : 255;   // (if it ate almost everything, keep the normal cut-out)
    }
    if (isl.keep) {
      var kx0 = Math.round(isl.keep[0] * w / 100), kx1 = Math.round((isl.keep[0] + isl.keep[2]) * w / 100);
      var ky0 = Math.round(isl.keep[1] * h / 100), ky1 = Math.round((isl.keep[1] + isl.keep[3]) * h / 100);
      for (var ky = 0; ky < h; ky++) for (var kx = 0; kx < w; kx++) if (kx < kx0 || kx >= kx1 || ky < ky0 || ky >= ky1) px[(ky * w + kx) * 4 + 3] = 0;
    }
    (isl.erase || []).forEach(function (e) {
      var x0 = Math.max(0, Math.round(e[0] * w / 100)), x1 = Math.min(w, Math.round((e[0] + e[2]) * w / 100));
      var y0 = Math.max(0, Math.round(e[1] * h / 100)), y1 = Math.min(h, Math.round((e[1] + e[3]) * h / 100));
      for (var y = y0; y < y1; y++) for (var x = x0; x < x1; x++) px[(y * w + x) * 4 + 3] = 0;

    var seen = new Uint8Array(w * h), stack = new Int32Array(w * h), p, n;
    for (var s0 = 0; s0 < w * h; s0++) {

    }

    out.getContext('2d').drawImage(c, minX, minY, out.width, out.height, 0, 0, out.width, out.height);

  // ---- Eraser: rub out any spot of an island and the water shows through ----
  var STORE = '7isles-eraser-v1', strokes = {}, history = [], views = {}, eraserOn = false;
  try { strokes = JSON.parse(localStorage.getItem(STORE)) || {}; } catch (e) { strokes = {}; }

  var pendingList = [];                    // rubs that are waiting for the Confirm button
  function updateButtons() {

  }
  function paintStroke(v, st, preview) {

    g.save(); g.globalCompositeOperation = preview ? 'source-atop' : 'destination-out'; g.lineCap = g.lineJoin = 'round';
    g.lineWidth = st.r * 2; g.fillStyle = g.strokeStyle = preview ? 'rgba(255,40,110,.55)' : '#000';
    g.beginPath(); g.arc(p[0][0] - v.ox, p[0][1] - v.oy, st.r, 0, 7); g.fill();
    g.beginPath(); g.moveTo(p[0][0] - v.ox, p[0][1] - v.oy);

  }

    g.clearRect(0, 0, v.out.width, v.out.height); g.drawImage(v.base, 0, 0);

  }

    var v = views[name] = { out: out, base: base, ox: ox, oy: oy };
    (strokes[name] || []).forEach(function (st) { history.push({ name: name, st: st }); });

    var cur = null;

      if (!cur) return;

    function end() {

    }

  var board = document.getElementById('board'), R = 38;
  ISLANDS.forEach(function (isl, i) {
    var a = -Math.PI / 2 + i * 2 * Math.PI / ISLANDS.length;
    var s = document.createElement('div');
    s.className = 'spot' + (isl.sand ? ' sand' : '') + (isl.pic ? ' pic' : ''); s.dataset.name = isl.name;
    s.style.left = (50 + R * Math.cos(a)) + '%'; s.style.top = (50 + R * Math.sin(a)) + '%';

  document.getElementById('eraser').onclick = function () {

  };

  // ---- Zoom and move around: scroll wheel, pinch, + / − buttons, and drag the background ----
  var zoomEl = document.getElementById('zoom'), zs = 1, zx = 0, zy = 0, ZMAX = 1;   // ZMAX 1 = zoom is OFF (set to 8 to bring it back)

<script>
(function () {
  var PLAY = false;                      // game is switched off for now (islands only)
  if (!PLAY) return;
  var $ = function (id) { return document.getElementById(id); };
  var RES = { 'Bird Feathers':'🪶', 'Crystal Shards':'💎', 'Wind Iron':'🌀', 'Iron':'⚙️', 'Stone':'🪨', 'Gold':'🪙', 'Wheat':'🌾',
              'Fruit':'🍎', 'Wood':'🪵', 'Pearls':'🦪', 'Fish':'🐟', 'Horses':'🐴', 'Leather':'🟤', 'Arrows':'🏹' };
  // Dice numbers for every resource (two dice: 2 to 12). EDIT THESE to match your real board!
  var ISL = {
    Skyreach:    { icon:'☁️', hp:20, spaces:{ 'Bird Feathers':[3,10], 'Crystal Shards':[5,9], 'Wind Iron':[4,11] } },
    Ironhold:    { icon:'⛰️', hp:20, spaces:{ 'Iron':[6,8], 'Stone':[4,10], 'Gold':[2,12] } },
    Goldenfield: { icon:'🌾', hp:20, spaces:{ 'Wheat':[5,9], 'Fruit':[4,10] } },
    Timberroot:  { icon:'🌲', hp:20, min:{ 'Wood':2 }, spaces:{ 'Wood':[4,6,8,9] } },
    Bluewater:   { icon:'🌊', hp:20, spaces:{ 'Pearls':[3,11], 'Fish':[5,9] } },

  var NORMAL = ['Skyreach', 'Ironhold', 'Goldenfield', 'Timberroot', 'Bluewater', 'Wildheart'];
  var COLORS = ['#4aa3ff', '#ff5a5a', '#3fd46b', '#ffd23f', '#b46bff', '#ff9a3c'];
  var DOTS = ['🔵', '🔴', '🟢', '🟡', '🟣', '🟠'];
  var NAMES = ['You', 'Red Bot', 'Green Bot', 'Gold Bot', 'Purple Bot', 'Orange Bot'];
  var DICE = ['⚀', '⚁', '⚂', '⚃', '⚄', '⚅'];
  // The crafting recipes (only what is on your recipe list!)
  var RECIPES = [
    { g:'Boats', name:'Trade Boat', icon:'⛵', cost:{ 'Wood':8, 'Stone':3, 'Leather':3 }, use:'Holds 10 resources. Reusable. You need a boat to trade!' },
    { g:'Boats', name:'Exploding Boat', icon:'💥', cost:{ 'Iron':3, 'Wood':5, 'Crystal Shards':2 }, use:'Destroys a Normal Boat and everything on it. Cannot destroy Flying Boats.' },
    { g:'Boats', name:'Robber Boat', icon:'🏴‍☠️', cost:{ 'Iron':3, 'Wood':5 }, use:'Steals 5 resources from another boat. Reusable.' },
    { g:'Boats', name:'Flying Boat', icon:'🎈', cost:{ 'Bird Feathers':2 }, needs:{ 'Trade Boat':1 }, use:'Cannot be blown up or robbed.' },
    { g:'Food', name:'Bread', icon:'🍞', cost:{ 'Wheat':3 }, use:'Feeds 5 people.' },
    { g:'Food', name:'Golden Bread', icon:'🥇', cost:{ 'Wheat':5, 'Fruit':1, 'Gold':1 }, use:'Feeds a whole island.' },

  ];
  function recipe(n) { return RECIPES.filter(function (r) { return r.name === n; })[0]; }

  var G = null, selected = null, pendingUse = null;

  function pick(a) { return a[Math.floor(Math.random() * a.length)]; }

  // ----- everyone rolls: the highest number picks first and plays first -----

  }
  $('rollBody').addEventListener('click', function (e) {
    if (e.target.id === 'roGo') rollTied();

  document.querySelectorAll('[data-players]').forEach(function (b) { b.onclick = function () { startGame(+b.dataset.players); }; });

  function ownedBy(pi) { return NORMAL.filter(function (nm) { return G.isl[nm].owner === pi; }); }

    if (trade.give === trade.get) { trade.msg = 'Pick two different resources!'; return; }
    if ((me.res[trade.give] || 0) < trade.giveN) { trade.msg = "You don't have that many!"; return; }
    var yes = (bot.res[trade.get] || 0) >= trade.getN && (trade.giveN > trade.getN || (trade.giveN === trade.getN && Math.random() < 0.9));
    if (yes) {
      me.res[trade.give] -= trade.giveN; bot.res[trade.give] = (bot.res[trade.give] || 0) + trade.giveN;
      bot.res[trade.get] -= trade.getN; me.res[trade.get] = (me.res[trade.get] || 0) + trade.getN;
      trade.msg = '✅ ' + bot.name + ' said yes! You gave ' + trade.giveN + RES[trade.give] + ' and got ' + trade.getN + RES[trade.get] + '.';
      say('🔁 Trade with ' + bot.name + ': gave ' + trade.giveN + RES[trade.give] + ', got ' + trade.getN + RES[trade.get]);
    } else trade.msg = '❌ ' + bot.name + ' said no thanks.';
  }
  function maybeOffer(pi) {                              // a bot sometimes offers YOU a trade
    var P = G.players[pi], me = G.players[0];
    if (!hasBoat(pi) || Math.random() > 0.5) return false;       // bots need a boat too
    var mine = Object.keys(me.res).filter(function (k) { return me.res[k] > 0; });
    var spare = Object.keys(P.res).filter(function (k) { return P.res[k] >= 2; });
    if (!mine.length || !spare.length) return false;
    var get = pick(mine), give = pick(spare.filter(function (k) { return k !== get; }));
    if (!give) return false;
    var n = 1 + Math.floor(Math.random() * Math.min(2, P.res[give], me.res[get]));
    G.offer = { from: pi, give: { res: give, n: n }, get: { res: get, n: n } };
    say('🔁 ' + P.name + ' wants to trade with you!'); return true;
  }
  function waitOffer(cb) { var ticks = 0; (function w() { if (!G.offer || ++ticks > 50) { G.offer = null; refresh(); cb(); } else later(w, 400); })(); }

      (can ? '' : '<div class="need">You don\'t have enough ' + o.get.res + '.</div>') +
      '<div style="margin-top:10px"><button class="btn go" data-offer="yes"' + (can ? '' : ' disabled') + '>✅ Accept</button> <button class="btn" data-offer="no">No thanks</button></div>';
    m.classList.add('on');
  }
  $('offerBody').addEventListener('click', function (e) {
    var a = e.target.dataset && e.target.dataset.offer, o = G && G.offer; if (!a || !o) return;
    var me = G.players[0], P = G.players[o.from];
    if (a === 'yes' && (me.res[o.get.res] || 0) >= o.get.n) {
      me.res[o.get.res] -= o.get.n; P.res[o.get.res] = (P.res[o.get.res] || 0) + o.get.n;
      P.res[o.give.res] -= o.give.n; me.res[o.give.res] = (me.res[o.give.res] || 0) + o.give.n;
      say('🔁 You traded with ' + P.name + ': got ' + o.give.n + RES[o.give.res] + ', gave ' + o.get.n + RES[o.get.res]);
    } else say('🔁 You said no thanks to ' + P.name);
    G.offer = null; refresh();
  });
  $('resbar').onclick = function () { $('invM').classList.add('on'); renderInv(); };
  $('tradeBtn').onclick = function () { $('tradeM').classList.add('on'); renderTrade(); };
  $('tradeBody').addEventListener('change', function (e) {
    var id = e.target.id;
    if (id === 'tGive') trade.give = e.target.value;
    if (id === 'tGiveN') trade.giveN = +e.target.value;
    if (id === 'tGet') trade.get = e.target.value;
    if (id === 'tGetN') trade.getN = +e.target.value;
    trade.msg = ''; renderTrade();
  });
  $('tradeBody').addEventListener('click', function (e) {
    var d = e.target.dataset || {};
    if (d.partner) { trade.partner = +d.partner; trade.msg = ''; renderTrade(); }

  });

  $('rollBtn').onclick = function () { if (G && G.turn === 0 && !G.rolled && !G.rolling) doRoll(0); };

  ['shopM', 'alliM', 'tradeM', 'invM'].forEach(function (id) { $(id).addEventListener('pointerdown', function (e) { if (e.target === $(id)) { $(id).classList.remove('on'); pendingUse = null; } }); });
  $('shopBody').addEventListener('click', function (e) {
    var t = e.target; if (!t.dataset) return;
    if (t.dataset.tab) { shopTab = t.dataset.tab; pendingUse = null; renderShop(); return; }
    if (t.dataset.craft && G.turn === 0) { var r = recipe(t.dataset.craft); if (craft(0, r)) say('🔨 You made ' + r.icon + ' ' + r.name); refresh(); }
    if (t.dataset.use) { pendingUse = t.dataset.use; renderShop(); }
    if (t.dataset.target && pendingUse && G.turn === 0) { if (recipe(pendingUse).cap) placeBuilding(0, pendingUse, t.dataset.target); else useDrought(0, pendingUse, t.dataset.target); pendingUse = null; refresh(); }
  });
  $('alliBody').addEventListener('change', function (e) {

    var names = [].slice.call(document.querySelectorAll('[data-pick]')).filter(function (c) { return c.checked; }).map(function (c) { var P = G.players[+c.dataset.pick]; return P.dot + ' ' + P.name; });

      var picks = [].slice.call(document.querySelectorAll('[data-pick]')).filter(function (c) { return c.checked; }).map(function (c) { return +c.dataset.pick; });
      if (!picks.length) { $('allyMsg').textContent = 'Pick at least one player!'; return; }
      if (picks.length + 1 >= G.n) { $('allyMsg').textContent = 'An alliance cannot include every player!'; return; }
      formAlliance(0, picks);
    }
    if (a === 'end') endAlliance();
    if (a === 'leave') leaveAlliance(0);
    refresh();
  });
  $('info').addEventListener('click', function (e) { if (e.target.id === 'infoX') { selected = null; refresh(); } });
  $('info').addEventListener('change', function (e) { if (e.target.id === 'focusSel' && selected) { G.isl[selected].focus = e.target.value; } });
  // Which island is under the mouse? Look at the real picture pixels, so see-through corners of a neighbour don't steal the click.
  function islandAt(x, y) {
    var spots = [].slice.call(document.querySelectorAll('.spot')).reverse();
    for (var i = 0; i < spots.length; i++) {
      var sp = spots[i], c = sp.querySelector('canvas'), r = (c || sp).getBoundingClientRect();
      if (x < r.left || x > r.right || y < r.top || y > r.bottom || !r.width || !r.height) continue;

        var a = c.getContext('2d').getImageData(Math.floor((x - r.left) / r.width * c.width), Math.floor((y - r.top) / r.height * c.height), 1, 1).data[3];
        if (a > 25) return sp.dataset.name;
      } catch (err) { return sp.dataset.name; }

  }

    if (moved > 6 || (e.target.closest && e.target.closest('.ui, .bar, #pause'))) return;
    var nm = islandAt(e.clientX, e.clientY);
    if (G.choosing && nm && G.isl[nm] && G.isl[nm].owner === 0) { G.capital[0] = nm; G.choosing = false; say('👑 ' + nm + ' is your capital!'); }

  });
})();
