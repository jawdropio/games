<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>music</title>
<style>
  * { box-sizing:border-box; }
  html, body { margin:0; height:100%; background:#120b2e; color:#f4f1ff; font-family:system-ui, sans-serif; overflow:hidden; user-select:none; -webkit-user-select:none; }
  #fx { position:fixed; inset:0; width:100%; height:100%; pointer-events:none; z-index:1; }
  .arcade { position:fixed; top:12px; left:12px; color:#a99ee0; text-decoration:none; font-weight:700; z-index:5; }
  h1 { text-align:center; margin:14px 0 4px; font-size:clamp(24px,5vw,40px); }
  .sub { text-align:center; color:#a99ee0; margin:0 0 10px; font-size:14px; }
  .bar { display:flex; gap:8px; justify-content:center; flex-wrap:wrap; padding:0 10px; position:relative; z-index:5; }
  button { background:#2b1d6b; color:#f4f1ff; border:2px solid #5b46c9; border-radius:10px; padding:8px 14px; font-size:15px; font-weight:700; cursor:pointer; }
  button:hover { background:#3b2a8f; }
  button.on { background:#c0392b; border-color:#ff7b6b; }
  #pauseBtn { position:fixed; top:10px; right:12px; z-index:6; }
  #piano { position:absolute; left:3%; right:3%; bottom:8%; height:min(55vh,360px); z-index:2; }
  .white { position:absolute; top:0; bottom:0; width:10%; background:#fff; border:2px solid #333; border-radius:0 0 10px 10px; color:#555; display:flex; align-items:flex-end; justify-content:center; padding-bottom:10px; font-weight:800; font-size:clamp(12px,2.2vw,20px); }
  .black { position:absolute; top:0; height:60%; width:6%; background:#111; border-radius:0 0 8px 8px; color:#bbb; display:flex; align-items:flex-end; justify-content:center; padding-bottom:8px; font-weight:800; font-size:clamp(10px,1.8vw,16px); z-index:3; }
  .white.down { background:var(--c); }
  .black.down { background:var(--c); color:#000; }
  #msg { text-align:center; color:#a99ee0; margin-top:10px; min-height:20px; position:relative; z-index:5; }
  #pauseOv { position:fixed; inset:0; background:rgba(10,5,30,.85); display:none; place-items:center; text-align:center; z-index:10; }
  #pauseOv.show { display:grid; }
  #pauseOv h2 { font-size:48px; margin:0 0 10px; }
</style>
</head>
<body>
<a class="arcade" href="../">← Arcade</a>
<button id="pauseBtn">⏸ Pause</button>
<canvas id="fx"></canvas>
<h1>🎹 music</h1>
<p class="sub">Press the letters on your keyboard (or click the keys) to play notes!</p>
<div class="bar">
  <button id="recBtn">⏺ Record</button>
  <button id="playBtn">▶ Play song</button>
  <button id="waveBtn">🎸 Sound: Piano</button>
</div>
<div id="msg"></div>
<div id="piano"></div>
<div id="pauseOv"><div><h2>⏸ Paused</h2><p>Press P or Esc to keep jamming</p><button id="resumeBtn">▶ Resume</button></div></div>

<script>
(() => {
  // ---- notes: [name, frequency, key, isBlack, whiteIndex] ----
  const WHITE = [
    ['C4',261.63,'a'],['D4',293.66,'s'],['E4',329.63,'d'],['F4',349.23,'f'],['G4',392.00,'g'],
    ['A4',440.00,'h'],['B4',493.88,'j'],['C5',523.25,'k'],['D5',587.33,'l'],['E5',659.25,';']
  ];
  // black keys sit after white index i
  const BLACK = [
    ['C#4',277.18,'w',0],['D#4',311.13,'e',1],['F#4',369.99,'t',3],['G#4',415.30,'y',4],
    ['A#4',466.16,'u',5],['C#5',554.37,'o',7],['D#5',622.25,'p',8]
  ];
  const COLORS = ['#ff6b6b','#ffa94d','#ffe066','#69db7c','#38d9a9','#4dabf7','#748ffc','#da77f2','#f783ac','#ff8787'];

  const piano = document.getElementById('piano');
  const els = {}, freqs = {};
  WHITE.forEach((n,i) => {
    const d = document.createElement('div');
    d.className = 'white'; d.style.left = (i*10)+'%'; d.style.setProperty('--c', COLORS[i]);
    d.textContent = n[2].toUpperCase();
    piano.appendChild(d); els[n[0]] = d; freqs[n[0]] = n[1]; n.el = d; n.color = COLORS[i];
  });
  BLACK.forEach(n => {
    const d = document.createElement('div');
    d.className = 'black'; d.style.left = ((n[3]+1)*10 - 3)+'%'; d.style.setProperty('--c', COLORS[n[3]]);
    d.textContent = n[2].toUpperCase();
    piano.appendChild(d); els[n[0]] = d; freqs[n[0]] = n[1]; n.color = COLORS[n[3]];
  });
  const colorOf = {}; WHITE.forEach(n=>colorOf[n[0]]=n.color); BLACK.forEach(n=>colorOf[n[0]]=n.color);
  const keyMap = {}; WHITE.concat(BLACK).forEach(n => keyMap[n[2]] = n[0]);

  // ---- sound ----
  let ctx = null;
  const WAVES = [['Piano','triangle'],['Beepy','square'],['Smooth','sine'],['Buzzy','sawtooth']];
  let waveIdx = 0;
  const held = {};
  function audio() {
    if (!ctx) { try { ctx = new (window.AudioContext||window.webkitAudioContext)(); } catch(e){} }
    if (ctx && ctx.state === 'suspended') ctx.resume();
    return ctx;
  }
  function startTone(note) {
    const a = audio(); if (!a || held[note]) return;
    const o = a.createOscillator(), g = a.createGain();
    o.type = WAVES[waveIdx][1]; o.frequency.value = freqs[note];
    const t = a.currentTime;
    g.gain.setValueAtTime(0, t);
    g.gain.linearRampToValueAtTime(0.35, t+0.015);
    g.gain.exponentialRampToValueAtTime(0.15, t+0.4);
    o.connect(g); g.connect(a.destination); o.start();
    held[note] = {o,g};
  }
  function stopTone(note) {
    const h = held[note]; if (!h) return;
    const t = ctx.currentTime;
    h.g.gain.cancelScheduledValues(t);
    h.g.gain.setValueAtTime(Math.max(h.g.gain.value,0.001), t);
    h.g.gain.exponentialRampToValueAtTime(0.001, t+0.25);
    h.o.stop(t+0.3);
    delete held[note];
  }
  function stopAll() { Object.keys(held).forEach(stopTone); Object.keys(els).forEach(n=>els[n].classList.remove('down')); }

  // ---- recording ----
  let recording = false, recStart = 0, song = [], playTimers = [];
  const msg = document.getElementById('msg');
  const recBtn = document.getElementById('recBtn'), playBtn = document.getElementById('playBtn');

  function press(note, fromPlayback) {
    if (!freqs[note]) return;
    startTone(note); els[note].classList.add('down');
    sparkle(note);
    if (recording && !fromPlayback) song.push({n:note, t:performance.now()-recStart, d:'down'});
  }
  function release(note, fromPlayback) {
    if (!freqs[note]) return;
    stopTone(note); els[note].classList.remove('down');
    if (recording && !fromPlayback) song.push({n:note, t:performance.now()-recStart, d:'up'});
  }

  function stopPlayback() { playTimers.forEach(clearTimeout); playTimers = []; playBtn.textContent = '▶ Play song'; stopAll(); }
  recBtn.onclick = () => {
    audio();
    stopPlayback();
    if (!recording) { recording = true; song = []; recStart = performance.now(); recBtn.classList.add('on'); recBtn.textContent = '⏹ Stop'; msg.textContent = '🔴 Recording... play your song!'; }
    else { recording = false; recBtn.classList.remove('on'); recBtn.textContent = '⏺ Record'; msg.textContent = song.length ? '✅ Song saved! Press Play song.' : 'Nothing recorded. Try again!'; }
  };
  playBtn.onclick = () => {
    audio();
    if (playTimers.length) { stopPlayback(); return; }
    if (recording) recBtn.onclick();
    if (!song.length) { msg.textContent = 'Record a song first! ⏺'; return; }
    stopAll();
    playBtn.textContent = '⏹ Stop';
    msg.textContent = '🎶 Playing your song...';
    song.forEach(ev => playTimers.push(setTimeout(() => ev.d==='down' ? press(ev.n,true) : release(ev.n,true), ev.t)));
    const end = song[song.length-1].t + 400;
    playTimers.push(setTimeout(() => { stopPlayback(); msg.textContent = '🎉 Nice song!'; }, end));
  };
  document.getElementById('waveBtn').onclick = e => {
    waveIdx = (waveIdx+1) % WAVES.length;
    e.target.textContent = '🎸 Sound: ' + WAVES[waveIdx][0];
  };

  // ---- pause ----
  let paused = false;
  const ov = document.getElementById('pauseOv');
  function setPause(p) {
    paused = p; ov.classList.toggle('show', p);
    document.getElementById('pauseBtn').textContent = p ? '▶ Resume' : '⏸ Pause';
    if (p) { stopPlayback(); stopAll(); }
  }
  document.getElementById('pauseBtn').onclick = () => setPause(!paused);
  document.getElementById('resumeBtn').onclick = () => setPause(false);

  // ---- keyboard ----
  addEventListener('keydown', e => {
    if (e.repeat) return;
    const k = e.key.toLowerCase();
    if (k === 'p' || k === 'escape') { setPause(!paused); return; }
    if (paused || e.ctrlKey || e.metaKey || e.altKey) return;
    if (keyMap[k]) press(keyMap[k]);
  });
  addEventListener('keyup', e => { const k = e.key.toLowerCase(); if (keyMap[k]) release(keyMap[k]); });
  addEventListener('blur', stopAll);

  // ---- mouse / touch ----
  const pointerNote = {};
  piano.addEventListener('pointerdown', e => {
    if (paused) return;
    const name = Object.keys(els).find(n => els[n] === e.target);
    if (!name) return;
    e.preventDefault();
    pointerNote[e.pointerId] = name; press(name);
  });
  const up = e => { const n = pointerNote[e.pointerId]; if (n) { release(n); delete pointerNote[e.pointerId]; } };
  addEventListener('pointerup', up); addEventListener('pointercancel', up);

  // ---- sparkles (fixed 60 updates/sec) ----
  const cv = document.getElementById('fx'), c2 = cv.getContext('2d');
  function fit() { cv.width = innerWidth; cv.height = innerHeight; }
  addEventListener('resize', fit); fit();
  const parts = [], EMOJI = ['♪','♫','♩','♬','★'];
  function sparkle(note) {
    const r = els[note].getBoundingClientRect();
    for (let i=0;i<4;i++) parts.push({x:r.left+r.width/2+(Math.random()-.5)*r.width*.6, y:r.top, vx:(Math.random()-.5)*2, vy:-2-Math.random()*3, life:70, ch:EMOJI[Math.random()*EMOJI.length|0], col:colorOf[note]});
  }
  function update() {
    for (let i=parts.length-1;i>=0;i--) { const p=parts[i]; p.x+=p.vx; p.y+=p.vy; p.vy+=0.02; if(--p.life<=0) parts.splice(i,1); }
  }
  function draw() {
    c2.clearRect(0,0,cv.width,cv.height);
    c2.font = '28px system-ui';
    for (const p of parts) { c2.globalAlpha = Math.min(1,p.life/30); c2.fillStyle = p.col; c2.fillText(p.ch,p.x,p.y); }
    c2.globalAlpha = 1;
  }
  const STEP = 1000/60; let last = performance.now(), acc = 0;
  function frame(now) {
    acc += Math.min(now-last, 250); last = now;
    while (acc >= STEP) { if (!paused) update(); acc -= STEP; }
    draw(); requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
